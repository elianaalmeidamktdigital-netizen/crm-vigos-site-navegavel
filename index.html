exigem este campo\u003c/div>' +\n      '\u003cdiv class=\"stage-tags\" id=\"ed-etapas-tags\">' + tagsHtml + '\u003c/div>\u003c/div>';\n  } else if (c.tipoEdicao === 'visivel') {\n    titulo.textContent = 'Editar ' + c.nome;\n    corpo.innerHTML =\n      '\u003cdiv class=\"field-label\">' + c.nome + ' \u003cspan class=\"req\">*\u003c/span>\u003c/div>' +\n      '\u003cinput class=\"field-input\" id=\"ed-nome\" value=\"' + c.nome + '\">' +\n      '\u003cdiv class=\"toggle-row\" style=\"border-top:none;\">\u003cdiv class=\"toggle-row-body\">\u003cstrong>Campo visível\u003c/strong>\u003cspan>Define se esse campo é exibido no CRM Vigos\u003c/span>\u003c/div>\u003cdiv class=\"toggle-switch ' + (c.campoVisivel ? 'on' : '') + '\" id=\"ed-campo-visivel\" onclick=\"toggleSwitch(this)\">\u003cdiv class=\"toggle-knob\">\u003c/div>\u003c/div>\u003c/div>' +\n      '\u003clabel style=\"display:flex;align-items:center;gap:6px;margin:12px 0;cursor:pointer;\">\u003cinput type=\"checkbox\" id=\"ed-exibir-formulario\" ' + (c.exibirFormulario ? 'checked' : '') + '>\u003cspan style=\"font-size:12px;\">Exibir no formulário\u003c/span>\u003c/label>' +\n      '\u003cdiv class=\"field-label\">Funis\u003c/div>' +\n      '\u003cdiv style=\"border:1px solid #E2E8F0;border-radius:6px;padding:6px 10px;\">\u003cspan style=\"display:inline-flex;align-items:center;gap:6px;background:#F8FAFC;border-radius:12px;padding:3px 10px;font-size:12px;\">Todos os funis\u003c/span>\u003c/div>';\n  }\n  document.getElementById('overlay-editar').classList.add('open');\n}\nfunction toggleEtapaTag(el) {\n  var etapa = el.getAttribute('data-etapa');\n  var c = ent().padrao.find(function(x) { return x.id === STATE.editandoId; });\n  var i = c.etapas.indexOf(etapa);\n  if (i > -1) { c.etapas.splice(i, 1); el.classList.remove('on'); el.textContent = etapa; }\n  else { c.etapas.push(etapa); el.classList.add('on'); el.textContent = etapa + ' ✓'; }\n}\nfunction toggleSwitchEtapaBloco(el) {\n  toggleSwitch(el);\n  var bloco = document.getElementById('ed-bloco-etapas');\n  bloco.style.display = el.classList.contains('on') ? 'block' : 'none';\n}\n\nfunction abrirEditarPersonalizado(id) {\n  toggleMenu(id);\n  var c = ent().personalizados.find(function(x) { return x.id === id; });\n  STATE.editandoTipo = 'personalizado';\n  STATE.editandoId = id;\n  document.getElementById('editar-titulo').textContent = 'Editar campo personalizado';\n  var corpo = document.getElementById('editar-corpo');\n  var isSelecao = (c.tipoRaw === 'selecao_unica' || c.tipoRaw === 'selecao_multipla');\n  var opcoesHtml = '';\n  if (isSelecao) {\n    opcoesHtml = '\u003cdiv style=\"border-top:0.5px solid #F0F3F6;padding-top:14px;margin-bottom:14px;\">\u003cdiv style=\"font-size:13px;font-weight:600;margin-bottom:10px;\">Opções da lista\u003c/div>' +\n      (c.opcoes || []).map(function(o) { return '\u003cdiv class=\"opt-row\">\u003cinput value=\"' + o.replace(/\"/g, '&quot;') + '\" readonly>\u003c/div>'; }).join('') + '\u003c/div>';\n  }\n  corpo.innerHTML =\n    '\u003cdiv class=\"field-label\">Nome do campo \u003cspan class=\"req\">*\u003c/span>\u003c/div>' +\n    '\u003cinput class=\"field-input\" id=\"ed-nome\" value=\"' + c.nome + '\">' +\n    opcoesHtml +\n    '\u003cdiv class=\"toggle-row\" style=\"border-top:none;\">\u003cdiv class=\"toggle-row-body\">\u003cstrong>Obrigatório\u003c/strong>\u003c/div>\u003cdiv class=\"toggle-switch ' + (c.obrigatorio ? 'on' : '') + '\" id=\"ed-obrigatorio\" onclick=\"toggleSwitch(this)\">\u003cdiv class=\"toggle-knob\">\u003c/div>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"toggle-row\">\u003cdiv class=\"toggle-row-body\">\u003cstrong>Único\u003c/strong>\u003c/div>\u003cdiv class=\"toggle-switch ' + (c.unico ? 'on' : '') + '\" id=\"ed-unico\" onclick=\"toggleSwitch(this)\">\u003cdiv class=\"toggle-knob\">\u003c/div>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"toggle-row\">\u003cdiv class=\"toggle-row-body\">\u003cstrong>Visível no cadastro\u003c/strong>\u003c/div>\u003cdiv class=\"toggle-switch ' + (c.visivel ? 'on' : '') + '\" id=\"ed-visivel\" onclick=\"toggleSwitch(this)\">\u003cdiv class=\"toggle-knob\">\u003c/div>\u003c/div>\u003c/div>';\n  document.getElementById('overlay-editar').classList.add('open');\n}\n\nfunction fecharEditar() { document.getElementById('overlay-editar').classList.remove('open'); }\n\nfunction salvarEdicao() {\n  var nomeEl = document.getElementById('ed-nome');\n  if (nomeEl && !nomeEl.value.trim()) {\n    nomeEl.classList.add('error');\n    showToast('Nome do campo é obrigatório');\n    return;\n  }\n  if (STATE.editandoTipo === 'padrao') {\n    var c = ent().padrao.find(function(x) { return x.id === STATE.editandoId; });\n    c.nome = nomeEl.value.trim();\n    if (c.tipoEdicao === 'simples') {\n      c.obrigatorio = document.getElementById('ed-obrigatorio').classList.contains('on');\n    } else if (c.tipoEdicao === 'porEtapa') {\n      c.obrigatorioPorEtapa = document.getElementById('ed-obrigatorio-etapa').classList.contains('on');\n    } else if (c.tipoEdicao === 'visivel') {\n      c.campoVisivel = document.getElementById('ed-campo-visivel').classList.contains('on');\n      c.exibirFormulario = document.getElementById('ed-exibir-formulario').checked;\n    }\n  } else {\n    var cp = ent().personalizados.find(function(x) { return x.id === STATE.editandoId; });\n    cp.nome = nomeEl.value.trim();\n    cp.obrigatorio = document.getElementById('ed-obrigatorio').classList.contains('on');\n    cp.unico = document.getElementById('ed-unico').classList.contains('on');\n    cp.visivel = document.getElementById('ed-visivel').classList.contains('on');\n  }\n  renderTudo();\n  fecharEditar();\n  showToast('Alterações salvas');\n}\n\n/* ---------- Exclusão ---------- */\nfunction enviarParaLixeira(id) {\n  toggleMenu(id);\n  showToast('Solicitação enviada, aguardando aprovação do Administrador');\n}\nfunction abrirModalPermanente(id) {\n  toggleMenu(id);\n  STATE.excluindoId = id;\n  var c = ent().personalizados.find(function(x) { return x.id === id; });\n  document.getElementById('modal-texto').textContent = 'O campo \"' + c.nome + '\" será removido de forma definitiva. Esta ação não pode ser desfeita.';\n  document.getElementById('chk-confirma-exclusao').checked = false;\n  atualizarBotaoExcluir();\n  document.getElementById('modal-permanente').classList.add('open');\n}\nfunction fecharModalPermanente() { document.getElementById('modal-permanente').classList.remove('open'); }\nfunction atualizarBotaoExcluir() {\n  var checked = document.getElementById('chk-confirma-exclusao').checked;\n  var btn = document.getElementById('btn-confirmar-exclusao');\n  btn.className = checked ? 'btn-danger' : 'btn-disabled';\n}\nfunction confirmarExclusaoPermanente() {\n  if (!document.getElementById('chk-confirma-exclusao').checked) return;\n  var e = ent();\n  e.personalizados = e.personalizados.filter(function(c) { return c.id !== STATE.excluindoId; });\n  renderTudo();\n  fecharModalPermanente();\n  showToast('Campo excluído permanentemente');\n}\n\n/* ---------- Perfil ---------- */\ndocument.getElementById('btn-perfil-admin').addEventListener('click', function() { setPerfil('admin'); });\ndocument.getElementById('btn-perfil-usuario').addEventListener('click', function() { setPerfil('usuario'); });\nfunction setPerfil(p) {\n  STATE.perfil = p;\n  document.getElementById('btn-perfil-admin').classList.toggle('active', p === 'admin');\n  document.getElementById('btn-perfil-usuario').classList.toggle('active', p === 'usuario');\n  renderTudo();\n}\n\nrenderTudo();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"fontes":{"icon":"📣","title":"Fontes e Campanhas","description":"Criação, busca, permissões e exclusões simuladas.","stat":"Fluxo funcional completo","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>Protótipo, Fontes e Campanhas\u003c/title>\n\u003cstyle>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; background: #F7F9FB; color: #16232F; }\n  .topbar { background: #0A1F35; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }\n  .topbar-left { color: #fff; font-size: 14px; font-weight: 600; }\n  .profile-toggle { display: flex; align-items: center; gap: 8px; background: #16324F; border-radius: 8px; padding: 6px 10px; }\n  .profile-toggle span { color: #94A3B8; font-size: 11px; }\n  .profile-toggle button { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: #94A3B8; }\n  .profile-toggle button.active { background: #00D9C0; color: #04342C; font-weight: 600; }\n  .page { padding: 20px; max-width: 900px; margin: 0 auto; }\n  .breadcrumb { font-size: 11px; color: #94A3B8; margin-bottom: 6px; }\n  .page-title { font-size: 20px; font-weight: 600; color: #16232F; margin-bottom: 16px; }\n  .tabs { display: flex; gap: 20px; border-bottom: 1px solid #E2E8F0; margin-bottom: 16px; font-size: 13px; }\n  .tab { padding-bottom: 8px; color: #94A3B8; cursor: pointer; border-bottom: 2px solid transparent; }\n  .tab.active { color: #16232F; font-weight: 600; border-bottom-color: #00D9C0; }\n  .desc-line { font-size: 12px; color: #94A3B8; margin-bottom: 14px; }\n  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }\n  .toggle-row-label { font-size: 12px; color: #16232F; }\n  .toggle-switch { width: 34px; height: 18px; border-radius: 9px; position: relative; flex-shrink: 0; cursor: pointer; background: #E2E8F0; transition: background 0.15s; }\n  .toggle-switch.on { background: #00D9C0; }\n  .toggle-knob { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: left 0.15s; }\n  .toggle-switch.on .toggle-knob { left: 18px; }\n  .btn-primary { background: #0A1F35; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: none; cursor: pointer; margin-bottom: 16px; }\n  .btn-primary:disabled { background: #E2E8F0; color: #94A3B8; cursor: not-allowed; }\n  .btn-secondary { border: 1px solid #E2E8F0; background: #fff; font-size: 13px; padding: 9px 16px; border-radius: 6px; cursor: pointer; color: #16232F; }\n  .search-box { border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #16232F; margin-bottom: 16px; max-width: 280px; width: 100%; display: block; }\n  .create-form { background: #F7F9FB; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; display: none; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }\n  .create-form.open { display: flex; }\n  .field-block { flex: 1; min-width: 160px; }\n  .field-label { font-size: 12px; color: #16232F; margin-bottom: 6px; }\n  .field-label .req { color: #E45858; }\n  .field-input { width: 100%; border: 1px solid #CBD5E1; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #16232F; background: #fff; }\n  .field-input.error { border-color: #E45858; }\n  .error-text { color: #E45858; font-size: 11px; margin-top: 4px; }\n  .table-wrap { border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden; }\n  .row-header { display: flex; padding: 8px 14px; font-size: 11px; color: #94A3B8; border-bottom: 1px solid #E2E8F0; background: #FAFBFC; }\n  .row { display: flex; align-items: center; padding: 9px 14px; font-size: 12px; border-bottom: 0.5px solid #F0F3F6; }\n  .row:last-child { border-bottom: none; }\n  .col-check { width: 24px; }\n  .col-name { flex: 2; color: #16232F; }\n  .col-desc { flex: 1; color: #94A3B8; }\n  .col-date { flex: 1; color: #94A3B8; }\n  .col-action { width: 32px; text-align: center; }\n  .icon-btn { color: #94A3B8; cursor: pointer; font-size: 14px; }\n  .empty-state { padding: 20px 14px; font-size: 12px; color: #94A3B8; text-align: center; }\n  .bulk-bar { display: none; align-items: center; gap: 8px; background: #465B70; color: #fff; font-size: 12px; padding: 10px 14px; border-radius: 6px 6px 0 0; cursor: pointer; }\n  .bulk-bar.open { display: flex; }\n  .blocked-tag { font-size: 10px; color: #E45858; margin-left: 6px; }\n  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,31,53,0.45); align-items: center; justify-content: center; z-index: 50; }\n  .modal-overlay.open { display: flex; }\n  .modal-box { background: #fff; border-radius: 10px; width: 360px; padding: 20px; }\n  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }\n  .modal-text { font-size: 13px; color: #16232F; margin-bottom: 16px; }\n  .modal-blocked { background: #FEF3E2; border: 1px solid #F5A623; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; font-size: 12px; color: #9A6314; }\n  .confirm-check { display: flex; align-items: center; gap: 8px; background: #FCEAEA; border: 1px solid #E45858; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; cursor: pointer; }\n  .confirm-check input { width: 14px; height: 14px; }\n  .confirm-check span { font-size: 12px; color: #791F1F; }\n  .modal-actions { display: flex; justify-content: space-between; align-items: center; }\n  .link-btn { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }\n  .link-btn.lixeira { color: #0A1F35; }\n  .link-btn.permanente { color: #94A3B8; cursor: not-allowed; }\n  .link-btn.permanente.enabled { color: #E45858; cursor: pointer; }\n  .modal-close { text-align: right; margin-top: 12px; }\n  .modal-close button { border: none; background: none; color: #94A3B8; font-size: 12px; cursor: pointer; }\n  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16232F; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 60; }\n  .toast.show { opacity: 1; }\n\u003c/style>\n\u003cstyle>\n  .proto-banner{display:none!important}\n  .app-shell{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}\n  .app-sidebar,.sidebar{display:none!important}\n  body{background:#fff!important;color:#102d3d!important}\n  .app-topbar,.topbar{background:#fff!important;color:#102d3d!important;border-bottom:1px solid #e3e9ee!important}\n  .app-content{padding:28px 34px!important}\n  button,.btn{border-radius:6px!important}\n  .btn.primary,.btn-primary{background:#06283b!important;color:#fff!important}\n  .summary-card{border:1px solid #e3e9ee!important;background:#f8fafb!important}\n  table th{color:#607486!important;font-weight:600!important}\n  .entity-icon{font-family:Inter,sans-serif!important}\n\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"topbar\">\n  \u003cdiv class=\"topbar-left\">CRM Vigos\u003c/div>\n  \u003cdiv class=\"profile-toggle\">\n    \u003cspan>Perfil:\u003c/span>\n    \u003cbutton id=\"btn-perfil-admin\" class=\"active\">Administrador\u003c/button>\n    \u003cbutton id=\"btn-perfil-usuario\">Usuário\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n  \u003cdiv class=\"breadcrumb\">Configurações\u003c/div>\n  \u003cdiv class=\"page-title\" id=\"page-title\">Fontes\u003c/div>\n\n  \u003cdiv class=\"tabs\">\n    \u003cdiv class=\"tab active\" data-tab=\"fontes\">FONTES\u003c/div>\n    \u003cdiv class=\"tab\" data-tab=\"campanhas\">CAMPANHAS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"desc-line\" id=\"desc-line\">Gerenciar as fontes das negociações.\u003c/div>\n\n  \u003cdiv class=\"toggle-row\">\n    \u003cdiv class=\"toggle-row-label\" id=\"toggle-label\">Permitir que usuários criem novas fontes\u003c/div>\n    \u003cdiv class=\"toggle-switch\" id=\"toggle-permissao\">\u003cdiv class=\"toggle-knob\">\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cbutton class=\"btn-primary\" id=\"btn-adicionar\">+ Adicionar Fonte\u003c/button>\n\n  \u003cinput class=\"search-box\" id=\"search-box\" placeholder=\"Pesquisar...\">\n\n  \u003cdiv class=\"create-form\" id=\"create-form\">\n    \u003cdiv class=\"field-block\">\n      \u003cdiv class=\"field-label\">Nome da Fonte \u003cspan class=\"req\">*\u003c/span>\u003c/div>\n      \u003cinput class=\"field-input\" id=\"input-nome\" placeholder=\"Ex: Indicação\">\n      \u003cdiv class=\"error-text\" id=\"error-nome\" style=\"display:none;\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field-block\" id=\"field-descricao\" style=\"display:none;\">\n      \u003cdiv class=\"field-label\">Descrição\u003c/div>\n      \u003cinput class=\"field-input\" id=\"input-descricao\" placeholder=\"Ex: Ação de final de ano\">\n    \u003c/div>\n    \u003cbutton class=\"btn-primary\" style=\"margin-bottom:0;\" id=\"btn-salvar\">Salvar\u003c/button>\n    \u003cbutton class=\"btn-secondary\" id=\"btn-cancelar\">Cancelar\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"bulk-bar\" id=\"bulk-bar\">🗑 \u003cspan id=\"bulk-text\">Apagar a(s) 0 selecionada(s)\u003c/span>\u003c/div>\n  \u003cdiv class=\"table-wrap\">\n    \u003cdiv class=\"row-header\" id=\"row-header\">\n      \u003cdiv class=\"col-check\">\u003c/div>\n      \u003cdiv class=\"col-name\">NOME DA FONTE (0)\u003c/div>\n      \u003cdiv class=\"col-date\">CRIADO EM\u003c/div>\n      \u003cdiv class=\"col-date\">ÚLTIMA ALTERAÇÃO EM\u003c/div>\n      \u003cdiv class=\"col-action\">\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"table-body\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"modal-overlay\" id=\"modal-overlay\">\n  \u003cdiv class=\"modal-box\">\n    \u003cdiv class=\"modal-title\" id=\"modal-title\">Deseja excluir a Fonte?\u003c/div>\n    \u003cdiv id=\"modal-blocked-area\">\u003c/div>\n    \u003cdiv class=\"modal-text\" id=\"modal-text\">Você pode enviar a Fonte para a lixeira ou excluir permanentemente da sua conta. Se optar por excluir, lembre-se que não será possível recuperar a informação.\u003c/div>\n    \u003clabel class=\"confirm-check\">\n      \u003cinput type=\"checkbox\" id=\"confirm-checkbox\">\n      \u003cspan>Entendo que ao excluir não conseguirei recuperar a informação.\u003c/span>\n    \u003c/label>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"link-btn lixeira\" id=\"btn-lixeira\">Enviar para a lixeira\u003c/button>\n      \u003cbutton class=\"link-btn permanente\" id=\"btn-permanente\">Excluir permanentemente\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"modal-close\">\u003cbutton id=\"btn-fechar-modal\">Cancelar\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n  var state = {\n    perfil: 'admin',\n    abaAtual: 'fontes',\n    toggleFontes: false,\n    toggleCampanhas: false,\n    fontes: [\n      { id: 1, nome: 'Formulário do site', criadoEm: '10/03/2026 09:12', alteradoEm: '10/03/2026 09:12', vinculada: true },\n      { id: 2, nome: 'Indicação', criadoEm: '10/03/2026 09:14', alteradoEm: '10/03/2026 09:14', vinculada: false },\n      { id: 3, nome: 'CRIAÇÃO DE FONTES - CRM VIGOS', criadoEm: '17/08/2026 15:34', alteradoEm: '17/08/2026 15:34', vinculada: false }\n    ],\n    campanhas: [\n      { id: 1, nome: 'Oportunidade Capta Whatsapp', descricao: '', criadoEm: '25/09/2022 09:02', alteradoEm: '25/09/2022 09:02', vinculada: true },\n      { id: 2, nome: 'Feira XYZ 2026', descricao: 'Ação de final de ano', criadoEm: '12/06/2026 14:20', alteradoEm: '12/06/2026 14:20', vinculada: false }\n    ],\n    selecionados: [],\n    proximoIdFonte: 4,\n    proximoIdCampanha: 3,\n    itemParaExcluir: null,\n    excluirEmLote: false\n  };\n\n  function toast(msg) {\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    setTimeout(function () { t.classList.remove('show'); }, 2200);\n  }\n\n  function listaAtual() {\n    return state.abaAtual === 'fontes' ? state.fontes : state.campanhas;\n  }\n\n  function toggleAtual() {\n    return state.abaAtual === 'fontes' ? state.toggleFontes : state.toggleCampanhas;\n  }\n\n  function podeCriar() {\n    if (state.perfil === 'admin') return true;\n    return toggleAtual();\n  }\n\n  function render() {\n    var isFontes = state.abaAtual === 'fontes';\n    document.getElementById('page-title').textContent = isFontes ? 'Fontes' : 'Campanhas';\n    document.querySelectorAll('.tab').forEach(function (t) {\n      t.classList.toggle('active', t.getAttribute('data-tab') === state.abaAtual);\n    });\n    document.getElementById('desc-line').textContent = isFontes ? 'Gerenciar as fontes das negociações.' : 'Gerenciar as campanhas das negociações.';\n    document.getElementById('toggle-label').textContent = isFontes ? 'Permitir que usuários criem novas fontes' : 'Permitir que usuários criem novas campanhas';\n    document.getElementById('toggle-permissao').classList.toggle('on', toggleAtual());\n    document.getElementById('btn-adicionar').textContent = isFontes ? '+ Adicionar Fonte' : '+ Adicionar Campanha';\n    document.getElementById('field-descricao').style.display = isFontes ? 'none' : 'block';\n    document.getElementById('input-nome').placeholder = isFontes ? 'Ex: Indicação' : 'Ex: Google Ads';\n\n    var podeCriarAgora = podeCriar();\n    document.getElementById('btn-adicionar').style.display = podeCriarAgora ? 'inline-block' : 'none';\n    if (!podeCriarAgora) {\n      document.getElementById('create-form').classList.remove('open');\n    }\n\n    var lista = listaAtual();\n    var filtro = document.getElementById('search-box').value.trim().toLowerCase();\n    var listaFiltrada = lista.filter(function (item) {\n      return item.nome.toLowerCase().indexOf(filtro) !== -1;\n    });\n\n    var headerHtml = '\u003cdiv class=\"col-check\">\u003c/div>\u003cdiv class=\"col-name\">' + (isFontes ? 'NOME DA FONTE' : 'NOME DA CAMPANHA') + ' (' + lista.length + ')\u003c/div>';\n    if (!isFontes) headerHtml += '\u003cdiv class=\"col-desc\">DESCRIÇÃO\u003c/div>';\n    headerHtml += '\u003cdiv class=\"col-date\">CRIADO EM\u003c/div>\u003cdiv class=\"col-date\">ÚLTIMA ALTERAÇÃO EM\u003c/div>\u003cdiv class=\"col-action\">\u003c/div>';\n    document.getElementById('row-header').innerHTML = headerHtml;\n\n    var body = document.getElementById('table-body');\n    if (listaFiltrada.length === 0) {\n      body.innerHTML = '\u003cdiv class=\"empty-state\">' + (isFontes ? 'Nenhuma fonte cadastrada ainda' : 'Nenhuma campanha cadastrada ainda') + '\u003c/div>';\n    } else {\n      body.innerHTML = listaFiltrada.map(function (item) {\n        var checked = state.selecionados.indexOf(item.id) !== -1 ? 'checked' : '';\n        var descCol = isFontes ? '' : '\u003cdiv class=\"col-desc\">' + (item.descricao || '') + '\u003c/div>';\n        var vinculoTag = item.vinculada ? '\u003cspan class=\"blocked-tag\">vinculada\u003c/span>' : '';\n        return '\u003cdiv class=\"row\">' +\n          '\u003cdiv class=\"col-check\">\u003cinput type=\"checkbox\" class=\"row-check\" data-id=\"' + item.id + '\" ' + checked + '>\u003c/div>' +\n          '\u003cdiv class=\"col-name\">' + item.nome + vinculoTag + '\u003c/div>' +\n          descCol +\n          '\u003cdiv class=\"col-date\">' + item.criadoEm + '\u003c/div>' +\n          '\u003cdiv class=\"col-date\">' + item.alteradoEm + '\u003c/div>' +\n          '\u003cdiv class=\"col-action\">\u003cspan class=\"icon-btn item-delete\" data-id=\"' + item.id + '\">🗑\u003c/span>\u003c/div>' +\n          '\u003c/div>';\n      }).join('');\n      document.querySelectorAll('.row-check').forEach(function (cb) {\n        cb.addEventListener('change', function () {\n          var id = parseInt(this.getAttribute('data-id'));\n          if (this.checked) {\n            state.selecionados.push(id);\n          } else {\n            state.selecionados = state.selecionados.filter(function (x) { return x !== id; });\n          }\n          render();\n        });\n      });\n      document.querySelectorAll('.item-delete').forEach(function (el) {\n        el.addEventListener('click', function () {\n          var id = parseInt(this.getAttribute('data-id'));\n          abrirModalExclusao([id]);\n        });\n      });\n    }\n\n    var bulkBar = document.getElementById('bulk-bar');\n    if (state.selecionados.length > 0) {\n      bulkBar.classList.add('open');\n      var label = isFontes ? 'fonte(s)' : 'campanha(s)';\n      document.getElementById('bulk-text').textContent = 'Apagar a(s) ' + state.selecionados.length + ' ' + label + ' selecionada(s)';\n      bulkBar.onclick = function () { abrirModalExclusao(state.selecionados.slice()); };\n    } else {\n      bulkBar.classList.remove('open');\n    }\n  }\n\n  function abrirModalExclusao(ids) {\n    state.itemParaExcluir = ids;\n    var isFontes = state.abaAtual === 'fontes';\n    var lista = listaAtual();\n    var itens = lista.filter(function (i) { return ids.indexOf(i.id) !== -1; });\n    var algumVinculado = itens.some(function (i) { return i.vinculada; });\n    var todosVinculados = itens.every(function (i) { return i.vinculada; });\n\n    document.getElementById('modal-title').textContent = ids.length > 1\n      ? 'Deseja excluir ' + ids.length + ' ' + (isFontes ? 'fontes' : 'campanhas') + '?'\n      : 'Deseja excluir a ' + (isFontes ? 'Fonte' : 'Campanha') + '?';\n\n    var blockedArea = document.getElementById('modal-blocked-area');\n    if (algumVinculado) {\n      var qtd = itens.filter(function (i) { return i.vinculada; }).length;\n      blockedArea.innerHTML = '\u003cdiv class=\"modal-blocked\">' + qtd + ' item(ns) selecionado(s) está(ão) vinculado(s) a Negociações e não pode(m) ser excluído(s). \u003cem>Ponto de atenção: formato exato desta mensagem ainda pendente de definição.\u003c/em>\u003c/div>';\n    } else {\n      blockedArea.innerHTML = '';\n    }\n\n    document.getElementById('modal-text').textContent = 'Você pode enviar ' + (ids.length > 1 ? 'os itens elegíveis' : (isFontes ? 'a Fonte' : 'a Campanha')) + ' para a lixeira ou excluir permanentemente da sua conta. Se optar por excluir, lembre-se que não será possível recuperar a informação.';\n\n    document.getElementById('confirm-checkbox').checked = false;\n    atualizarBotaoPermanente();\n\n    var btnLixeira = document.getElementById('btn-lixeira');\n    var btnPermanente = document.getElementById('btn-permanente');\n    if (todosVinculados) {\n      btnLixeira.style.opacity = '0.4';\n      btnLixeira.style.cursor = 'not-allowed';\n      btnLixeira.disabled = true;\n    } else {\n      btnLixeira.style.opacity = '1';\n      btnLixeira.style.cursor = 'pointer';\n      btnLixeira.disabled = false;\n    }\n\n    document.getElementById('modal-overlay').classList.add('open');\n  }\n\n  function atualizarBotaoPermanente() {\n    var checked = document.getElementById('confirm-checkbox').checked;\n    var btn = document.getElementById('btn-permanente');\n    if (state.perfil === 'admin' && checked) {\n      btn.classList.add('enabled');\n    } else {\n      btn.classList.remove('enabled');\n    }\n  }\n\n  function fecharModal() {\n    document.getElementById('modal-overlay').classList.remove('open');\n    state.itemParaExcluir = null;\n  }\n\n  function processarExclusao(tipo) {\n    var ids = state.itemParaExcluir;\n    if (!ids) return;\n    var isFontes = state.abaAtual === 'fontes';\n    var lista = isFontes ? state.fontes : state.campanhas;\n    var elegiveis = lista.filter(function (i) { return ids.indexOf(i.id) !== -1 && !i.vinculada; });\n    var bloqueados = lista.filter(function (i) { return ids.indexOf(i.id) !== -1 && i.vinculada; });\n\n    if (elegiveis.length === 0) {\n      toast('Nenhum item pôde ser excluído, todos vinculados a Negociações');\n      fecharModal();\n      return;\n    }\n\n    var idsElegiveis = elegiveis.map(function (i) { return i.id; });\n    if (isFontes) {\n      state.fontes = state.fontes.filter(function (i) { return idsElegiveis.indexOf(i.id) === -1; });\n    } else {\n      state.campanhas = state.campanhas.filter(function (i) { return idsElegiveis.indexOf(i.id) === -1; });\n    }\n    state.selecionados = state.selecionados.filter(function (id) { return idsElegiveis.indexOf(id) === -1; });\n\n    var label = isFontes ? (elegiveis.length > 1 ? 'Fontes' : 'Fonte') : (elegiveis.length > 1 ? 'Campanhas' : 'Campanha');\n    var msg = tipo === 'lixeira' ? label + ' enviada(s) para a lixeira' : label + ' excluída(s) permanentemente';\n    if (bloqueados.length > 0) {\n      msg += ' (' + bloqueados.length + ' bloqueada(s) por vínculo)';\n    }\n    toast(msg);\n    fecharModal();\n    render();\n  }\n\n  document.getElementById('btn-perfil-admin').addEventListener('click', function () {\n    state.perfil = 'admin';\n    document.getElementById('btn-perfil-admin').classList.add('active');\n    document.getElementById('btn-perfil-usuario').classList.remove('active');\n    render();\n  });\n  document.getElementById('btn-perfil-usuario').addEventListener('click', function () {\n    state.perfil = 'usuario';\n    document.getElementById('btn-perfil-usuario').classList.add('active');\n    document.getElementById('btn-perfil-admin').classList.remove('active');\n    render();\n  });\n\n  document.querySelectorAll('.tab').forEach(function (t) {\n    t.addEventListener('click', function () {\n      state.abaAtual = this.getAttribute('data-tab');\n      state.selecionados = [];\n      document.getElementById('create-form').classList.remove('open');\n      document.getElementById('search-box').value = '';\n      render();\n    });\n  });\n\n  document.getElementById('toggle-permissao').addEventListener('click', function () {\n    if (state.abaAtual === 'fontes') {\n      state.toggleFontes = !state.toggleFontes;\n    } else {\n      state.toggleCampanhas = !state.toggleCampanhas;\n    }\n    render();\n  });\n\n  document.getElementById('btn-adicionar').addEventListener('click', function () {\n    document.getElementById('create-form').classList.add('open');\n    document.getElementById('input-nome').value = '';\n    document.getElementById('input-descricao').value = '';\n    document.getElementById('error-nome').style.display = 'none';\n    document.getElementById('input-nome').classList.remove('error');\n  });\n\n  document.getElementById('btn-cancelar').addEventListener('click', function () {\n    document.getElementById('create-form').classList.remove('open');\n  });\n\n  document.getElementById('btn-salvar').addEventListener('click', function () {\n    var nome = document.getElementById('input-nome').value.trim();\n    var errorEl = document.getElementById('error-nome');\n    var inputEl = document.getElementById('input-nome');\n    var isFontes = state.abaAtual === 'fontes';\n    var lista = listaAtual();\n\n    if (!nome) {\n      errorEl.textContent = 'Este campo é obrigatório';\n      errorEl.style.display = 'block';\n      inputEl.classList.add('error');\n      return;\n    }\n    var duplicado = lista.some(function (i) { return i.nome === nome; });\n    if (duplicado) {\n      errorEl.textContent = 'Já existe um registro com este nome';\n      errorEl.style.display = 'block';\n      inputEl.classList.add('error');\n      return;\n    }\n    errorEl.style.display = 'none';\n    inputEl.classList.remove('error');\n\n    var agora = new Date();\n    var dataFormatada = String(agora.getDate()).padStart(2, '0') + '/' + String(agora.getMonth() + 1).padStart(2, '0') + '/' + agora.getFullYear() + ' ' + String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');\n\n    if (isFontes) {\n      state.fontes.push({ id: state.proximoIdFonte++, nome: nome, criadoEm: dataFormatada, alteradoEm: dataFormatada, vinculada: false });\n      toast('Fonte criada com sucesso');\n    } else {\n      var descricao = document.getElementById('input-descricao').value.trim();\n      state.campanhas.push({ id: state.proximoIdCampanha++, nome: nome, descricao: descricao, criadoEm: dataFormatada, alteradoEm: dataFormatada, vinculada: false });\n      toast('Campanha criada com sucesso');\n    }\n    document.getElementById('create-form').classList.remove('open');\n    render();\n  });\n\n  document.getElementById('search-box').addEventListener('input', render);\n\n  document.getElementById('confirm-checkbox').addEventListener('change', atualizarBotaoPermanente);\n\n  document.getElementById('btn-lixeira').addEventListener('click', function () {\n    if (this.disabled) return;\n    processarExclusao('lixeira');\n  });\n  document.getElementById('btn-permanente').addEventListener('click', function () {\n    if (state.perfil !== 'admin') return;\n    if (!document.getElementById('confirm-checkbox').checked) return;\n    processarExclusao('permanente');\n  });\n  document.getElementById('btn-fechar-modal').addEventListener('click', fecharModal);\n\n  render();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"contatos":{"icon":"👤","title":"Contatos e Empresas","description":"Cadastros, vínculos, segmentos e ações.","stat":"Fluxo funcional completo","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Protótipo; CRM Vigos (Contatos e Empresas)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root {\n    --navy-deep: #0B1929;\n    --teal: #00D9C0;\n    --teal-dim: #0a5f56;\n    --bg-page: #F7F9FB;\n    --text-dark: #16232F;\n    --text-muted: #64748B;\n    --border-light: #E2E8F0;\n    --amber: #F5A623;\n    --amber-bg: #FEF3E2;\n    --red: #E45858;\n    --red-bg: #FCEAEA;\n    --green: #1FAA6E;\n    --green-bg: #E7F7EF;\n    --blue-bg: #E6F1FB;\n    --blue-text: #0C447C;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-page); color: var(--text-dark); min-height: 100vh; font-size: 13px; }\n  .app { display: flex; min-height: 100vh; }\n  .sidebar { width: 52px; background: var(--navy-deep); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 18px; color: #7C93AA; font-size: 16px; }\n  .sidebar .active { color: #fff; }\n  .sidebar div { cursor: pointer; }\n  .main { flex: 1; min-width: 0; }\n  .topbar { background: var(--navy-deep); color: #fff; padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }\n  .topbar .brand { color: var(--teal); font-weight: 600; }\n  .content { background: #fff; padding: 1.25rem 1.5rem; }\n  .intro { font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.6; }\n  .btn { font-size: 12px; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }\n  .btn-primary { background: #00B8D4; color: #fff; }\n  .btn-danger { background: #E91E63; color: #fff; }\n  .btn-dark { background: var(--text-dark); color: #fff; }\n  .btn-outline { background: #fff; border: 0.5px solid #CBD5E1; color: var(--text-dark); }\n  .btn:disabled { background: #EFD3D3; color: #A32D2D; cursor: not-allowed; }\n  input[type=text], input[type=email], select, textarea { font-size: 12.5px; padding: 8px 10px; border: 0.5px solid #CBD5E1; border-radius: 6px; font-family: inherit; }\n  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\n  th { color: var(--text-muted); text-align: left; font-weight: 500; padding: 8px 6px; border-bottom: 0.5px solid var(--border-light); }\n  td { padding: 9px 6px; border-top: 0.5px solid #F0F3F6; }\n  .link { color: #0C7CD5; cursor: pointer; }\n  .badge { font-size: 9px; background: #F1EFE8; color: #5F5E5A; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }\n  .tag { display: inline-block; background: var(--blue-bg); color: var(--blue-text); font-size: 11px; padding: 3px 8px; border-radius: 10px; margin: 2px 4px 2px 0; }\n  .modal-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }\n  .modal-overlay.open { display: flex; }\n  .modal { background: #fff; border-radius: 12px; width: 440px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(11,25,41,0.15); max-height: 85vh; overflow-y: auto; }\n  .modal h3 { font-size: 15px; margin: 0 0 10px; }\n  .warn-box { border-left: 3px solid #D85A30; background: #FAECE7; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }\n  .warn-box p { margin: 0; font-size: 11.5px; color: #712B13; line-height: 1.5; }\n  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .2s; z-index: 20; }\n  .toast.show { opacity: 1; }\n  .drawer-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.35); display: none; z-index: 15; }\n  .drawer-overlay.open { display: block; }\n  .drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #fff; box-shadow: -4px 0 14px rgba(0,0,0,0.12); transition: right .2s; z-index: 16; overflow-y: auto; }\n  .drawer.open { right: 0; }\n  .drawer-header { padding: 16px 20px; border-bottom: 0.5px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; border-top: 4px solid var(--border-light); }\n  .drawer-header h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; }\n  .drawer-header .x { cursor: pointer; color: var(--text-muted); font-size: 16px; }\n  .drawer-header.hdr-contato { border-top-color: #0C7CD5; }\n  .drawer-header.hdr-contato .entity-icon { color: #0C7CD5; }\n  .drawer-header.hdr-empresa { border-top-color: var(--teal); }\n  .drawer-header.hdr-empresa .entity-icon { color: var(--teal-dim); }\n  .drawer-header.hdr-segmento { border-top-color: #9B59B6; }\n  .drawer-header.hdr-segmento .entity-icon { color: #9B59B6; }\n  .entity-icon { font-size: 17px; }\n  .drawer-body { padding: 16px 20px; }\n  .field { margin-bottom: 12px; }\n  .field label { font-size: 12.5px; font-weight: 500; display: block; margin-bottom: 4px; }\n  .field input, .field select, .field textarea { width: 100%; }\n  .field .req { color: var(--red); }\n  .section-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.03em; margin: 18px 0 8px; text-transform: uppercase; }\n  .link-add { font-size: 12px; color: var(--teal-dim); font-weight: 600; cursor: pointer; }\n  .error-text { font-size: 11px; color: #A32D2D; margin: 4px 0 0; }\n  .empty-state { text-align: center; padding: 48px 20px 24px; }\n  .empty-state h4 { font-size: 14px; margin: 0 0 6px; }\n  .empty-state p { font-size: 12px; color: var(--text-muted); max-width: 360px; margin: 0 auto; }\n  .breadcrumb { font-size: 11px; color: #94A3B8; margin: 0 0 4px; }\n  h2 { font-size: 20px; margin: 0 0 14px; }\n  .toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }\n  .search-box { border: 0.5px solid var(--border-light); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: var(--text-muted); max-width: 280px; margin-bottom: 16px; }\n  .phone-row, .email-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }\n  .phone-row input, .email-row input { flex: 1; }\n  .remove-x { color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px; }\n  .profile-switch { position: fixed; top: 8px; left: 62px; z-index: 25; background: #fff; border: 0.5px solid var(--border-light); border-radius: 6px; padding: 4px 8px; font-size: 11px; }\n\u003c/style>\n\u003cstyle>\n  .proto-banner{display:none!important}\n  .app-shell{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}\n  .app-sidebar,.sidebar{display:none!important}\n  body{background:#fff!important;color:#102d3d!important}\n  .app-topbar,.topbar{background:#fff!important;color:#102d3d!important;border-bottom:1px solid #e3e9ee!important}\n  .app-content{padding:28px 34px!important}\n  button,.btn{border-radius:6px!important}\n  .btn.primary,.btn-primary{background:#06283b!important;color:#fff!important}\n  .summary-card{border:1px solid #e3e9ee!important;background:#f8fafb!important}\n  table th{color:#607486!important;font-weight:600!important}\n  .entity-icon{font-family:Inter,sans-serif!important}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"sidebar\">\n    \u003cdiv>&#8962;\u003c/div>\u003cdiv class=\"active\">&#128100;\u003c/div>\u003cdiv>&#8646;\u003c/div>\u003cdiv>&#127970;\u003c/div>\u003cdiv>&#9776;\u003c/div>\u003cdiv>&#128202;\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"topbar\">\n      \u003cdiv class=\"brand\">&#9670; CRM Vigos\u003c/div>\n      \u003cdiv>Rede Filantropia\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"content\" id=\"content\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"drawer-overlay\" id=\"drawer-overlay\" onclick=\"fecharDrawer()\">\u003c/div>\n\u003cdiv class=\"drawer\" id=\"drawer\">\u003c/div>\n\n\u003cdiv class=\"modal-overlay\" id=\"modal-overlay\">\n  \u003cdiv class=\"modal\" id=\"modal-body\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\nvar nextContatoId = 3;\nvar nextEmpresaId = 3;\n\nvar nextSegmentoId = 8;\n\nvar STATE6 = {\n  contatos: [\n    { id: 1, nome: \"Eliana Almeida\", cargo: \"Diretora\", telefones: [{ ddi: \"+55\", numero: \"(11) 93415-8855\" }], emails: [\"eliana@vcrm.com\"], empresaId: 1, baseLegal: \"Consentimento\", origemMarketing: \"\", status: \"ativo\" },\n    { id: 2, nome: \"Marcos Lima\", cargo: \"Financeiro\", telefones: [], emails: [\"marcos@gmail.com\"], empresaId: null, baseLegal: \"\", origemMarketing: \"\", status: \"ativo\" }\n  ],\n  empresas: [\n    { id: 1, nome: \"V CRM\", segmentoId: 7, url: \"vcrm.com.br\", resumo: \"\", endereco: \"\", status: \"ativo\" },\n    { id: 2, nome: \"Rede Filantropia\", segmentoId: 6, url: \"\", resumo: \"\", endereco: \"\", status: \"ativo\" }\n  ],\n  segmentos: [\n    { id: 1, nome: \"Advocacia\", status: \"ativo\" },\n    { id: 2, nome: \"Agropecuária\", status: \"ativo\" },\n    { id: 3, nome: \"Arquitetura\", status: \"ativo\" },\n    { id: 4, nome: \"Bancos\", status: \"ativo\" },\n    { id: 5, nome: \"Clínicas / Saúde\", status: \"ativo\" },\n    { id: 6, nome: \"Terceiro Setor\", status: \"ativo\" },\n    { id: 7, nome: \"Telefonia\", status: \"ativo\" }\n  ],\n  permiteUsuarioCriarSegmento: false,\n  view: \"contatos-listagem\",\n  editandoContatoId: null,\n  editandoEmpresaId: null,\n  editandoSegmentoId: null,\n  perfil: \"admin\"\n};\n\nfunction toast6(msg) {\n  var t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  setTimeout(function () { t.classList.remove('show'); }, 2200);\n}\n\nfunction abrirDrawer(html) {\n  document.getElementById('drawer').innerHTML = html;\n  document.getElementById('drawer').classList.add('open');\n  document.getElementById('drawer-overlay').classList.add('open');\n}\nfunction fecharDrawer() {\n  document.getElementById('drawer').classList.remove('open');\n  document.getElementById('drawer-overlay').classList.remove('open');\n  document.getElementById('drawer').innerHTML = '';\n}\n\nfunction abrirModal(html) {\n  document.getElementById('modal-body').innerHTML = html;\n  document.getElementById('modal-overlay').classList.add('open');\n}\nfunction fecharModal() {\n  document.getElementById('modal-overlay').classList.remove('open');\n}\n\nfunction irPara(view) {\n  STATE6.view = view;\n  render6();\n}\n\nfunction render6() {\n  if (STATE6.view === \"contatos-listagem\") renderContatosListagem();\n  else if (STATE6.view === \"empresas-listagem\") renderEmpresasListagem();\n  else if (STATE6.view === \"empresa-detalhe\") renderEmpresaDetalhe();\n  else if (STATE6.view === \"segmentos-listagem\") renderSegmentosListagem();\n}\n\nfunction nomeSegmento(segmentoId) {\n  if (!segmentoId) return '-';\n  var s = STATE6.segmentos.filter(function (x) { return x.id === segmentoId; })[0];\n  return s ? s.nome : '-';\n}\n\n/* ===================== CONTATOS ===================== */\n\nfunction nomeEmpresa(empresaId) {\n  if (!empresaId) return '\u003cspan style=\"color:#94A3B8;\">Sem empresa\u003c/span>';\n  var emp = STATE6.empresas.filter(function (e) { return e.id === empresaId; })[0];\n  return emp ? emp.nome : '\u003cspan style=\"color:#94A3B8;\">Sem empresa\u003c/span>';\n}\n\nfunction renderContatosListagem() {\n  var rows = STATE6.contatos.map(function (c) {\n    return '\u003ctr>' +\n      '\u003ctd>\u003cspan class=\"link\" onclick=\"abrirDrawerContato(' + c.id + ')\">' + c.nome + '\u003c/span>\u003c/td>' +\n      '\u003ctd style=\"color:#94A3B8;\">' + (c.cargo || '-') + '\u003c/td>' +\n      '\u003ctd style=\"color:#94A3B8;\">' + (c.emails[0] || '-') + '\u003c/td>' +\n      '\u003ctd style=\"color:#94A3B8;\">' + nomeEmpresa(c.empresaId) + '\u003c/td>' +\n      '\u003ctd>\u003cspan class=\"link\" onclick=\"pedirExclusaoContato(' + c.id + ')\" title=\"Excluir\">&#128465;\u003c/span>\u003c/td>' +\n      '\u003c/tr>';\n  }).join(\"\");\n\n  document.getElementById('content').innerHTML =\n    '\u003cdiv class=\"toprow\">\u003ch2 style=\"margin:0;\">\u003cspan style=\"color:#0C7CD5;\">&#128100;\u003c/span> Contatos\u003c/h2>\u003cbutton class=\"btn btn-primary\" onclick=\"abrirDrawerContato(null)\">+ Criar contato\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"search-box\">Buscar por nome &#128269;\u003c/div>' +\n    '\u003ctable>\u003ctr>\u003cth>Nome\u003c/th>\u003cth>Cargo\u003c/th>\u003cth>E-mail\u003c/th>\u003cth>Empresa\u003c/th>\u003cth style=\"width:40px;\">\u003c/th>\u003c/tr>' +\n    rows + '\u003c/table>';\n}\n\nfunction abrirDrawerContato(id) {\n  STATE6.editandoContatoId = id;\n  var c = id ? STATE6.contatos.filter(function (x) { return x.id === id; })[0] : { nome: \"\", cargo: \"\", telefones: [], emails: [], empresaId: null, baseLegal: \"\", origemMarketing: \"\" };\n\n  var telefonesHtml = c.telefones.map(function (t, i) {\n    return '\u003cdiv class=\"phone-row\">\u003cinput type=\"text\" id=\"tel-' + i + '\" value=\"' + t.ddi + ' ' + t.numero + '\">\u003cspan class=\"remove-x\" onclick=\"removerTelefone(' + i + ')\">&#10005;\u003c/span>\u003c/div>';\n  }).join(\"\") || '\u003cdiv class=\"phone-row\">\u003cinput type=\"text\" id=\"tel-0\" placeholder=\"+55 (99) 99999-9999\">\u003c/div>';\n\n  var emailsHtml = c.emails.map(function (e, i) {\n    return '\u003cdiv class=\"email-row\">\u003cinput type=\"email\" id=\"email-' + i + '\" value=\"' + e + '\">\u003cspan class=\"remove-x\" onclick=\"removerEmail(' + i + ')\">&#10005;\u003c/span>\u003c/div>';\n  }).join(\"\") || '\u003cdiv class=\"email-row\">\u003cinput type=\"email\" id=\"email-0\" placeholder=\"seunome@email.com\">\u003c/div>';\n\n  var empresaOptions = '\u003coption value=\"\">Selecionar\u003c/option>' + STATE6.empresas.map(function (e) {\n    return '\u003coption value=\"' + e.id + '\"' + (c.empresaId === e.id ? \" selected\" : \"\") + '>' + e.nome + '\u003c/option>';\n  }).join(\"\");\n\n  var html = '\u003cdiv class=\"drawer-header hdr-contato\">\u003ch3>\u003cspan class=\"entity-icon\">&#128100;\u003c/span>' + (id ? \"Editar Contato\" : \"Criar Contato\") + '\u003c/h3>\u003cspan class=\"x\" onclick=\"fecharDrawer()\">&#10005;\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"drawer-body\">' +\n    '\u003cdiv class=\"field\">\u003clabel>Nome do contato \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput type=\"text\" id=\"f-nome\" value=\"' + c.nome + '\">\u003c/div>' +\n    '\u003cp class=\"error-text\" id=\"erro-nome-contato\" style=\"display:none;\">\u003c/p>' +\n    '\u003cdiv class=\"field\">\u003clabel>Cargo\u003c/label>\u003cinput type=\"text\" id=\"f-cargo\" value=\"' + c.cargo + '\">\u003c/div>' +\n    '\u003cdiv class=\"field\">\u003clabel>Telefone\u003c/label>\u003cdiv id=\"lista-telefones\">' + telefonesHtml + '\u003c/div>\u003cspan class=\"link-add\" onclick=\"adicionarTelefone()\">+ Adicionar telefone\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"field\">\u003clabel>E-mail\u003c/label>\u003cdiv id=\"lista-emails\">' + emailsHtml + '\u003c/div>\u003cspan class=\"link-add\" onclick=\"adicionarEmail()\">+ Adicionar e-mail\u003c/span>\u003c/div>' +\n    '\u003cp class=\"error-text\" id=\"erro-email-contato\" style=\"display:none;\">\u003c/p>' +\n    '\u003cdiv class=\"field\">\u003clabel>Empresa do contato\u003c/label>\u003cselect id=\"f-empresa\">' + empresaOptions + '\u003c/select>\u003c/div>' +\n    '\u003cdiv class=\"field\">\u003clabel>Contato e envio de comunicação\u003c/label>\u003cselect id=\"f-base-legal\">\u003coption value=\"\">Não sei dizer ou não possuo base legal\u003c/option>\u003coption value=\"Consentimento\"' + (c.baseLegal === \"Consentimento\" ? \" selected\" : \"\") + '>Consentimento\u003c/option>\u003coption value=\"Legitimo interesse\"' + (c.baseLegal === \"Legitimo interesse\" ? \" selected\" : \"\") + '>Legítimo interesse\u003c/option>\u003c/select>\u003c/div>' +\n    '\u003cdiv class=\"field\">\u003clabel>Origem de Marketing\u003c/label>\u003cinput type=\"text\" id=\"f-origem\" value=\"' + (c.origemMarketing || '') + '\">\u003c/div>' +\n    '\u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:8px;\">\u003cspan style=\"font-size:11px;color:#94A3B8;letter-spacing:0.03em;\">CAMPOS PERSONALIZADOS\u003c/span>\u003cspan style=\"color:#0C7CD5;cursor:pointer;\">&#8635;\u003c/span>\u003c/div>' +\n    '\u003cspan class=\"link-add\" onclick=\"alertCampoPersonalizado()\">+ Adicionar campo personalizado\u003c/span>' +\n    '\u003cdiv style=\"display:flex;gap:8px;margin-top:18px;\">\u003cbutton class=\"btn btn-primary\" onclick=\"salvarContato()\">' + (id ? \"Salvar\" : \"Criar contato\") + '\u003c/button>\u003cbutton class=\"btn btn-outline\" onclick=\"fecharDrawer()\">Cancelar\u003c/button>\u003c/div>' +\n    '\u003c/div>';\n  abrirDrawer(html);\n}\n\nfunction alertCampoPersonalizado() {\n  alert(\"Campo personalizado, ver Etapa 3\");\n}\n\nfunction adicionarTelefone() {\n  var wrap = document.getElementById('lista-telefones');\n  var i = wrap.children.length;\n  var div = document.createElement('div');\n  div.className = 'phone-row';\n  div.innerHTML = '\u003cinput type=\"text\" id=\"tel-' + i + '\" placeholder=\"+55 (99) 99999-9999\">\u003cspan class=\"remove-x\" onclick=\"this.parentElement.remove()\">&#10005;\u003c/span>';\n  wrap.appendChild(div);\n}\nfunction removerTelefone(i) {\n  var el = document.getElementById('tel-' + i);\n  if (el) el.parentElement.remove();\n}\nfunction adicionarEmail() {\n  var wrap = document.getElementById('lista-emails');\n  var i = wrap.children.length;\n  var div = document.createElement('div');\n  div.className = 'email-row';\n  div.innerHTML = '\u003cinput type=\"email\" id=\"email-' + i + '\" placeholder=\"seunome@email.com\">\u003cspan class=\"remove-x\" onclick=\"this.parentElement.remove()\">&#10005;\u003c/span>';\n  wrap.appendChild(div);\n}\nfunction removerEmail(i) {\n  var el = document.getElementById('email-' + i);\n  if (el) el.parentElement.remove();\n}\n\nfunction validarMinimo(valor) {\n  return valor && valor.trim().length >= 2;\n}\nfunction validarEmailFormato(email) {\n  if (!email) return true;\n  var re = /^[a-z0-9._%+-]+@[a-z0-9.-]+.[a-z]{2,}$/;\n  return re.test(email) && !/[À-ÿ #&%]/.test(email);\n}\n\nfunction salvarContato() {\n  var nome = document.getElementById('f-nome').value.trim();\n  var erroNome = document.getElementById('erro-nome-contato');\n  if (!validarMinimo(nome)) {\n    erroNome.textContent = 'Nome é obrigatório e precisa ter no mínimo 2 caracteres.';\n    erroNome.style.display = 'block';\n    return;\n  }\n  erroNome.style.display = 'none';\n\n  var emailInputs = document.querySelectorAll('#lista-emails input');\n  var emails = [];\n  var erroEmail = document.getElementById('erro-email-contato');\n  for (var i = 0; i \u003c emailInputs.length; i++) {\n    var v = emailInputs[i].value.trim();\n    if (v) {\n      if (!validarEmailFormato(v)) {\n        erroEmail.textContent = 'Formato de e-mail inválido: ' + v;\n        erroEmail.style.display = 'block';\n        return;\n      }\n      emails.push(v);\n    }\n  }\n  erroEmail.style.display = 'none';\n\n  var telInputs = document.querySelectorAll('#lista-telefones input');\n  var telefones = [];\n  for (var j = 0; j \u003c telInputs.length; j++) {\n    var tv = telInputs[j].value.trim();\n    if (tv) telefones.push({ ddi: \"\", numero: tv });\n  }\n\n  var cargo = document.getElementById('f-cargo').value.trim();\n  var empresaId = document.getElementById('f-empresa').value ? parseInt(document.getElementById('f-empresa').value) : null;\n  var baseLegal = document.getElementById('f-base-legal').value;\n  var origem = document.getElementById('f-origem').value.trim();\n\n  if (STATE6.editandoContatoId) {\n    var c = STATE6.contatos.filter(function (x) { return x.id === STATE6.editandoContatoId; })[0];\n    c.nome = nome; c.cargo = cargo; c.telefones = telefones; c.emails = emails; c.empresaId = empresaId; c.baseLegal = baseLegal; c.origemMarketing = origem;\n    toast6('Alterações salvas');\n  } else {\n    STATE6.contatos.push({ id: nextContatoId++, nome: nome, cargo: cargo, telefones: telefones, emails: emails, empresaId: empresaId, baseLegal: baseLegal, origemMarketing: origem, status: \"ativo\" });\n    toast6('Contato criado');\n  }\n  fecharDrawer();\n  render6();\n}\n\nfunction pedirExclusaoContato(id) {\n  var c = STATE6.contatos.filter(function (x) { return x.id === id; })[0];\n  var vinculado = c.empresaId ? true : fa           '<div class="neg-create-field"><label>Nome da negociação *</label><input id="neg-create-name" maxlength="120" placeholder="Digite o nome da negociação"></div>'+
          '<div class="neg-create-row"><div class="neg-create-field"><label>Fonte</label><select id="neg-create-source"><option value="">Selecionar</option><option>Cliente Ativo</option><option>Contato pelo Site</option><option>Contato por E-mail</option><option>Contato por Telefone</option><option>E-mail Marketing</option><option>Feiras e Eventos</option><option>Google e Outros Buscadores</option><option>Indicação por Clientes</option><option>Indicação por Parceiros</option><option>Prospecção Ativa</option><option>Redes Sociais</option><option>TESTE CRM VIGOS</option></select></div>'+
          '<div class="neg-create-field"><label>Campanha</label><select id="neg-create-campaign"><option>Sem Campanha</option><option>AÇÃO INSTAGRAM</option></select></div></div>'+
          '<div class="neg-create-row"><div class="neg-create-field"><label>Funil de vendas *</label><select id="neg-create-funnel"></select></div>'+
          '<div class="neg-create-field"><label>Etapa do funil *</label><select id="neg-create-stage"></select></div></div>'+
          '<div class="neg-create-section">Informações da empresa</div>'+
          '<div class="neg-create-field"><label>Empresa da negociação</label><select id="neg-create-company"><option value="">Nenhuma empresa encontrada</option></select></div>'+
          '<button class="neg-inline-action" type="button" onclick="toggleNegInline(\'neg-company-box\')">+ Adicionar empresa</button>'+
          '<div class="neg-inline-box" id="neg-company-box"><div class="neg-create-field"><label>Nome da empresa *</label><input id="neg-company-name"></div><div class="neg-create-field"><label>Segmento</label><select id="neg-company-segment"><option value="">Selecionar</option><option>Demolição e Terraplanagem</option><option>Distribuidoras / Atacadistas</option><option>Engenharia</option><option>Esoterismo</option><option>Eventos e Entretenimento</option><option>Fotografia</option><option>Gráfica</option></select></div><div class="neg-create-field"><label>URL</label><input id="neg-company-url" placeholder="https://"></div><div class="neg-create-field"><label>Resumo</label><textarea id="neg-company-summary"></textarea></div><div class="neg-create-note">As informações serão salvas ao criar a negociação.</div><button class="neg-inline-action" type="button" onclick="removeNegCompany()">Remover empresa</button></div>'+
          '<div class="neg-create-section">Informações do contato</div>'+
          '<div class="neg-create-field"><label>Contato</label><select id="neg-create-contact"><option value="">Selecionar contato</option></select></div>'+
          '<button class="neg-inline-action" type="button" onclick="toggleNegInline(\'neg-contact-box\')">+ Adicionar contato</button>'+
          '<div class="neg-inline-box" id="neg-contact-box"><div class="neg-create-field"><label>Nome do contato *</label><input id="neg-contact-name"></div><div class="neg-create-field"><label>Cargo</label><input id="neg-contact-role"></div><div class="neg-create-field"><label>Telefone</label><input id="neg-contact-phone"></div><button class="neg-inline-action" type="button" onclick="addNegPhone()">+ Adicionar telefone</button><div id="neg-extra-phones"></div><div class="neg-create-field"><label>E-mail</label><input id="neg-contact-email" type="email"></div><button class="neg-inline-action" type="button" onclick="addNegEmail()">+ Adicionar email</button><div id="neg-extra-emails"></div><div class="neg-create-field"><label>Contato e envio de comunicação</label><div class="neg-consent"><label><input type="radio" name="neg-consent" value="Aceitou"> Aceitou</label><label><input type="radio" name="neg-consent" value="Negou"> Negou</label></div><label style="margin-top:9px;font-weight:600"><input type="radio" name="neg-consent" value="Não sei dizer ou não possuo base legal"> Não sei dizer ou não possuo base legal</label></div><div class="neg-create-note">As informações serão salvas ao criar a negociação.</div><button class="neg-inline-action" type="button" onclick="removeNegContact()">Remover contato</button></div>'+
          '<div class="neg-create-section">Campos personalizados</div><button class="neg-inline-action" type="button" onclick="toggleNegCustom()">+ Adicionar campo personalizado</button><div class="neg-custom-box" id="neg-custom-box"><div class="neg-create-field"><label>Campo personalizado</label><input id="neg-custom-value" placeholder="Valor de demonstração"></div></div></div>'+

        document.body.appendChild(overlay);document.body.appendChild(drawer);
      }
      function fillNegCreateFunnel(){
        var funnel=document.getElementById('neg-create-funnel');if(!funnel)return;
        var funis=STATE.funis.filter(function(x){return !x.arquivado});funnel.innerHTML=funis.map(function(x){return '<option value="'+x.id+'">'+x.nome+'</option>'}).join('');
        funnel.value=String(STATE.activeFunilId||funis[0].id);funnel.onchange=fillNegCreateStages;fillNegCreateStages();
      }
      function fillNegCreateStages(){
        var funnel=document.getElementById('neg-create-funnel');var stage=document.getElementById('neg-create-stage');if(!funnel||!stage)return;
        var f=STATE.funis.find(function(x){return String(x.id)===String(funnel.value)})||activeFunil();stage.innerHTML=f.etapas.map(function(x){return '<option value="'+x.id+'">'+x.nome+'</option>'}).join('');
      }
      function openNegCreateDrawer(){closeNegCreateMenu();ensureNegCreateUI();fillNegCreateFunnel();document.getElementById('neg-create-error').classList.remove('show');document.getElementById('neg-create-overlay').classList.add('open');document.getElementById('neg-create-drawer').classList.add('open');setTimeout(function(){var n=document.getElementById('neg-create-name');if(n)n.focus()},50)}
      function closeNegCreateDrawer(){var o=document.getElementById('neg-create-overlay');var d=document.getElementById('neg-create-drawer');if(o)o.classList.remove('open');if(d)d.classList.remove('open')}
      function toggleNegInline(id){var el=document.getElementById(id);if(el)el.classList.toggle('open')}
      function toggleNegCustom(){var el=document.getElementById('neg-custom-box');if(el)el.classList.toggle('open')}
      function removeNegCompany(){var el=document.getElementById('neg-company-box');if(el)el.classList.remove('open');['neg-company-name','neg-company-url','neg-company-summary'].forEach(function(id){var x=document.getElementById(id);if(x)x.value=''})}
      function removeNegContact(){var el=document.getElementById('neg-contact-box');if(el)el.classList.remove('open');['neg-contact-name','neg-contact-role','neg-contact-phone','neg-contact-email'].forEach(function(id){var x=document.getElementById(id);if(x)x.value=''})}
      function addNegPhone(){var box=document.getElementById('neg-extra-phones');if(box){var d=document.createElement('div');d.className='neg-create-field';d.innerHTML='<label>Telefone adicional</label><input>';box.appendChild(d)}}
      function addNegEmail(){var box=document.getElementById('neg-extra-emails');if(box){var d=document.createElement('div');d.className='neg-create-field';d.innerHTML='<label>E-mail adicional</label><input type="email">';box.appendChild(d)}}
      function resetNegCreateForm(){var d=document.getElementById('neg-create-drawer');if(!d)return;d.querySelectorAll('input,textarea').forEach(function(x){if(x.type==='radio'||x.type==='checkbox')x.checked=false;else x.value=''});d.querySelectorAll('.neg-inline-box,.neg-custom-box').forEach(function(x){x.classList.remove('open')});var extra=document.getElementById('neg-extra-phones');if(extra)extra.innerHTML='';extra=document.getElementById('neg-extra-emails');if(extra)extra.innerHTML='';fillNegCreateFunnel()}
      function submitNegCreate(again){
        var name=document.getElementById('neg-create-name');var error=document.getElementById('neg-create-error');var companyBox=document.getElementById('neg-company-box');var contactBox=document.getElementById('neg-contact-box');
        var msgs=[];if(!name||name.value.trim().length<2)msgs.push('O nome da negociação deve conter pelo menos 2 caracteres.');if(companyBox&&companyBox.classList.contains('open')){var cn=document.getElementById('neg-company-name');if(!cn||cn.value.trim().length<2)msgs.push('O nome da empresa deve conter pelo menos 2 caracteres.')}if(contactBox&&contactBox.classList.contains('open')){var pn=document.getElementById('neg-contact-name');if(!pn||pn.value.trim().length<2)msgs.push('O nome do contato deve conter pelo menos 2 caracteres.')}
        if(msgs.length){error.innerHTML=msgs.join('<br>');error.classList.add('show');return}error.classList.remove('show');showToast('Negociação criada no ambiente demonstrativo.');if(again){resetNegCreateForm();setTimeout(function(){document.getElementById('neg-create-name').focus()},50)}else{closeNegCreateDrawer()}
      }
      document.addEventListener('click',function(e){if(!e.target.closest('.neg-create-wrap'))closeNegCreateMenu()});
      document.getElementById('drawer-overlay').addEventListener('click',closeNegFilters);
      var NEG_BASE_RENDER=render;
      render=function(){var drawer=document.getElementById('drawer');if(STATE.view!=='negociacoes'){drawer.classList.remove('neg-filter-drawer')}NEG_BASE_RENDER()};
      render();
    `;
    MODULES.funil.html=MODULES.funil.html.replace('</head>','<style>'+FUNIL_FILTER_CSS+'</style></head>').replace('</body>','<scr'+'ipt>'+FUNIL_FILTER_JS+'</scr'+'ipt></body>');
    const iframe=document.querySelector('#prototype');
    const home=document.querySelector('#home');
    const breadcrumb=document.querySelector('#breadcrumb');
    const back=document.querySelector('#back');
    let current='home';
    function openModule(id){
      document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.module===id));
      if(id==='home'){current='home';iframe.classList.remove('visible');home.classList.remove('hidden');breadcrumb.textContent='Configurações';back.hidden=true;history.replaceState(null,'','#home');return}
      const item=MODULES[id];if(!item)return;
      current=id;home.classList.add('hidden');iframe.classList.add('visible');iframe.srcdoc=item.html;breadcrumb.textContent='Configurações / '+item.title;back.hidden=false;history.replaceState(null,'','#'+id);
    }
    document.addEventListener('click',event=>{const target=event.target.closest('[data-module]');if(target)openModule(target.dataset.module)});
    back.addEventListener('click',()=>openModule('home'));
    document.querySelector('#refresh').addEventListener('click',()=>{if(current==='home')location.reload();else iframe.srcdoc=MODULES[current].html});
    const initial=location.hash.slice(1);openModule(MODULES[initial]?initial:'home');
  </script>
</body>
