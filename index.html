ionarFunil(id) {\n  STATE.activeFunilId = id;\n  render();\n  showToast('Funil selecionado');\n}\n\n/* ============ TELA CONFIG FUNIS (listagem + trilha + etapas) ============ */\nfunction renderConfigFunis(c) {\n  const funisAtivos = STATE.funis.filter(x => !x.arquivado);\n  c.innerHTML = `\n    \u003ca onclick=\"goToNegociacoes()\" style=\"font-size:12px;color:#64748B;cursor:pointer;display:inline-block;margin-bottom:1rem;\">← Voltar\u003c/a>\n    \u003cdiv style=\"display:flex;gap:16px;border-bottom:1px solid #E2E8F0;margin-bottom:1.5rem;font-size:12px;\">\n      \u003cdiv style=\"padding-bottom:6px;font-weight:600;border-bottom:2px solid #00D9C0;color:#0a5f56;\">Funil de vendas\u003c/div>\n      \u003cdiv style=\"padding-bottom:6px;color:#94A3B8;\">CRM2CRM\u003c/div>\n    \u003c/div>\n    ${funisAtivos.map(f => renderFunilBlock(f)).join('\u003cdiv style=\"border-top:1px solid #E2E8F0;margin:2rem 0;\">\u003c/div>')}\n    \u003cbutton class=\"btn primary\" style=\"margin-top:1.5rem;\" onclick=\"criarFunil()\">Adicionar Funil de Vendas\u003c/button>\n  `;\n}\n\nfunction renderFunilBlock(f) {\n  let trilha = '';\n  for (let i = 0; i \u003c f.etapas.length; i++) {\n    const e = f.etapas[i];\n    const selClass = STATE.etapaSelecionadaId === e.id ? 'selecionada' : '';\n    trilha += '\u003cdiv class=\"trilha-bolinha ' + selClass + '\" onclick=\"selecionarEtapa(' + f.id + ', ' + e.id + ')\">\u003c/div>';\n    if (STATE.etapaSelecionadaId === e.id) {\n      trilha += '\u003cdiv class=\"trilha-setas\">\u003cspan onclick=\"moverEtapa(' + f.id + ',' + e.id + ',-1)\">‹\u003c/span>\u003cspan onclick=\"moverEtapa(' + f.id + ',' + e.id + ',1)\">›\u003c/span>\u003c/div>';\n    }\n    if (i \u003c f.etapas.length - 1) {\n      trilha += '\u003cdiv class=\"trilha-linha\">\u003c/div>';\n    }\n  }\n\n  let etapasCards = '';\n  for (const e of f.etapas) {\n    const onClass = e.destacarEsfriando ? 'on' : '';\n    let diasBlock = '';\n    if (e.destacarEsfriando) {\n      diasBlock = '\u003cdiv style=\"margin-top:4px;\">\u003cinput type=\"number\" value=\"' + e.dias + '\" style=\"width:36px;font-size:10.5px;padding:2px 4px;border:1px solid #CBD5E1;border-radius:4px;\" onchange=\"atualizarDias(' + f.id + ',' + e.id + ',this.value)\"> \u003cspan style=\"font-size:10px;\">dias\u003c/span>\u003c/div>';\n    }\n    etapasCards += '\u003cdiv class=\"etapa-card\">' +\n      '\u003cstrong contenteditable=\"true\" onblur=\"renomearEtapaInline(' + f.id + ', ' + e.id + ', this.innerText)\">' + e.nome + '\u003c/strong>' +\n      '\u003cspan>Sigla: ' + e.sigla + '\u003c/span>' +\n      '\u003cdiv class=\"toggle-row\">\u003cspan style=\"font-size:10.5px;\">Destacar esfriando\u003c/span>' +\n      '\u003cbutton class=\"mini-toggle ' + onClass + '\" onclick=\"toggleEsfriando(' + f.id + ',' + e.id + ')\">\u003cspan class=\"knob\">\u003c/span>\u003c/button>\u003c/div>' +\n      diasBlock +\n      '\u003cp class=\"cfg-link\" onclick=\"abrirConfigurarEtapa(' + f.id + ', ' + e.id + ')\">⚙ Configurar etapa\u003c/p>' +\n      '\u003c/div>';\n  }\n\n  let deletarLink = '';\n  if (STATE.etapaSelecionadaId) {\n    const etapaSel = f.etapas.find(e => e.id === STATE.etapaSelecionadaId);\n    const nomeSel = etapaSel ? etapaSel.nome : '';\n    deletarLink = '\u003cp style=\"font-size:11px;color:#E45858;margin-top:1rem;cursor:pointer;\" onclick=\"abrirModalExcluirEtapa(' + f.id + ')\">🗑️ Deletar etapas selecionadas: \u003cstrong>' + nomeSel + '\u003c/strong>\u003c/p>';\n  }\n\n  return `\n    \u003cdiv>\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;\">\n        \u003cdiv style=\"display:flex;align-items:center;gap:8px;\">\n          \u003cstrong style=\"font-size:15px;\">${f.nome}\u003c/strong>\n          \u003cbutton class=\"btn-icon\" onclick=\"abrirMenuFunil(event, ${f.id})\">⋮\u003c/button>\n        \u003c/div>\n        \u003cbutton class=\"btn\" style=\"font-size:11.5px;\">+ Automação entre funis\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"trilha\">${trilha}\u003cbutton class=\"trilha-add\" onclick=\"criarEtapa(${f.id})\">+\u003c/button>\u003c/div>\n      \u003cdiv class=\"etapas-grid\" style=\"grid-template-columns:repeat(${Math.min(f.etapas.length,6)},1fr);\">${etapasCards}\u003c/div>\n      ${deletarLink}\n    \u003c/div>\n  `;\n}\n\nfunction selecionarEtapa(funilId, etapaId) {\n  STATE.etapaSelecionadaId = STATE.etapaSelecionadaId === etapaId ? null : etapaId;\n  render();\n}\n\nfunction moverEtapa(funilId, etapaId, direcao) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const idx = f.etapas.findIndex(e => e.id === etapaId);\n  const novoIdx = idx + direcao;\n  if (novoIdx \u003c 0 || novoIdx >= f.etapas.length) return;\n  const temp = f.etapas[idx];\n  f.etapas[idx] = f.etapas[novoIdx];\n  f.etapas[novoIdx] = temp;\n  render();\n  showToast('Etapa reordenada');\n}\n\nfunction renomearEtapaInline(funilId, etapaId, novoNome) {\n  novoNome = novoNome.trim();\n  const f = STATE.funis.find(x => x.id === funilId);\n  const e = f.etapas.find(x => x.id === etapaId);\n  if (!novoNome) { showToast('Nome da etapa não pode ficar em branco'); render(); return; }\n  e.nome = novoNome;\n  showToast('Etapa renomeada');\n}\n\nfunction toggleEsfriando(funilId, etapaId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const e = f.etapas.find(x => x.id === etapaId);\n  e.destacarEsfriando = !e.destacarEsfriando;\n  render();\n}\nfunction atualizarDias(funilId, etapaId, valor) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const e = f.etapas.find(x => x.id === etapaId);\n  e.dias = parseInt(valor) || 1;\n}\n\nfunction criarEtapa(funilId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const novaEtapa = { id: nextEtapaId++, nome: 'Nova Etapa', sigla: 'NE', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 };\n  f.etapas.push(novaEtapa);\n  render();\n  showToast('Etapa criada');\n}\n\nfunction abrirConfigurarEtapa(funilId, etapaId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const e = f.etapas.find(x => x.id === etapaId);\n  const idx = f.etapas.findIndex(x => x.id === etapaId);\n  const html = `\n    \u003cdiv style=\"background:#F7F9FB;border-radius:10px;padding:1rem;max-width:420px;margin-top:1.5rem;\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:0.75rem;\">\u003ch4 style=\"margin:0;font-size:14px;\">Configuração da etapa\u003c/h4>\u003cspan style=\"color:#94A3B8;cursor:pointer;\" onclick=\"fecharConfigurarEtapa()\">✕\u003c/span>\u003c/div>\n      \u003cdiv class=\"info-box\" style=\"font-size:10.5px;\">💡 Quando você define que um campo é obrigatório, a negociação só avança para a próxima etapa se a informação estiver preenchida.\u003c/div>\n      \u003clabel class=\"field-label\">Nome da etapa\u003c/label>\n      \u003cinput class=\"field-input\" id=\"cfg-etapa-nome\" value=\"${e.nome}\">\n      \u003clabel class=\"field-label\">Descrição de etapa\u003c/label>\n      \u003ctextarea class=\"field-input\" id=\"cfg-etapa-desc\" style=\"height:60px;\" placeholder=\"Orientação para o time de vendas nesta etapa.\">${e.descricao}\u003c/textarea>\n      \u003cdiv class=\"modal-footer\">\n        \u003cbutton class=\"btn\" onclick=\"fecharConfigurarEtapa()\">Cancelar\u003c/button>\n        \u003cbutton class=\"btn primary\" onclick=\"salvarConfigurarEtapa(${funilId}, ${etapaId})\">Salvar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `;\n  window._configEtapaHtml = html;\n  window._configEtapaFunilId = funilId;\n  render();\n  setTimeout(() => {\n    const grids = document.querySelectorAll('.etapas-grid');\n    grids.forEach(g => {\n      if (g.parentElement.querySelector('.trilha')) {\n        const wrapper = document.createElement('div');\n        wrapper.innerHTML = window._configEtapaHtml;\n        g.parentElement.appendChild(wrapper.firstElementChild);\n      }\n    });\n  }, 0);\n}\nfunction fecharConfigurarEtapa() { window._configEtapaHtml = null; render(); }\nfunction salvarConfigurarEtapa(funilId, etapaId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const e = f.etapas.find(x => x.id === etapaId);\n  e.nome = document.getElementById('cfg-etapa-nome').value || e.nome;\n  e.descricao = document.getElementById('cfg-etapa-desc').value;\n  window._configEtapaHtml = null;\n  render();\n  showToast('Alterações salvas');\n}\n\nfunction abrirModalExcluirEtapa(funilId) {\n  openModal(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:1rem;\">\u003ch3>Deseja excluir as Etapas do Funil?\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cp style=\"font-size:11.5px;color:#47576A;margin:0 0 0.5rem;\">Você pode enviar as Etapas do Funil para a lixeira ou excluir permanentemente da sua conta.\u003c/p>\n    \u003cp style=\"font-size:11.5px;color:#47576A;margin:0 0 1rem;\">Importante: ao excluir uma etapa, todas as negociações vinculadas a ela (caso existam) serão movidas para a primeira etapa do funil.\u003c/p>\n    \u003clabel style=\"font-size:11.5px;display:flex;gap:8px;align-items:flex-start;margin-bottom:1.25rem;\">\u003cinput type=\"checkbox\" id=\"chk-confirma-exclusao\" style=\"width:auto;margin-top:2px;\" onchange=\"togglePermanenteBtn()\">Entendo que ao excluir não conseguirei recuperar a informação.\u003c/label>\n    \u003cdiv style=\"display:flex;justify-content:space-between;\">\n      \u003cbutton class=\"btn\" style=\"border:none;color:#0C447C;\" onclick=\"excluirEtapaViaLixeira(${funilId})\">Enviar para a lixeira\u003c/button>\n      \u003cbutton class=\"btn danger-fill disabled\" id=\"btn-excluir-permanente\" onclick=\"excluirEtapaPermanente(${funilId})\" disabled>Excluir permanentemente\u003c/button>\n    \u003c/div>\n  `);\n}\nfunction togglePermanenteBtn() {\n  const chk = document.getElementById('chk-confirma-exclusao');\n  const btn = document.getElementById('btn-excluir-permanente');\n  if (chk.checked) { btn.classList.remove('disabled'); btn.disabled = false; }\n  else { btn.classList.add('disabled'); btn.disabled = true; }\n}\n\nfunction realocarEExcluir(funilId, permanente) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const idx = f.etapas.findIndex(e => e.id === STATE.etapaSelecionadaId);\n  if (idx === -1) return false;\n  const etapa = f.etapas[idx];\n\n  if (idx === 0 && etapa.negociacoes > 0) {\n    closeModal();\n    showToast('Bloqueado: 1ª etapa com negociações não pode ser excluída');\n    return false;\n  }\n  if (etapa.negociacoes > 0) {\n    f.etapas[0].negociacoes += etapa.negociacoes;\n  }\n  f.etapas.splice(idx, 1);\n  STATE.etapaSelecionadaId = null;\n  closeModal();\n  render();\n  showToast(permanente ? 'Etapa excluída permanentemente' : 'Solicitação de exclusão enviada para a Lixeira');\n  return true;\n}\nfunction excluirEtapaViaLixeira(funilId) { realocarEExcluir(funilId, false); }\nfunction excluirEtapaPermanente(funilId) { realocarEExcluir(funilId, true); }\n\n/* ============ MENU DE 3 PONTINHOS DO FUNIL ============ */\nfunction abrirMenuFunil(evt, funilId) {\n  evt.stopPropagation();\n  const menu = document.getElementById('ctx-menu');\n  const f = STATE.funis.find(x => x.id === funilId);\n  const ativos = STATE.funis.filter(x => !x.arquivado).length;\n  menu.innerHTML = `\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); renomearFunilPrompt(${funilId})\">Renomear\u003c/div>\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); marcarComoPadrao(${funilId})\">Marcar como padrão\u003c/div>\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); abrirPreferenciasFunil(${funilId})\">Preferências do funil\u003c/div>\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); abrirEquipesFunil(${funilId})\">Equipes do funil\u003c/div>\n    \u003cdiv class=\"ctx-sep\">\u003c/div>\n    \u003cdiv class=\"ctx-item muted\" onclick=\"closeCtx(); arquivarFunil(${funilId})\">Arquivar funil\u003c/div>\n    \u003cdiv class=\"ctx-item danger\" onclick=\"closeCtx(); abrirModalExcluirFunil(${funilId})\">Excluir funil\u003c/div>\n  `;\n  const rect = evt.target.getBoundingClientRect();\n  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';\n  menu.style.left = (rect.left + window.scrollX - 170) + 'px';\n  menu.style.width = '210px';\n  menu.classList.add('open');\n}\n\nfunction renomearFunilPrompt(funilId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  openModal(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:1rem;\">\u003ch3>Renomear funil\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003clabel class=\"field-label\">Nome do funil\u003c/label>\n    \u003cinput class=\"field-input\" id=\"renomear-funil-input\" value=\"${f.nome}\">\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarRenomearFunil(${funilId})\">Salvar\u003c/button>\n    \u003c/div>\n  `);\n}\nfunction confirmarRenomearFunil(funilId) {\n  const nome = document.getElementById('renomear-funil-input').value.trim();\n  if (!nome) { showToast('Nome não pode ficar em branco'); return; }\n  const f = STATE.funis.find(x => x.id === funilId);\n  f.nome = nome;\n  closeModal();\n  render();\n  showToast('Funil renomeado');\n}\n\nfunction marcarComoPadrao(funilId) {\n  STATE.funis.forEach(f => f.padrao = false);\n  STATE.funis.find(x => x.id === funilId).padrao = true;\n  render();\n}\n\nfunction arquivarFunil(funilId) {\n  const ativos = STATE.funis.filter(x => !x.arquivado);\n  if (ativos.length \u003c= 1) {\n    showToast('Bloqueado: não é possível arquivar o único funil ativo');\n    return;\n  }\n  const f = STATE.funis.find(x => x.id === funilId);\n  f.arquivado = true;\n  if (f.padrao) f.padrao = false;\n  if (STATE.activeFunilId === funilId) STATE.activeFunilId = STATE.funis.find(x => !x.arquivado).id;\n  render();\n  showToast('Funil arquivado');\n}\n\nfunction abrirModalExcluirFunil(funilId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  openModal(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:1rem;\">\u003ch3>Excluir funil \"${f.nome}\"?\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cp style=\"font-size:11.5px;color:#47576A;margin:0 0 1rem;\">Esta ação é permitida mesmo sendo o único funil da conta. A exclusão passa pela tela de Lixeira: vira uma solicitação em \"Exclusões Pendentes\", que precisa ser aprovada para se efetivar.\u003c/p>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarExcluirFunil(${funilId})\">Enviar para a Lixeira\u003c/button>\n    \u003c/div>\n  `);\n}\nfunction confirmarExcluirFunil(funilId) {\n  closeModal();\n  showToast('Solicitação de exclusão enviada para a Lixeira');\n}\n\n/* ============ CRIAR FUNIL (inline, sem modal) ============ */\nfunction criarFunil() {\n  STATE.funilCriadoContador++;\n  const novoFunil = {\n    id: nextFunilId++,\n    nome: `Funil de vendas ${STATE.funilCriadoContador}`,\n    padrao: false,\n    arquivado: false,\n    equipesVisiveis: [],\n    etapas: [\n      { id: nextEtapaId++, nome: 'Sem contato', sigla: 'SC', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n      { id: nextEtapaId++, nome: 'Contato feito', sigla: 'CF', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n      { id: nextEtapaId++, nome: 'Identificação do interesse', sigla: 'IDI', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n      { id: nextEtapaId++, nome: 'Apresentação', sigla: 'A', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n      { id: nextEtapaId++, nome: 'Proposta enviada', sigla: 'PE', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n    ],\n  };\n  STATE.funis.push(novoFunil);\n  render();\n  showToast('Funil criado');\n}\n\n/* ============ PREFERÊNCIAS DO FUNIL ============ */\nfunction renderProdutoCheckboxes() {\n  let html = '';\n  for (const p of STATE.produtos) {\n    const checked = p.exibirNoFunil ? 'checked' : '';\n    html += '\u003clabel style=\"font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;\">\u003cspan>' + p.nome + '\u003c/span>\u003cinput type=\"checkbox\" ' + checked + ' onchange=\"toggleProdutoExibirFromPreferencias(' + p.id + ')\">\u003c/label>';\n  }\n  return html;\n}\n\nfunction abrirPreferenciasFunil(funilId) {\n  STATE.activeFunilId = funilId;\n  const f = STATE.funis.find(x => x.id === funilId);\n  const abaProdutosAtiva = STATE.prefAbaAtiva === 'produtos';\n  openModal(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:0.75rem;\">\u003ch3>${f.nome}\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex;gap:20px;border-bottom:1px solid #E2E8F0;margin-bottom:1rem;font-size:13px;\">\n      \u003cdiv style=\"padding-bottom:8px;cursor:pointer;font-weight:${abaProdutosAtiva ? '600' : '400'};color:${abaProdutosAtiva ? '#0a5f56' : '#64748B'};border-bottom:${abaProdutosAtiva ? '2px solid #00D9C0' : 'none'};\" onclick=\"STATE.prefAbaAtiva='produtos'; abrirPreferenciasFunil(STATE.activeFunilId);\">Produtos e serviços do funil\u003c/div>\n      \u003cdiv style=\"padding-bottom:8px;cursor:pointer;font-weight:${abaProdutosAtiva ? '400' : '600'};color:${abaProdutosAtiva ? '#64748B' : '#0a5f56'};border-bottom:${abaProdutosAtiva ? 'none' : '2px solid #00D9C0'};\" onclick=\"STATE.prefAbaAtiva='motivos'; abrirPreferenciasFunil(STATE.activeFunilId);\">Motivos de perda do funil\u003c/div>\n    \u003c/div>\n    ${abaProdutosAtiva ? renderAbaProdutosPreferencias() : renderAbaMotivosPreferencias()}\n    \u003cdiv class=\"modal-footer\">\u003cbutton class=\"btn primary\" onclick=\"closeModal()\">Fechar\u003c/button>\u003c/div>\n  `);\n}\nfunction renderAbaProdutosPreferencias() {\n  const semProdutos = STATE.produtos.every(p => !p.exibirNoFunil);\n  const aviso = semProdutos ? '\u003cdiv class=\"danger-box\">\u003cstrong>Funil sem produtos e serviços\u003c/strong>\u003cp style=\"font-size:11px;margin:4px 0 0;\">Todo funil precisa ter pelo menos um produto ou serviço. Caso contrário, serão exibidos todos os produtos e serviços disponíveis.\u003c/p>\u003c/div>' : '';\n  return aviso +\n    '\u003cdiv style=\"border:1px solid #E2E8F0;border-radius:6px;padding:6px;\">' + renderProdutoCheckboxes() + '\u003c/div>' +\n    '\u003cp style=\"font-size:10px;color:#94A3B8;margin-top:0.75rem;\">Este é o mesmo controle da coluna \"Exibir no funil\" na listagem de Produtos e Serviços; alterar aqui reflete lá, e vice-versa.\u003c/p>';\n}\nfunction renderAbaMotivosPreferencias() {\n  const semMotivos = STATE.motivosPerda.every(m => !m.exibirNoFunil);\n  const aviso = semMotivos\n    ? '\u003cdiv class=\"danger-box\">\u003cstrong>Funil sem motivos de perda ativos\u003c/strong>\u003cp style=\"font-size:11px;margin:4px 0 0;\">Todo funil precisa ter pelo menos um motivo de perda ativado. Enquanto nenhum estiver ativo, o encerramento de negociações como perdidas fica bloqueado neste funil. (Diferente da aba Produtos e Serviços: aqui a ausência de seleção bloqueia, não mostra todos.)\u003c/p>\u003c/div>'\n    : '';\n  return aviso +\n    '\u003cdiv style=\"border:1px solid #E2E8F0;border-radius:6px;padding:6px;\">' + renderMotivoCheckboxes() + '\u003c/div>' +\n    '\u003cp style=\"font-size:10px;color:#94A3B8;margin-top:0.75rem;\">O cadastro, edição, arquivamento e exclusão dos motivos em si é feito na tela Motivo de Perda (Configurações → Motivo de perda). Aqui você só define quais ficam visíveis neste funil.\u003c/p>';\n}\nfunction renderMotivoCheckboxes() {\n  let html = '';\n  for (const m of STATE.motivosPerda) {\n    const checked = m.exibirNoFunil ? 'checked' : '';\n    html += '\u003clabel style=\"font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;\">\u003cspan>' + m.nome + '\u003c/span>\u003cinput type=\"checkbox\" ' + checked + ' onchange=\"toggleMotivoExibirFromPreferencias(' + m.id + ')\">\u003c/label>';\n  }\n  return html;\n}\nfunction toggleProdutoExibirFromPreferencias(produtoId) {\n  const p = STATE.produtos.find(x => x.id === produtoId);\n  p.exibirNoFunil = !p.exibirNoFunil;\n  abrirPreferenciasFunil(STATE.activeFunilId);\n}\nfunction toggleMotivoExibirFromPreferencias(motivoId) {\n  const m = STATE.motivosPerda.find(x => x.id === motivoId);\n  m.exibirNoFunil = !m.exibirNoFunil;\n  abrirPreferenciasFunil(STATE.activeFunilId);\n}\n\n/* ============ EQUIPES DO FUNIL ============ */\nfunction abrirEquipesFunil(funilId) {\n  STATE.activeFunilId = funilId;\n  const f = STATE.funis.find(x => x.id === funilId);\n  openDrawer(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;\">\n      \u003ch3 style=\"margin:0;font-size:16px;\">Editar funil\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeDrawer()\">✕\u003c/span>\n    \u003c/div>\n    \u003clabel class=\"field-label\">Nome do funil\u003c/label>\n    \u003cinput class=\"field-input\" id=\"edit-funil-nome\" value=\"${f.nome}\">\n    \u003clabel class=\"field-label\">Selecione quem pode ver este funil\u003c/label>\n    \u003cdiv style=\"border:1px solid #0C7CD5;border-radius:6px;padding:9px 10px;margin-bottom:6px;font-size:13px;cursor:default;\">Selecionar equipes ▾\u003c/div>\n    \u003cdiv style=\"border:1px solid #E2E8F0;border-radius:8px;padding:6px;margin-bottom:12px;\">\n      ${renderEquipeCheckboxes(f)}\n    \u003c/div>\n    \u003cdiv class=\"info-box\">Algumas pessoas podem usar funis que não estão visíveis para determinadas pessoas ou equipes. Por padrão, Administradores sempre veem o funil, mesmo com visibilidade restrita; para restringir também o Administrador, altere o papel dele para Usuário.\u003c/div>\n    \u003cdiv class=\"drawer-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeDrawer()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"salvarEquipesFunil(${funilId})\">Salvar\u003c/button>\n    \u003c/div>\n  `);\n}\nfunction renderEquipeCheckboxes(f) {\n  const todasMarcado = f.equipesVisiveis.length === 0;\n  let html = '\u003clabel style=\"font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;padding:8px 6px;\">\u003cinput type=\"checkbox\" ' + (todasMarcado ? 'checked' : '') + ' onchange=\"toggleTodasEquipes(' + f.id + ')\">Todas as equipes\u003c/label>';\n  for (const eq of STATE.equipes) {\n    const checked = f.equipesVisiveis.includes(eq.id) ? 'checked' : '';\n    html += '\u003clabel style=\"font-size:13px;display:flex;align-items:center;gap:8px;padding:8px 6px;\">\u003cinput type=\"checkbox\" ' + checked + ' onchange=\"toggleEquipeVisivel(' + f.id + ',' + eq.id + ')\">' + eq.nome + '\u003c/label>';\n  }\n  return html;\n}\nfunction toggleTodasEquipes(funilId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  f.equipesVisiveis = [];\n  abrirEquipesFunil(funilId);\n}\nfunction toggleEquipeVisivel(funilId, equipeId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  if (f.equipesVisiveis.includes(equipeId)) {\n    f.equipesVisiveis = f.equipesVisiveis.filter(id => id !== equipeId);\n  } else {\n    f.equipesVisiveis = f.equipesVisiveis.filter(id => id !== null).concat([equipeId]);\n  }\n  abrirEquipesFunil(funilId);\n}\nfunction salvarEquipesFunil(funilId) {\n  const f = STATE.funis.find(x => x.id === funilId);\n  const novoNome = document.getElementById('edit-funil-nome').value.trim();\n  if (novoNome) f.nome = novoNome;\n  closeDrawer();\n  render();\n  showToast('Visibilidade do funil atualizada');\n}\n\n/* ============ TELA CONFIGURAÇÕES GERAL ============ */\nfunction renderConfigGeral(c) {\n  c.innerHTML = `\n    \u003ch3 style=\"margin-bottom:1.5rem;\">Configurações\u003c/h3>\n    \u003cdiv class=\"cfg-grid\">\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">Configure seu processo de venda\u003c/p>\n        \u003cp class=\"cfg-link-item\" style=\"font-weight:600;cursor:pointer;color:#0C447C;\" onclick=\"STATE.view='config-funis'; render();\">Funis de vendas\u003c/p>\n        \u003cp class=\"cfg-link-item\">Configurar campos\u003c/p>\n      \u003c/div>\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">Avançado\u003c/p>\n        \u003cp class=\"cfg-link-item\">Importar dados\u003c/p>\n        \u003cp class=\"cfg-link-item\">Preferências\u003c/p>\n      \u003c/div>\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">Ajustes de sua conta\u003c/p>\n        \u003cp class=\"cfg-link-item highlight\" onclick=\"STATE.view='produtos'; render();\">Produtos e serviços\u003c/p>\n        \u003cp class=\"cfg-link-item highlight\" onclick=\"STATE.view='motivo-perda'; render();\">Motivo de perda\u003c/p>\n        \u003cp class=\"cfg-link-item\">Lixeira\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  `;\n}\n\n/* ============ TELA MOTIVO DE PERDA ============ */\nfunction renderMotivoPerda(c) {\n  c.innerHTML = `\n    \u003ca onclick=\"STATE.view='config-geral'; render();\" style=\"font-size:12px;color:#64748B;cursor:pointer;display:inline-block;margin-bottom:1rem;\">← Voltar\u003c/a>\n    \u003ch3 style=\"margin-bottom:0.5rem;\">Motivo de Perda\u003c/h3>\n    \u003cp style=\"font-size:11px;color:#64748B;margin:0 0 0.75rem;\">Cadastre todos os motivos de perda de negociações da sua empresa. Além de relatórios, você terá filtros para gerenciar melhor sua empresa e clientes.\u003c/p>\n    \u003cdiv style=\"border:1px solid #CBD5E1;border-radius:6px;padding:8px 10px;margin-bottom:0.5rem;display:flex;justify-content:space-between;align-items:center;\">\n      \u003cinput id=\"novo-motivo-input\" placeholder=\"Ex: Não gostou do produto\" style=\"border:none;font-size:12.5px;flex:1;outline:none;\">\n      \u003cspan style=\"font-size:11px;color:#fff;background:#0C447C;padding:4px 10px;border-radius:5px;margin-right:6px;cursor:pointer;\" onclick=\"criarMotivoPerda()\">Salvar\u003c/span>\n      \u003cspan style=\"font-size:11px;color:#fff;background:#E45858;padding:4px 10px;border-radius:5px;cursor:pointer;\" onclick=\"document.getElementById('novo-motivo-input').value=''\">Cancelar\u003c/span>\n    \u003c/div>\n    \u003cp style=\"font-size:10px;color:#94A3B8;margin:0 0 1rem;\">Esse item será exibido em todos os funis de venda que podem ver todos os motivos de perda. Acesse as Preferências do funil para definir em quais funis esse motivo de perda será visível.\u003c/p>\n    ${renderTabelaMotivos()}\n  `;\n}\nfunction renderTabelaMotivos() {\n  let rows = '\u003ctr>\u003cth>Nome do Motivo de Perda (' + STATE.motivosPerda.length + ')\u003c/th>\u003cth>Criado em\u003c/th>\u003cth style=\"width:20px;\">\u003c/th>\u003c/tr>';\n  for (const m of STATE.motivosPerda) {\n    rows += '\u003ctr>\u003ctd>' + m.nome + '\u003c/td>\u003ctd style=\"color:#94A3B8;\">' + m.criadoEm + '\u003c/td>\u003ctd>\u003cspan style=\"cursor:pointer;\" onclick=\"excluirMotivoPerda(' + m.id + ')\">🗑️\u003c/span>\u003c/td>\u003c/tr>';\n  }\n  return '\u003ctable>' + rows + '\u003c/table>';\n}\n\nfunction criarMotivoPerda() {\n  const input = document.getElementById('novo-motivo-input');\n  const nome = input.value.trim();\n  if (!nome) { showToast('Nome do motivo é obrigatório'); return; }\n  const hoje = new Date().toLocaleDateString('pt-BR');\n  STATE.motivosPerda.push({ id: nextMotivoId++, nome, criadoEm: hoje });\n  render();\n  showToast('Motivo de perda criado');\n}\nfunction excluirMotivoPerda(id) {\n  STATE.motivosPerda = STATE.motivosPerda.filter(m => m.id !== id);\n  render();\n  showToast('Motivo de perda excluído; negociações que já usavam mantêm o histórico');\n}\n\n/* ============ TELA PRODUTOS E SERVIÇOS ============ */\nfunction renderProdutos(c) {\n  c.innerHTML = `\n    \u003ca onclick=\"STATE.view='config-geral'; render();\" style=\"font-size:12px;color:#64748B;cursor:pointer;display:inline-block;margin-bottom:1rem;\">← Voltar\u003c/a>\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;\">\n      \u003ch3>Produtos e Serviços\u003c/h3>\n      \u003cdiv style=\"display:flex;gap:8px;\">\n        \u003cbutton class=\"btn\">Importar\u003c/button>\n        \u003cbutton class=\"btn primary\" onclick=\"abrirCriarProduto()\">+ Cadastrar produto ou serviço\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cinput class=\"field-input\" placeholder=\"Buscar\" style=\"margin-bottom:0.75rem;\">\n    ${renderTabelaProdutos()}\n  `;\n}\nfunction renderTabelaProdutos() {\n  let rows = '\u003ctr>\u003cth>Nome\u003c/th>\u003cth>Descrição\u003c/th>\u003cth>Valor\u003c/th>\u003cth>Exibir na negociação\u003c/th>\u003c/tr>';\n  for (const p of STATE.produtos) {\n    const checked = p.exibirNoFunil ? 'checked' : '';\n    rows += '\u003ctr>\u003ctd>' + p.nome + '\u003c/td>\u003ctd style=\"color:#94A3B8;\">' + p.descricao + '\u003c/td>\u003ctd>' + p.valor + '\u003c/td>' +\n      '\u003ctd>\u003cinput type=\"checkbox\" ' + checked + ' onchange=\"toggleProdutoExibir(' + p.id + ')\">\u003c/td>\u003c/tr>';\n  }\n  return '\u003ctable>' + rows + '\u003c/table>';\n}\nfunction toggleProdutoExibir(id) {\n  const p = STATE.produtos.find(x => x.id === id);\n  p.exibirNoFunil = !p.exibirNoFunil;\n}\n\nfunction abrirCriarProduto() {\n  openDrawer(`\n    \u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:1rem;\">\u003ch3 style=\"font-size:14px;\">Criar produto ou serviço\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeDrawer()\">✕\u003c/span>\u003c/div>\n    \u003cdiv class=\"info-box\" style=\"background:#EEEDFE;color:#3C3489;\">💡 Personalize o formulário de cadastro de Produtos e Serviços. \u003cspan style=\"text-decoration:underline;cursor:pointer;\">Criar novos campos\u003c/span>\u003c/div>\n    \u003clabel class=\"field-label\">Nome do produto ou serviço\u003c/label>\n    \u003cinput class=\"field-input\" id=\"novo-produto-nome\" style=\"margin-bottom:4px;\">\n    \u003cp class=\"field-note\">Esse item será exibido em todos os funis de venda que podem ver todos os produtos e serviços.\u003c/p>\n    \u003clabel class=\"field-label\">Descrição (opcional)\u003c/label>\n    \u003ctextarea class=\"field-input\" id=\"novo-produto-desc\" style=\"height:50px;\">\u003c/textarea>\n    \u003clabel class=\"field-label\">Valor\u003c/label>\n    \u003cinput class=\"field-input\" id=\"novo-produto-valor\" placeholder=\"R$ 0,00\">\n    \u003cdiv class=\"drawer-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeDrawer()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarCriarProduto()\">Salvar\u003c/button>\n    \u003c/div>\n  `);\n}\nfunction confirmarCriarProduto() {\n  const nome = document.getElementById('novo-produto-nome').value.trim();\n  const desc = document.getElementById('novo-produto-desc').value.trim();\n  const valor = document.getElementById('novo-produto-valor').value.trim() || 'R$ 0,00';\n  if (!nome) { showToast('Nome do produto é obrigatório'); return; }\n  STATE.produtos.push({ id: nextProdutoId++, nome, descricao: desc, valor, exibirNoFunil: true });\n  closeDrawer();\n  render();\n  showToast('Produto criado');\n}\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"perdas":{"icon":"🚫","title":"Motivos de Perda","description":"Cadastro, edição, arquivamento e exclusão simulados.","stat":"Fluxo funcional completo","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Protótipo; CRM Vigos (Motivos de Perda)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root {\n    --navy-deep: #0B1929;\n    --teal: #00D9C0;\n    --teal-dim: #0a5f56;\n    --bg-page: #F7F9FB;\n    --text-dark: #16232F;\n    --text-muted: #64748B;\n    --border-light: #E2E8F0;\n    --amber: #F5A623;\n    --amber-bg: #FEF3E2;\n    --red: #E45858;\n    --red-bg: #FCEAEA;\n    --green: #1FAA6E;\n    --green-bg: #E7F7EF;\n    --blue-bg: #E6F1FB;\n    --blue-text: #0C447C;\n    --coral-bg: #FAECE7;\n    --coral-text: #712B13;\n    --coral-border: #D85A30;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-page); color: var(--text-dark); min-height: 100vh; font-size: 13px; }\n  .app { display: flex; min-height: 100vh; }\n  .sidebar { width: 52px; background: var(--navy-deep); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 18px; color: #7C93AA; font-size: 16px; }\n  .sidebar .active { color: #fff; }\n  .main { flex: 1; min-width: 0; }\n  .topbar { background: var(--navy-deep); color: #fff; padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }\n  .topbar .brand { color: var(--teal); font-weight: 600; }\n  .content { background: #fff; padding: 1.25rem 1.5rem; }\n  .intro { font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.6; }\n  .btn { font-size: 12px; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }\n  .btn-primary { background: #00B8D4; color: #fff; }\n  .btn-danger { background: #E91E63; color: #fff; }\n  .btn-dark { background: var(--text-dark); color: #fff; }\n  .btn-outline { background: #fff; border: 0.5px solid #CBD5E1; color: var(--text-dark); }\n  .btn:disabled { background: #EFD3D3; color: #A32D2D; cursor: not-allowed; }\n  .btn-outline:disabled { background: #F1F1EF; color: #B4B2A9; cursor: not-allowed; }\n  input[type=text], select { font-size: 12.5px; padding: 8px 10px; border: 0.5px solid #CBD5E1; border-radius: 6px; }\n  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\n  th { color: var(--text-muted); text-align: left; font-weight: 500; padding: 8px 6px; border-bottom: 0.5px solid var(--border-light); }\n  td { padding: 9px 6px; border-top: 0.5px solid #F0F3F6; }\n  .link { color: #0C7CD5; cursor: pointer; }\n  .badge { font-size: 9px; background: #F1EFE8; color: #5F5E5A; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }\n  .toggle { display: inline-block; width: 34px; height: 18px; border-radius: 9px; position: relative; cursor: pointer; background: #CBD5E1; transition: background .15s; }\n  .toggle.on { background: var(--teal); }\n  .toggle .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left .15s; }\n  .toggle.on .knob { left: 18px; }\n  .modal-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }\n  .modal-overlay.open { display: flex; }\n  .modal { background: #fff; border-radius: 12px; width: 440px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(11,25,41,0.15); }\n  .modal h3 { font-size: 15px; margin: 0 0 10px; }\n  .warn-box { border-left: 3px solid var(--coral-border); background: var(--coral-bg); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }\n  .warn-box p { margin: 0; font-size: 11.5px; color: var(--coral-text); line-height: 1.5; }\n  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .2s; z-index: 20; }\n  .toast.show { opacity: 1; }\n  .tabs { display: flex; gap: 20px; border-bottom: 0.5px solid var(--border-light); margin-bottom: 16px; font-size: 13px; }\n  .tab { padding-bottom: 8px; color: var(--text-muted); cursor: pointer; }\n  .tab.active { font-weight: 600; color: var(--teal-dim); border-bottom: 2px solid var(--teal); }\n  .inline-form { border: 0.5px solid var(--border-light); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; background: #FAFBFC; }\n  .field-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 8px; }\n  .field-row > div { flex: 1; }\n  .field-row label { font-size: 11.5px; font-weight: 600; display: block; margin-bottom: 4px; }\n  .field-row input { width: 100%; border: none; border-bottom: 1.5px solid #CBD5E1; background: transparent; box-sizing: border-box; }\n  .hint { font-size: 10.5px; color: #94A3B8; margin: 8px 0 0; line-height: 1.5; }\n  .error-text { font-size: 11px; color: #A32D2D; margin: 4px 0 0; }\n  .empty-state { text-align: center; padding: 48px 20px 24px; }\n  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }\n  .empty-state h4 { font-size: 14px; margin: 0 0 6px; }\n  .empty-state p { font-size: 12px; color: var(--text-muted); max-width: 360px; margin: 0 auto; }\n  .breadcrumb { font-size: 11px; color: #94A3B8; margin: 0 0 4px; }\n  h2 { font-size: 20px; margin: 0 0 14px; }\n  .back { color: #0C7CD5; cursor: pointer; text-decoration: none; }\n\u003c/style>\n\u003cstyle>\n  .proto-banner{display:none!important}\n  .app-shell{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}\n  .app-sidebar,.sidebar{display:none!important}\n  body{background:#fff!important;color:#102d3d!important}\n  .app-topbar,.topbar{background:#fff!important;color:#102d3d!important;border-bottom:1px solid #e3e9ee!important}\n  .app-content{padding:28px 34px!important}\n  button,.btn{border-radius:6px!important}\n  .btn.primary,.btn-primary{background:#06283b!important;color:#fff!important}\n  .summary-card{border:1px solid #e3e9ee!important;background:#f8fafb!important}\n  table th{color:#607486!important;font-weight:600!important}\n  .entity-icon{font-family:Inter,sans-serif!important}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"sidebar\">\n    \u003cdiv class=\"active\">&#8962;\u003c/div>\u003cdiv>&#128100;\u003c/div>\u003cdiv>&#128257;\u003c/div>\u003cdiv>&#127970;\u003c/div>\u003cdiv>&#9776;\u003c/div>\u003cdiv>&#128202;\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"topbar\">\n      \u003cdiv class=\"brand\">&#9670; CRM\u003c/div>\n      \u003cdiv>&#128269; &#10022; &#9638; &#128276; &#9881; &#127970; Rede Filantropia\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"content\" id=\"content\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"modal-overlay\" id=\"modal-overlay\">\n  \u003cdiv class=\"modal\" id=\"modal-body\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\nvar motivos = [\n  { id: 1, nome: \"Cliente optou por não realizar o Curso\", status: \"ativo\", emUso: true, criado: \"20/09/2022\", alterado: \"30/09/2022\" },\n  { id: 2, nome: \"Curso já começou / Inscrição encerrada\", status: \"ativo\", emUso: false, criado: \"15/09/2023\", alterado: \"15/09/2023\" },\n  { id: 3, nome: \"Formato do curso (presencial / online)\", status: \"ativo\", emUso: false, criado: \"15/09/2023\", alterado: \"15/09/2023\" },\n  { id: 4, nome: \"Instituição não vai arcar\", status: \"arquivado\", emUso: true, criado: \"30/09/2022\", alterado: \"30/09/2022\" }\n];\nvar funilMotivos = { 1: true };\nvar currentView = \"listagem\";\nvar cadastroAberto = false;\nvar editandoId = null;\nvar selecionados = [];\nvar filtroFunil = \"todos\";\n\nfunction toast(msg) {\n  var t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  setTimeout(function () { t.classList.remove('show'); }, 2200);\n}\n\nfunction openModal(html) {\n  document.getElementById('modal-body').innerHTML = html;\n  document.getElementById('modal-overlay').classList.add('open');\n}\nfunction closeModal() {\n  document.getElementById('modal-overlay').classList.remove('open');\n}\n\nfunction render() {\n  if (currentView === \"listagem\") renderListagem();\n  else if (currentView === \"funil\") renderFunil();\n  else if (currentView === \"negociacao\") renderNegociacao();\n}\n\nfunction renderListagem() {\n  var rows = motivos.map(function (m) {\n    var nomeCell;\n    if (m.status === \"arquivado\") {\n      nomeCell = '\u003cspan style=\"color:#94A3B8;\">' + m.nome + '\u003cspan class=\"badge\">arquivado\u003c/span>\u003c/span>';\n    } else {\n      nomeCell = '\u003cspan class=\"link\" onclick=\"editarMotivo(' + m.id + ')\">' + m.nome + '\u003c/span>';\n    }\n    var acaoCell;\n    if (m.status === \"arquivado\") {\n      acaoCell = '\u003cspan class=\"link\" onclick=\"desarquivar(' + m.id + ')\" title=\"Desarquivar\">&#8634;\u003c/span>';\n    } else {\n      acaoCell = '\u003cspan class=\"link\" onclick=\"pedirExclusao([' + m.id + '])\" title=\"Excluir\">&#128465;\u003c/span>';\n    }\n    return '\u003ctr>' +\n      '\u003ctd>\u003cinput type=\"checkbox\" ' + (selecionados.indexOf(m.id) > -1 ? \"checked\" : \"\") + ' onchange=\"toggleSelecionar(' + m.id + ')\">\u003c/td>' +\n      '\u003ctd>' + nomeCell + '\u003c/td>' +\n      '\u003ctd style=\"color:#94A3B8;\">' + m.criado + '\u003c/td>' +\n      '\u003ctd style=\"color:#94A3B8;\">' + m.alterado + '\u003c/td>' +\n      '\u003ctd>' + acaoCell + '\u003c/td>' +\n      '\u003c/tr>';\n  }).join(\"\");\n\n  var formHtml = \"\";\n  if (cadastroAberto) {\n    var valorAtual = editandoId ? motivos.filter(function (m) { return m.id === editandoId; })[0].nome : \"\";\n    formHtml = '\u003cdiv class=\"inline-form\">' +\n      '\u003cdiv class=\"field-row\">' +\n      '\u003cdiv>\u003clabel>Motivo de Perda *\u003c/label>' +\n      '\u003cinput type=\"text\" id=\"input-nome\" placeholder=\"Ex: Não gostou do produto\" value=\"' + valorAtual + '\">\u003c/div>' +\n      '\u003cbutton class=\"btn btn-primary\" onclick=\"salvarMotivo()\">Salvar\u003c/button>' +\n      '\u003cbutton class=\"btn btn-danger\" onclick=\"cancelarCadastro()\">Cancelar\u003c/button>' +\n      '\u003c/div>' +\n      '\u003cp class=\"error-text\" id=\"erro-nome\" style=\"display:none;\">\u003c/p>' +\n      '\u003cp class=\"hint\">Esse item será exibido em todos os funis de venda que podem ver todos os motivos de perda. Acesse as preferências de funil na \u003cspan class=\"link\" onclick=\"irParaFunil()\">página de funis de venda\u003c/span> para definir em quais funis esse motivo de perda será visível.\u003c/p>' +\n      '\u003c/div>';\n  } else {\n    formHtml = '\u003cdiv style=\"display:flex;justify-content:flex-end;margin-bottom:14px;\">' +\n      '\u003cbutton class=\"btn btn-primary\" onclick=\"abrirCadastro()\">+ Adicionar Motivo de Perda\u003c/button>' +\n      '\u003c/div>';\n  }\n\n  var barraSelecao = \"\";\n  if (selecionados.length > 0) {\n    barraSelecao = '\u003cdiv style=\"background:#16324A;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;cursor:pointer;\" onclick=\"pedirExclusao(selecionados)\">' +\n      '&#128465; Apagar o(s) ' + selecionados.length + ' motivo(s) de perda selecionado(s)\u003c/div>';\n  }\n\n  document.getElementById('content').innerHTML =\n    '\u003cp class=\"intro\">Cadastre todos os motivos de perda de negociações da sua empresa.\u003cbr>Além de relatórios, você terá filtros para gerenciar melhor sua empresa e clientes.\u003c/p>' +\n    formHtml +\n    '\u003cdiv style=\"margin-bottom:12px;\">\u003cinput type=\"text\" placeholder=\"Pesquisar...\" style=\"width:260px;\">\u003c/div>' +\n    barraSelecao +\n    '\u003ctable>\u003ctr>\u003cth style=\"width:22px;\">\u003cinput type=\"checkbox\" onchange=\"toggleSelecionarTodos(this.checked)\">\u003c/th>' +\n    '\u003cth>Nome do Motivo de Perda (' + motivos.length + ')\u003c/th>' +\n    '\u003cth style=\"width:110px;\">Criado em\u003c/th>\u003cth style=\"width:130px;\">Última alteração\u003c/th>\u003cth style=\"width:50px;\">Opções\u003c/th>\u003c/tr>' +\n    rows + '\u003c/table>' +\n    '\u003cp style=\"font-size:10.5px;color:#94A3B8;margin-top:14px;\">Motivos ativos configurados neste momento: ' + motivos.filter(function (m) { return m.status === \"ativo\"; }).length + '. Vá para \u003cspan class=\"link\" onclick=\"irParaFunil()\">Preferências do funil\u003c/span> para testar o encerramento de negociação como perdida.\u003c/p>';\n}\n\nfunction abrirCadastro() { cadastroAberto = true; editandoId = null; render(); }\nfunction editarMotivo(id) { cadastroAberto = true; editandoId = id; render(); }\nfunction cancelarCadastro() { cadastroAberto = false; editandoId = null; render(); }\n\nfunction salvarMotivo() {\n  var val = document.getElementById('input-nome').value.trim();\n  var errEl = document.getElementById('erro-nome');\n  if (!val) {\n    errEl.textContent = \"Nome é obrigatório.\";\n    errEl.style.display = \"block\";\n    return;\n  }\n  var duplicado = motivos.some(function (m) { return m.nome === val && m.id !== editandoId; });\n  if (duplicado) {\n    errEl.textContent = \"Já existe um motivo com esse nome exato.\";\n    errEl.style.display = \"block\";\n    return;\n  }\n  if (editandoId) {\n    var m = motivos.filter(function (m) { return m.id === editandoId; })[0];\n    m.nome = val;\n    m.alterado = \"hoje\";\n    toast(\"Alterações salvas\");\n  } else {\n    var novoId = Math.max.apply(null, motivos.map(function (m) { return m.id; })) + 1;\n    motivos.push({ id: novoId, nome: val, status: \"ativo\", emUso: false, criado: \"hoje\", alterado: \"hoje\" });\n    toast(\"Motivo criado\");\n  }\n  cadastroAberto = false;\n  editandoId = null;\n  render();\n}\n\nfunction toggleSelecionar(id) {\n  if (selecionados.indexOf(id) > -1) {\n    selecionados = selecionados.filter(function (x) { return x !== id; });\n  } else {\n    selecionados = selecionados.concat([id]);\n  }\n  render();\n}\nfunction toggleSelecionarTodos(checked) {\n  selecionados = checked ? motivos.filter(function (m) { return m.status === 'ativo'; }).map(function (m) { return m.id; }) : [];\n  render();\n}\n\nfunction pedirExclusao(ids) {\n  var algumEmUso = ids.some(function (id) {\n    var m = motivos.filter(function (m) { return m.id === id; })[0];\n    return m && m.emUso;\n  });\n  if (algumEmUso) {\n    var nomes = ids.filter(function (id) {\n      var m = motivos.filter(function (m) { return m.id === id; })[0];\n      return m && m.emUso;\n    }).map(function (id) {\n      return motivos.filter(function (m) { return m.id === id; })[0].nome;\n    }).join(\", \");\n    openModal(\n      '\u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:10px;\">\u003ch3>Arquivar motivo de perda?\u003c/h3>\u003cspan style=\"color:#94A3B8;cursor:pointer;\" onclick=\"closeModal()\">&#10005;\u003c/span>\u003c/div>' +\n      '\u003cp style=\"font-size:12.5px;color:#475569;margin:0 0 10px;line-height:1.5;\">O motivo \u003cstrong>\"' + nomes + '\"\u003c/strong> está em uso em negociações já perdidas, por isso não pode ser excluído.\u003c/p>' +\n      '\u003cp style=\"font-size:12.5px;color:#475569;margin:0 0 14px;line-height:1.5;\">Ao arquivar, ele deixa de aparecer nas opções de seleção, mas o histórico das negociações já perdidas com esse motivo é preservado.\u003c/p>' +\n      '\u003cdiv style=\"display:flex;justify-content:flex-end;gap:8px;\">' +\n      '\u003cbutton class=\"btn btn-outline\" onclick=\"closeModal()\">Cancelar\u003c/button>' +\n      '\u003cbutton class=\"btn\" style=\"background:#5F5E5A;color:#fff;\" onclick=\"confirmarArquivar([' + ids.join(\",\") + '])\">Arquivar motivo\u003c/button>' +\n      '\u003c/div>'\n    );\n    return;\n  }\n  var barraLote = ids.length > 1 ? '\u003cdiv style=\"background:#16324A;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:11.5px;\">&#128465; Apagar o(s) ' + ids.length + ' motivo(s) de perda selecionado(s)\u003c/div>' : \"\";\n  openModal(\n    '\u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:10px;\">\u003ch3>Deseja excluir o Motivo de Perda?\u003c/h3>\u003cspan style=\"color:#94A3B8;cursor:pointer;\" onclick=\"closeModal()\">&#10005;\u003c/span>\u003c/div>' +\n    barraLote +\n    '\u003cp style=\"font-size:12.5px;color:#475569;margin:0 0 6px;line-height:1.5;\">Você pode enviar o Motivo de Perda para a lixeira ou excluir permanentemente da sua conta.\u003c/p>' +\n    '\u003cp style=\"font-size:12.5px;color:#475569;margin:0 0 14px;line-height:1.5;\">Se optar por excluir, lembre-se que não será possível recuperar a informação.\u003c/p>' +\n    '\u003clabel style=\"display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:16px;\">\u003cinput type=\"checkbox\" id=\"chk-confirma\" onchange=\"toggleConfirmaExclusao([' + ids.join(\",\") + '])\">Entendo que ao excluir não conseguirei recuperar a informação.\u003c/label>' +\n    '\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;border-top:0.5px solid #E2E8F0;padding-top:14px;\">' +\n    '\u003cspan class=\"link\" style=\"font-weight:600;\" onclick=\"confirmarLixeira([' + ids.join(\",\") + '])\">Enviar para a lixeira\u003c/span>' +\n    '\u003cspan id=\"btn-excluir-perm\" style=\"font-size:13px;font-weight:600;color:#CBD5E1;cursor:not-allowed;\">Excluir permanentemente\u003c/span>' +\n    '\u003c/div>'\n  );\n}\n\nfunction toggleConfirmaExclusao(ids) {\n  var checked = document.getElementById('chk-confirma').checked;\n  var btn = document.getElementById('btn-excluir-perm');\n  if (checked) {\n    btn.style.color = \"#D32F2F\";\n    btn.style.cursor = \"pointer\";\n    btn.className = \"link\";\n    btn.onclick = function () { confirmarExclusaoPermanente(ids); };\n  } else {\n    btn.style.color = \"#CBD5E1\";\n    btn.style.cursor = \"not-allowed\";\n    btn.className = \"\";\n    btn.onclick = null;\n  }\n}\n\nfunction confirmarArquivar(ids) {\n  ids.forEach(function (id) {\n    var m = motivos.filter(function (m) { return m.id === id; })[0];\n    if (m) m.status = \"arquivado\";\n  });\n  selecionados = [];\n  closeModal();\n  toast(\"Motivo arquivado\");\n  render();\n}\nfunction confirmarLixeira(ids) {\n  motivos = motivos.filter(function (m) { return ids.indexOf(m.id) === -1; });\n  selecionados = [];\n  closeModal();\n  toast(\"Enviado para a lixeira\");\n  render();\n}\nfunction confirmarExclusaoPermanente(ids) {\n  motivos = motivos.filter(function (m) { return ids.indexOf(m.id) === -1; });\n  selecionados = [];\n  closeModal();\n  toast(\"Excluído permanentemente\");\n  render();\n}\nfunction desarquivar(id) {\n  var m = motivos.filter(function (m) { return m.id === id; })[0];\n  if (m) m.status = \"ativo\";\n  toast(\"Motivo reativado\");\n  render();\n}\n\nfunction irParaFunil() { currentView = \"funil\"; render(); }\nfunction irParaListagem() { currentView = \"listagem\"; render(); }\nfunction irParaNegociacao() { currentView = \"negociacao\"; render(); }\n\nfunction renderFunil() {\n  var ativosNoFunil = motivos.filter(function (m) { return m.status === \"ativo\" && funilMotivos[m.id]; });\n  var semMotivo = ativosNoFunil.length === 0;\n  var listaMotivos = motivos.filter(function (m) { return m.status === \"ativo\"; });\n  if (filtroFunil === \"visiveis\") listaMotivos = listaMotivos.filter(function (m) { return funilMotivos[m.id]; });\n  if (filtroFunil === \"ocultos\") listaMotivos = listaMotivos.filter(function (m) { return !funilMotivos[m.id]; });\n\n  var avisoHtml = semMotivo ?\n    '\u003cdiv class=\"warn-box\">\u003cp style=\"font-weight:600;margin-bottom:4px;\">&#9888; Funil sem motivos de perda ativos\u003c/p>' +\n    '\u003cp>Todo funil precisa ter pelo menos um motivo de perda ativado. Enquanto nenhum estiver ativo, o encerramento de negociações como perdidas fica bloqueado neste funil.\u003c/p>\u003c/div>' : \"\";\n\n  var corpoHtml;\n  if (listaMotivos.length === 0) {\n    corpoHtml = '\u003cdiv class=\"empty-state\">\u003cdiv class=\"icon\">&#128193;\u003c/div>' +\n      '\u003ch4>Não encontramos motivos de perda com os filtros selecionados\u003c/h4>' +\n      '\u003cp>Cadastre novos motivos de perda ou experimente mudar os filtros aplicados para encontrar resultados.\u003c/p>\u003c/div>';\n  } else {\n    var linhas = listaMotivos.map(function (m) {\n      return '\u003ctr>\u003ctd>\u003cinput type=\"checkbox\">\u003c/td>\u003ctd style=\"font-weight:500;\">' + m.nome + '\u003c/td>' +\n        '\u003ctd style=\"text-align:right;\">\u003cdiv class=\"toggle ' + (funilMotivos[m.id] ? 'on' : '') + '\" onclick=\"toggleFunilMotivo(' + m.id + ')\">\u003cdiv class=\"knob\">\u003c/div>\u003c/div>\u003c/td>\u003c/tr>';\n    }).join(\"\");\n    corpoHtml = '\u003ctable>\u003ctr>\u003cth style=\"width:22px;\">\u003cinput type=\"checkbox\">\u003c/th>\u003cth>Nome\u003c/th>\u003cth style=\"text-align:right;width:130px;\">Exibir no funil &#9432;\u003c/th>\u003c/tr>' +\n      linhas + '\u003c/table>' +\n      '\u003cp style=\"font-size:11px;color:#94A3B8;margin-top:14px;\">Exibindo ' + listaMotivos.length + ' de ' + motivos.filter(function (m) { return m.status === 'ativo'; }).length + ' motivos de perda\u003c/p>';\n  }\n\n  document.getElementById('content').innerHTML =\n    '\u003cp class=\"breadcrumb\">Funis de venda\u003c/p>' +\n    '\u003ch2>\u003cspan class=\"back\" onclick=\"irParaListagem()\">&larr;\u003c/span> Eliana\u003c/h2>' +\n    '\u003cdiv class=\"tabs\">\u003cdiv class=\"tab\">Produtos e serviços do funil\u003c/div>\u003cdiv class=\"tab active\">Motivos de perda do funil\u003c/div>\u003c/div>' +\n    avisoHtml +\n    '\u003cp style=\"font-weight:600;margin:0 0 2px;\">Selecione os motivos de perda deste funil.\u003c/p>' +\n    '\u003cp style=\"color:var(--text-muted);margin:0 0 14px;\">Motivos ativados aqui ficam disponíveis para os vendedores ao perder uma negociação neste funil.\u003c/p>' +\n    '\u003cdiv style=\"display:flex;gap:10px;margin-bottom:14px;\">' +\n    '\u003cinput type=\"text\" placeholder=\"Buscar\" style=\"flex:1;\">' +\n    '\u003cselect onchange=\"mudarFiltroFunil(this.value)\">' +\n    '\u003coption value=\"todos\"' + (filtroFunil === 'todos' ? ' selected' : '') + '>Todos os motivos de perda\u003c/option>' +\n    '\u003coption value=\"visiveis\"' + (filtroFunil === 'visiveis' ? ' selected' : '') + '>Motivos de perda visíveis no funil\u003c/option>' +\n    '\u003coption value=\"ocultos\"' + (filtroFunil === 'ocultos' ? ' selected' : '') + '>Motivos de perda ocultos no funil\u003c/option>' +\n    '\u003c/select>\u003c/div>' +\n    corpoHtml;\n}\n\nfunction toggleFunilMotivo(id) {\n  funilMotivos[id] = !funilMotivos[id];\n  render();\n}\nfunction mudarFiltroFunil(v) {\n  filtroFunil = v;\n  render();\n}\n\nfunction renderNegociacao() {\n  var ativosNoFunil = motivos.filter(function (m) { return m.status === \"ativo\" && funilMotivos[m.id]; });\n  var semMotivo = ativosNoFunil.length === 0;\n\n  var corpoHtml;\n  if (semMotivo) {\n    corpoHtml = '\u003cdiv class=\"warn-box\">\u003cp>Este funil não tem nenhum motivo de perda ativo. Peça a um administrador para ativar ao menos 1 motivo em \u003cspan class=\"link\" onclick=\"irParaFunil()\" style=\"color:var(--coral-text);text-decoration:underline;\">Preferências do funil\u003c/span> antes de marcar negociações como perdidas.\u003c/p>\u003c/div>';\n  } else {\n    var opcoes = ativosNoFunil.map(function (m) {\n      return '\u003coption value=\"' + m.id + '\">' + m.nome + '\u003c/option>';\n    }).join(\"\");\n    corpoHtml = '\u003cdiv id=\"area-motivo\" style=\"display:none;\">' +\n      '\u003clabel style=\"font-size:12px;font-weight:600;display:block;margin-bottom:4px;\">Motivo da perda *\u003c/label>' +\n      '\u003cselect id=\"select-motivo\" style=\"width:100%;box-sizing:border-box;margin-bottom:4px;\">\u003coption value=\"\">Selecione um motivo\u003c/option>' + opcoes + '\u003c/select>' +\n      '\u003cp class=\"error-text\" id=\"erro-motivo\" style=\"display:none;\">\u003c/p>' +\n      '\u003cdiv style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:10px;\">' +\n      '\u003cbutton class=\"btn btn-outline\" onclick=\"fecharSelecaoMotivo()\">Cancelar\u003c/button>' +\n      '\u003cbutton class=\"btn btn-dark\" onclick=\"confirmarPerda()\">Confirmar perda\u003c/button>' +\n      '\u003c/div>\u003c/div>';\n  }\n\n  document.getElementById('content').innerHTML =\n    '\u003cp class=\"breadcrumb\">\u003cspan class=\"back\" onclick=\"irParaListagem()\">&larr; Voltar aos motivos\u003c/span>\u003c/p>' +\n    '\u003cdiv style=\"max-width:440px;background:#fff;border:0.5px solid var(--border-light);border-radius:12px;padding:1.5rem;box-shadow:0 2px 10px rgba(11,25,41,0.06);\">' +\n    '\u003cp style=\"font-size:11px;color:#94A3B8;margin:0 0 4px;\">Negociação\u003c/p>' +\n    '\u003ch3 style=\"margin:0 0 14px;font-size:15px;\">Proposta, Instituto ABC\u003c/h3>' +\n    '\u003cdiv style=\"display:flex;gap:8px;margin-bottom:14px;\">' +\n    '\u003cbutton class=\"btn\" style=\"flex:1;background:#1D9E75;color:#fff;\">Ganha\u003c/button>' +\n    '\u003cbutton class=\"btn\" style=\"flex:1;\" ' + (semMotivo ? 'disabled' : '') + ' onclick=\"' + (semMotivo ? '' : 'abrirSelecaoMotivo()') + '\" title=\"' + (semMotivo ? 'Ative ao menos 1 motivo de perda neste funil' : '') + '\">Perdida\u003c/button>' +\n    '\u003c/div>' + corpoHtml + '\u003c/div>';\n}\n\nfunction abrirSelecaoMotivo() {\n  document.getElementById('area-motivo').style.display = 'block';\n}\nfunction fecharSelecaoMotivo() {\n  document.getElementById('area-motivo').style.display = 'none';\n}\nfunction confirmarPerda() {\n  var val = document.getElementById('select-motivo').value;\n  var err = document.getElementById('erro-motivo');\n  if (!val) {\n    err.textContent = \"Não foi possível confirmar a perda. Selecione um motivo antes de continuar.\";\n    err.style.display = \"block\";\n    return;\n  }\n  toast(\"Negociação marcada como perdida\");\n  fecharSelecaoMotivo();\n}\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"campos":{"icon":"📋","title":"Campos Personalizados","description":"Campos de Negociação, Empresa, Contato e Produto.","stat":"4 entidades disponíveis","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>Protótipo, Campos Personalizados\u003c/title>\n\u003cstyle>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; background: #F7F9FB; color: #16232F; }\n  .topbar { background: #0A1F35; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }\n  .topbar-left { color: #fff; font-size: 14px; font-weight: 600; }\n  .profile-toggle { display: flex; align-items: center; gap: 8px; background: #16324F; border-radius: 8px; padding: 6px 10px; }\n  .profile-toggle span { color: #94A3B8; font-size: 11px; }\n  .profile-toggle button { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: #94A3B8; }\n  .profile-toggle button.active { background: #00D9C0; color: #04342C; font-weight: 600; }\n  .page { padding: 20px; max-width: 980px; margin: 0 auto; }\n  .breadcrumb { font-size: 11px; color: #94A3B8; margin-bottom: 6px; }\n  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }\n  .page-title { font-size: 20px; font-weight: 600; color: #16232F; }\n  .btn-primary { background: #0A1F35; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: none; cursor: pointer; }\n  .btn-secondary { border: 1px solid #E2E8F0; background: #fff; font-size: 13px; padding: 9px 16px; bord width: 34px; height: 18px; border-radius: 9px; position: relative; flex-shrink: 0; cursor: pointer; background: #E2E8F0; transition: background 0.15s; }\n  .toggle-switch.on { background: #00D9C0; }\n  .toggle-knob { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: left 0.15s; }\n  .toggle-switch.on .toggle-knob { left: 18px; }\n  .drawer-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }\n  .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }\n  .opt-row input { flex: 1; border: 1px solid #E2E8F0; border-radius: 6px; padding: 6px 10px; font-size: 12px; }\n  .opt-remove { color: #E45858; cursor: pointer; font-size: 14px; }\n  .opt-add { border: 1px dashed #CBD5E1; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #94A3B8; cursor: pointer; text-align: center; }\n  .stage-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }\n  .stage-tag { border: 1px solid #E2E8F0; color: #94A3B8; font-size: 11px; padding: 4px 10px; border-radius: 12px; cursor: pointer; }\n  .stage-tag.on { background: #F0FBFA; border-color: #00D9C0; color: #00A896; }\n  .menu-actions { position: relative; }\n  .menu-dropdown { display: none; position: absolute; right: 0; top: 24px; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); width: 190px; z-index: 10; text-align: left; }\n  .menu-dropdown.open { display: block; }\n  .menu-item { padding: 10px 14px; font-size: 13px; color: #16232F; border-bottom: 0.5px solid #F0F3F6; cursor: pointer; }\n  .menu-item:last-child { border-bottom: none; }\n  .menu-item.danger { color: #E45858; }\n  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,31,53,0.45); align-items: center; justify-content: center; z-index: 50; }\n  .modal-overlay.open { display: flex; }\n  .modal-box { background: #ff
