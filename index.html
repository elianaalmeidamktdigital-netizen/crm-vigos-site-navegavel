<!doctype html>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300d4c5'/%3E%3Cpath d='M16 18h8l8 28 8-28h8L36 52h-8z' fill='%23091627'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#06283b;--navy-2:#0a3a50;--cyan:#13c7e8;--ink:#102d3d;--muted:#607486;--line:#e3e9ee;--bg:#f5f7f9;--white:#fff}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}
    .app{height:100%;display:grid;grid-template-columns:72px 1fr}.rail{background:var(--navy);padding:16px 10px;display:flex;align-items:center;flex-direction:column;gap:7px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;margin-bottom:16px}.brand-mark svg{width:38px;height:38px}.nav-button{border:0;width:48px;height:48px;background:transparent;color:#7aa0b3;border-radius:8px;display:grid;place-items:center;position:relative}.nav-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-button:hover{background:#0c3a50;color:#fff}.nav-button.active{background:#0d465e;color:var(--cyan)}.nav-button.active:before{content:"";position:absolute;left:-10px;width:3px;height:26px;background:var(--cyan);border-radius:0 3px 3px 0}.home{margin-top:auto}
    .surface{min-width:0;background:var(--white);overflow:hidden;display:grid;grid-template-rows:64px 1fr}.topbar{background:var(--navy);color:#fff;border-left:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px}.product{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500}.product span{color:var(--cyan)}.breadcrumb{font-size:14px;color:#b7cad4}.controls{justify-self:end;display:flex;align-items:center;gap:10px}.account{font-size:14px;font-weight:600;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}.control{border:1px solid rgba(255,255,255,.2);color:#fff;background:transparent;border-radius:7px;padding:8px 12px;font-weight:600}.control:hover{border-color:var(--cyan);color:var(--cyan)}
    .content{position:relative;overflow:auto;background:#fff}.home-view{max-width:1180px;margin:0 auto;padding:44px 48px 64px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px}.page-head h1{font-size:30px;line-height:1.2;margin:0 0 7px;letter-spacing:-.02em}.page-head p{margin:0;color:var(--muted);font-size:15px}.demo-badge{font-size:12px;font-weight:700;letter-spacing:.04em;color:#08728a;background:#e8f9fc;border:1px solid #bceef6;border-radius:999px;padding:6px 10px;white-space:nowrap}
    .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 58px}.settings-group{min-width:0}.group-label{font-size:12px;font-weight:800;letter-spacing:.08em;color:#728594;margin:0 0 10px}.settings-link{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:15px 4px;text-align:left;display:grid;grid-template-columns:38px 1fr 18px;gap:12px;align-items:center;color:var(--ink)}.settings-link:last-child{border-bottom:1px solid var(--line)}.settings-link:hover{background:#f7fbfc}.link-icon{width:34px;height:34px;border-radius:8px;background:#edf8fa;color:#087e98;display:grid;place-items:center}.link-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.settings-link strong{display:block;font-size:15px;font-weight:650}.settings-link small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.settings-link i{font-style:normal;color:#8ba0ad;font-size:22px}.settings-link:hover i{color:var(--cyan);transform:translateX(2px)}
    .prototype{width:100%;height:100%;border:0;background:white;display:none}.prototype.visible{display:block}.home-view.hidden{display:none}
    @media(max-width:860px){.settings-grid{grid-template-columns:1fr}.home-view{padding:30px 24px}.breadcrumb,.account{display:none}}@media(max-width:650px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:5;flex-direction:row;padding:7px 10px;overflow:auto}.brand-mark{flex:0 0 42px;margin:0 8px 0 0}.nav-button{flex:0 0 44px}.nav-button.active:before{display:none}.home{margin:0}.surface{min-height:calc(100vh - 62px);grid-template-rows:58px 1fr}.topbar{grid-template-columns:1fr auto;padding:0 14px}.content{min-height:880px}.page-head{gap:16px}.demo-badge{display:none}}
  </style>

      <button class="nav-button home active" data-module="home" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></button>
    </nav>

  <script>
    const MODULES={"acesso":{"icon":"👥","title":"Gestão de Acesso","description":"Usuários, equipes e permissões personalizadas.","stat":"5 usuários em 3 equipes","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Protótipo; CRM Vigos (Gestão de Acesso)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root {\n    --navy-deep: #0B1929;\n    --teal: #00D9C0;\n    --teal-dim: #0a5f56;\n    --bg-page: #F7F9FB;\n    --text-dark: #16232F;\n    --text-muted: #64748B;\n    --border-light: #E2E8F0;\n    --amber: #F5A623;\n    --amber-bg: #FEF3E2;\n    --red: #E45858;\n    --red-bg: #FCEAEA;\n    --green: #1FAA6E;\n    --green-bg: #E7F7EF;\n    --blue-bg: #E6F1FB;\n    --blue-text: #0C447C;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body {\n    font-family: 'Inter', -apple-system, sans-serif;\n    background: var(--bg-page);\n    color: var(--text-dark);\n    min-height: 100vh;\n  }\n\n  /* Banner de contexto do protótipo */\n  .proto-banner {\n    background: var(--navy-deep);\n    color: #fff;\n    padding: 10px 24px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 10px;\n    text-align: center;\n  }\n  .proto-banner strong { color: var(--teal); }\n\n  /* App shell simulando o CRM real */\n  .app-shell {\n    max-width: 1400px;\n    margin: 24px auto;\n    background: #fff;\n    border-radius: 12px;\n    box-shadow: 0 4px 24px rgba(11,25,41,0.08);\n    overflow: hidden;\n    min-height: 720px;\n    display: flex;\n  }\n\n  .app-sidebar {\n    width: 64px;\n    background: var(--navy-deep);\n    flex-shrink: 0;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: 20px 0;\n    gap: 24px;\n  }\n  .app-sidebar .logo {\n    width: 32px; height: 32px;\n    border-radius: 8px;\n    background: var(--teal);\n    margin-bottom: 12px;\n  }\n  .app-sidebar .icon {\n    width: 22px; height: 22px;\n    color: rgba(255,255,255,0.5);\n  }\n\n  .app-main {\n    flex: 1;\n    min-width: 0;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .app-topbar {\n    height: 56px;\n    border-bottom: 1px solid var(--border-light);\n    display: flex;\n    align-items: center;\n    padding: 0 24px;\n    gap: 12px;\n    flex-shrink: 0;\n  }\n  .app-topbar .crm-label {\n    font-weight: 700;\n    color: var(--teal-dim);\n    font-size: 15px;\n  }\n  .app-topbar .crumb {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px;\n    color: var(--text-muted);\n    margin-left: auto;\n  }\n\n  .app-content {\n    flex: 1;\n    padding: 24px 32px;\n    overflow-y: auto;\n    position: relative;\n  }\n\n  /* Reused component styles matching the wireframe visual language */\n  h3 { font-size: 15px; margin: 0; }\n  input, select { font-family: inherit; }\n  button { font-family: inherit; cursor: pointer; }\n\n  /* Modal overlay */\n  .modal-overlay {\n    position: fixed;\n    inset: 0;\n    background: rgba(11,25,41,0.45);\n    display: none;\n    align-items: center;\n    justify-content: center;\n    z-index: 100;\n    animation: fadeIn 0.15s ease;\n  }\n  .modal-overlay.open { display: flex; }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n\n  .modal-box {\n    background: #fff;\n    border-radius: 12px;\n    box-shadow: 0 12px 40px rgba(11,25,41,0.2);\n    width: 420px;\n    max-width: 90vw;\n    padding: 1.5rem;\n    max-height: 85vh;\n    overflow-y: auto;\n    animation: slideUp 0.2s ease;\n  }\n  @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n\n  /* Toast */\n  .toast {\n    position: fixed;\n    top: 20px;\n    right: 20px;\n    background: #fff;\n    border-radius: 8px;\n    box-shadow: 0 8px 24px rgba(11,25,41,0.15);\n    padding: 12px 18px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    font-size: 13px;\n    font-weight: 600;\n    z-index: 200;\n    transform: translateX(120%);\n    transition: transform 0.25s ease;\n  }\n  .toast.show { transform: translateX(0); }\n  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }\n\n  /* Side panel drawer (Editar usuário/equipe) */\n  .drawer-overlay {\n    position: fixed;\n    inset: 0;\n    background: rgba(11,25,41,0.35);\n    display: none;\n    z-index: 90;\n  }\n  .drawer-overlay.open { display: block; }\n  .drawer {\n    position: fixed;\n    top: 0; right: 0; bottom: 0;\n    width: 420px;\n    max-width: 92vw;\n    background: #fff;\n    box-shadow: -8px 0 30px rgba(11,25,41,0.15);\n    padding: 1.5rem;\n    overflow-y: auto;\n    transform: translateX(100%);\n    transition: transform 0.25s ease;\n    z-index: 95;\n  }\n  .drawer.open { transform: translateX(0); }\n\n  /* Context menu */\n  .ctx-menu {\n    position: absolute;\n    background: #fff;\n    border: 1px solid var(--border-light);\n    border-radius: 8px;\n    box-shadow: 0 8px 24px rgba(11,25,41,0.12);\n    padding: 6px;\n    width: 210px;\n    z-index: 80;\n    display: none;\n  }\n  .ctx-menu.open { display: block; }\n  .ctx-item {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    padding: 9px 12px;\n    border-radius: 6px;\n    font-size: 13px;\n    cursor: pointer;\n  }\n  .ctx-item:hover { background: var(--bg-page); }\n  .ctx-item.danger { color: var(--red); }\n  .ctx-sep { border-top: 1px solid var(--border-light); margin: 4px 0; }\n  .ctx-sub { font-size: 10.5px; color: var(--text-muted); display: block; }\n\n  /* Tabs (Usuários / Equipes / Permissões) */\n  .tabs-row {\n    display: flex;\n    gap: 20px;\n    border-bottom: 1px solid var(--border-light);\n    margin-bottom: 20px;\n  }\n  .tab-item {\n    padding-bottom: 10px;\n    font-size: 14px;\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    border-bottom: 2px solid transparent;\n    margin-bottom: -1px;\n  }\n  .tab-item.active {\n    color: var(--teal-dim);\n    border-bottom-color: var(--teal);\n    font-weight: 600;\n  }\n\n  /* Summary cards */\n  .cards-row {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 12px;\n    margin-bottom: 20px;\n  }\n  .summary-card {\n    background: var(--bg-page);\n    border-radius: 8px;\n    padding: 14px 16px;\n  }\n  .summary-card.danger { background: var(--red-bg); }\n  .summary-card .label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }\n  .summary-card.danger .label { color: #A32D2D; }\n  .summary-card .value { font-size: 22px; font-weight: 600; }\n  .summary-card.danger .value { color: #A32D2D; }\n  .summary-card .value small { font-size: 12px; color: #94A3B8; font-weight: 400; }\n\n  table { width: 100%; border-collapse: collapse; font-size: 13px; }\n  th { text-align: left; padding: 8px 6px; font-weight: 500; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; border-bottom: 1px solid var(--border-light); }\n  td { padding: 10px 6px; border-bottom: 1px solid #F0F3F6; }\n  tr:last-child td { border-bottom: none; }\n  tr.row-clickable:hover { background: #FAFBFC; }\n\n  .avatar {\n    width: 30px; height: 30px; border-radius: 50%;\n    background: var(--blue-bg); color: var(--blue-text);\n    display: flex; align-items: center; justify-content: center;\n    font-size: 11px; font-weight: 600;\n  }\n  .status-pill { font-size: 11.5px; padding: 2px 10px; border-radius: 20px; }\n  .status-pill.active { background: var(--green-bg); color: #147A4E; }\n  .status-pill.inactive { background: #EEF1F4; color: #5B6B7C; }\n  .disabled-row { opacity: 0.45; }\n  .disabled-tag { font-size: 9.5px; background: #EEF1F4; color: #5B6B7C; padding: 1px 6px; border-radius: 8px; }\n\n  .btn {\n    font-size: 12.5px;\n    padding: 7px 14px;\n    border-radius: 6px;\n    border: 1px solid var(--border-light);\n    background: #fff;\n    font-weight: 500;\n  }\n  .btn.primary { background: var(--navy-deep); color: #fff; border: none; }\n  .btn.danger-fill { background: var(--red); color: #fff; border: none; }\n  .btn.disabled { opacity: 0.5; cursor: not-allowed; }\n  .btn-icon { background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; }\n  .btn-icon:hover { background: var(--bg-page); }\n\n  .field-label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; }\n  .field-input {\n    width: 100%; font-size: 13px; padding: 9px 11px;\n    border: 1px solid #CBD5E1; border-radius: 6px; margin-bottom: 12px;\n  }\n  .field-note { font-size: 11px; color: var(--text-muted); margin: -6px 0 12px; }\n\n  .info-box {\n    background: var(--blue-bg); color: var(--blue-text);\n    border-radius: 6px; padding: 9px 13px;\n    font-size: 12px; margin-bottom: 14px;\n  }\n  .warn-box {\n    background: var(--amber-bg); color: #9A6314;\n    border-radius: 6px; padding: 9px 13px;\n    font-size: 12px; margin-bottom: 14px; display: flex; gap: 8px;\n  }\n  .danger-box {\n    background: var(--red-bg); color: #791F1F;\n    border-radius: 6px; padding: 9px 13px;\n    font-size: 12px; margin-bottom: 14px;\n  }\n  .success-box {\n    background: var(--green-bg); color: #147A4E;\n    border-radius: 6px; padding: 9px 13px;\n    font-size: 11.5px; margin-bottom: 14px;\n  }\n\n  .visibility-legend {\n    background: var(--bg-page); border-radius: 6px; padding: 10px 13px;\n    font-size: 11px; color: #47576A; line-height: 1.6; margin-bottom: 14px;\n  }\n  .visibility-legend strong { color: var(--text-dark); }\n\n  .modal-footer, .drawer-footer {\n    display: flex; justify-content: flex-end; gap: 8px;\n    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-light);\n  }\n\n  .subsection-title {\n    font-size: 11px; color: var(--text-muted); text-transform: uppercase;\n    letter-spacing: 0.04em; font-weight: 600; margin: 16px 0 10px;\n    padding-bottom: 6px; border-bottom: 1px solid var(--border-light);\n  }\n\n  /* Perfil detail layout */\n  .profile-detail { display: flex; gap: 20px; }\n  .profile-sidebar { width: 170px; flex-shrink: 0; }\n  .profile-sidebar-item {\n    font-size: 12.5px; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: #47576A;\n    margin-bottom: 2px;\n  }\n  .profile-sidebar-item.active { background: var(--blue-bg); color: var(--blue-text); font-weight: 600; }\n  .profile-content { flex: 1; }\n  .perm-row {\n    display: flex; justify-content: space-between; align-items: flex-start;\n    padding: 11px 0; border-bottom: 1px solid #F0F3F6;\n  }\n  .perm-row:last-child { border-bottom: none; }\n  .perm-row .perm-name { font-size: 13px; font-weight: 600; }\n  .perm-row .perm-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; max-width: 420px; }\n  .dep-tag {\n    font-size: 9px; background: var(--amber-bg); color: #9A6314;\n    padding: 1px 7px; border-radius: 8px; margin-left: 6px;\n  }\n  input[type=\"checkbox\"] { width: 17px; height: 17px; accent-color: var(--teal-dim); flex-shrink: 0; }\n\n  .radio-group { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12.5px; }\n  .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; }\n\n  .list-item-row {\n    display: flex; justify-content: space-between; align-items: center;\n    padding: 9px 2px; border-bottom: 1px solid #F0F3F6;\n  }\n  .list-item-row:last-child { border-bottom: none; }\n\n  .empty-hint {\n    font-size: 11.5px; color: var(--text-muted); text-align: center;\n    padding: 24px; border: 1.5px dashed var(--border-light); border-radius: 8px;\n  }\n\n  @media (max-width: 900px) {\n    .app-shell { margin: 0; border-radius: 0; min-height: 100vh; flex-direction: column; }\n    .app-sidebar { width: 100%; flex-direction: row; padding: 10px; }\n    .cards-row { grid-template-columns: repeat(2, 1fr); }\n    .drawer, .modal-box { width: 100%; }\n  }\n\u003c/style>\n\u003cstyle>\n  .proto-banner{display:none!important}\n  .app-shell{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}\n  .app-sidebar,.sidebar{display:none!important}\n  body{background:#fff!important;color:#102d3d!important}\n  .app-topbar,.topbar{background:#fff!important;color:#102d3d!important;border-bottom:1px solid #e3e9ee!important}\n  .app-content{padding:28px 34px!important}\n  button,.btn{border-radius:6px!important}\n  .btn.primary,.btn-primary{background:#06283b!important;color:#fff!important}\n  .summary-card{border:1px solid #e3e9ee!important;background:#f8fafb!important}\n  table th{color:#607486!important;font-weight:600!important}\n  .entity-icon{font-family:Inter,sans-serif!important}\n\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"proto-banner\">🔧 \u003cstrong>PROTÓTIPO NAVEGÁVEL\u003c/strong>: Gestão de Acesso (Usuários · Equipes · Permissões); demonstra o fluxo principal de uso. Regras de borda, validações completas e critérios de aceite estão no site de documentação, não aqui.\u003c/div>\n\n\u003cdiv class=\"app-shell\">\n  \u003cdiv class=\"app-sidebar\">\n    \u003cdiv class=\"logo\">\u003c/div>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\"/>\u003c/svg>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/>\u003cline x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/>\u003cline x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/>\u003c/svg>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003c/svg>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cline x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/>\u003cline x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/>\u003cline x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/>\u003c/svg>\n  \u003c/div>\n\n  \u003cdiv class=\"app-main\">\n    \u003cdiv class=\"app-topbar\">\n      \u003cspan class=\"crm-label\">CRM Vigos\u003c/span>\n      \u003cspan class=\"crumb\" id=\"breadcrumb\">Configurações / Usuários, equipes e permissões\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"app-content\" id=\"app-content\">\n      \u003c!-- rendered by JS -->\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Toast -->\n\u003cdiv class=\"toast\" id=\"toast\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"toast-text\">Ação concluída\u003c/span>\u003c/div>\n\n\u003c!-- Context menu -->\n\u003cdiv class=\"ctx-menu\" id=\"ctx-menu\">\u003c/div>\n\n\u003c!-- Modal overlay (Conceder acesso, Reativar, Criar equipe, Criar perfil, Reatribuição) -->\n\u003cdiv class=\"modal-overlay\" id=\"modal-overlay\">\n  \u003cdiv class=\"modal-box\" id=\"modal-box\">\u003c/div>\n\u003c/div>\n\n\u003c!-- Drawer overlay + drawer (Editar usuário, Editar equipe) -->\n\u003cdiv class=\"drawer-overlay\" id=\"drawer-overlay\">\u003c/div>\n\u003cdiv class=\"drawer\" id=\"drawer\">\u003c/div>\n\n\u003cscript>\n/* ============ DADOS SIMULADOS ============ */\nconst STATE = {\n  activeTab: 'usuarios',\n  licencasAtivas: 7,\n  licencasTotal: 7,\n  usuarios: [\n    { id: 1, nome: 'Eliana Almeida', email: 'eliana@mail.com', perfil: 'Administrador', visibilidade: 'Equipe', status: 'Ativo', equipes: ['Closers'] },\n    { id: 2, nome: 'Juliana Custódio', email: 'juliana@mail.com', perfil: 'Usuário', visibilidade: 'Equipe', status: 'Ativo', equipes: ['Gestores'], gestora: true },\n    { id: 3, nome: 'Éric Moreira', email: 'eric@mail.com', perfil: 'Administrador', visibilidade: 'Geral', status: 'Ativo', equipes: ['Closers'] },\n    { id: 4, nome: 'Antonio Fernandes', email: 'antonio@mail.com', perfil: 'Vendedor', visibilidade: 'Equipe', status: 'Ativo', equipes: ['Closers'] },\n    { id: 5, nome: 'Najara Fernandes', email: 'najara@mail.com', perfil: 'Usuário', visibilidade: 'Equipe', status: 'Inativo', equipes: ['Sucesso do Cliente'] },\n  ],\n  equipes: [\n    { id: 1, nome: 'Closers', usuarios: [1,3,4], gestor: null },\n    { id: 2, nome: 'Gestores', usuarios: [2], gestor: 'Juliana Custódio' },\n    { id: 3, nome: 'Sucesso do Cliente', usuarios: [], gestor: null },\n  ],\n  perfis: [\n    { id: 1, nome: 'Administrador', tipo: 'Permissões gerais', fixo: true, desc: 'Acesso geral ao CRM. Esse perfil não pode ser alterado.' },\n    { id: 2, nome: 'Usuário', tipo: 'Permissões básicas', fixo: true, desc: 'Acesso a negociações, análises, empresas, contatos. Esse perfil não pode ser alterado.' },\n    { id: 3, nome: 'Vendedor', tipo: 'Perfil personalizado', fixo: false, desc: 'Perfil personalizado' },\n  ],\n  vigosUsuarios: [\n    { nome: 'Marcos Vinícius', email: 'marcos@mail.com', jaTemAcesso: false },\n    { nome: 'Fernanda Costa', email: 'fernanda@mail.com', jaTemAcesso: false },\n    { nome: 'Eliana Almeida', email: 'eliana@mail.com', jaTemAcesso: true },\n  ],\n};\n\nconst perms = {\n  'Análises': [\n    { nome: 'Exportar relatórios', desc: null },\n    { nome: 'CRM Live', desc: 'Exibe, em tempo real, indicadores relacionados às negociações finalizadas e em andamento em cada funil.' },\n    { nome: 'Performance em vendas', desc: 'Exibe informações sobre o processo de vendas, taxa de conversão e motivos de perda.' },\n    { nome: 'Atividades de vendas', desc: 'Exibe informações sobre atividades de negociações em andamento ou fechadas.' },\n  ],\n  'Configurações avançadas': [\n    { nome: 'Importar dados', desc: 'Importar dados de negociações, empresas, contatos, produtos e serviços.' },\n    { nome: 'Produtos e serviços', desc: 'Permissão para visualizar, criar, editar ou excluir produtos e serviços.' },\n    { nome: 'Campos de cadastro', desc: 'Permissão para visualizar, criar, editar ou excluir campos de cadastro.' },\n    { nome: 'Modelos de proposta', desc: 'Permissão para visualizar, criar, editar ou excluir modelos de propostas.' },\n    { nome: 'Motivos de perda', desc: 'Permissão para visualizar, criar, editar ou excluir motivos de perda.' },\n    { nome: 'Integrações', desc: 'Permissão para visualizar, criar, editar ou excluir integrações.' },\n    { nome: 'Gerenciamento de ações em massa', desc: 'Permissão para gerenciar ações em massa.' },\n  ],\n  'Negociações e tarefas': [\n    { nome: 'Alterar responsável na Negociação', desc: 'Só tem efeito se Preferências estiver com \"Apenas Administradores e perfis com permissão\".', dep: true },\n    { nome: 'Excluir negociações', desc: 'Permissão para excluir negociações permanentemente e aprovar exclusões na lixeira.' },\n    { nome: 'Exportar negociações', desc: 'Permissão para exportar negociações e visualizar apenas as próprias exportações.' },\n    { nome: 'Exportar tarefas', desc: 'Permissão para exportar tarefas e visualizar apenas as próprias exportações.' },\n  ],\n  'Contatos': [\n    { nome: 'Excluir contatos', desc: 'Permissão para excluir contatos permanentemente e aprovar exclusões na lixeira.' },\n    { nome: 'Exportar contatos', desc: 'Permissão para exportar contatos e visualizar apenas as próprias exportações.' },\n  ],\n  'Empresas': [\n    { nome: 'Alterar responsável de Empresa', desc: 'Só tem efeito se Preferências estiver com \"Apenas Administradores e perfis com permissão\".', dep: true },\n    { nome: 'Excluir empresas', desc: 'Permissão para excluir empresas permanentemente e aprovar exclusões na lixeira.' },\n    { nome: 'Exportar empresas', desc: 'Permissão para exportar empresas e visualizar apenas as próprias exportações.' },\n  ],\n  'Dados da conta': [\n    { nome: 'Conta e planos', desc: 'Acesso completo à gestão da conta e do plano contratado, incluindo faturas e boletos.' },\n  ],\n};\n\nlet activePermCategory = 'Análises';\nlet ctxTargetUser = null;\n\n/* ============ HELPERS ============ */\nfunction showToast(text) {\n  document.getElementById('toast-text').textContent = text;\n  const t = document.getElementById('toast');\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 2600);\n}\nfunction initials(name) {\n  return name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();\n}\nfunction closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }\nfunction closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }\nfunction closeCtx() { document.getElementById('ctx-menu').classList.remove('open'); }\nfunction openModal(html) {\n  document.getElementById('modal-box').innerHTML = html;\n  document.getElementById('modal-overlay').classList.add('open');\n}\nfunction openDrawer(html) {\n  document.getElementById('drawer').innerHTML = html;\n  document.getElementById('drawer-overlay').classList.add('open');\n  document.getElementById('drawer').classList.add('open');\n}\n\ndocument.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });\ndocument.getElementById('drawer-overlay').addEventListener('click', closeDrawer);\ndocument.addEventListener('click', (e) => {\n  if (!e.target.closest('.ctx-menu') && !e.target.closest('.btn-icon')) closeCtx();\n});\n\nfunction setTab(tab) {\n  STATE.activeTab = tab;\n  render();\n}\n\n/* ============ RENDER PRINCIPAL ============ */\nfunction render() {\n  document.getElementById('breadcrumb').textContent = 'Configurações / Usuários, equipes e permissões';\n  const c = document.getElementById('app-content');\n\n  const licDisponiveis = STATE.licencasTotal - STATE.usuarios.filter(u => u.status === 'Ativo').length;\n\n  let html = `\n    \u003cdiv style=\"background:#FEF3E2; border:1px solid #F5A623; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:11.5px; color:#9A6314;\">\n      ⚠️ \u003cstrong>Sobre este protótipo:\u003c/strong> demonstra o fluxo principal de navegação. Simplificações conhecidas: (1) \"Antonio Fernandes\" foi fixado como o único usuário com registros em aberto, para fins de demonstração; o sistema real calcularia isso dinamicamente; (2) nem toda regra de borda documentada está simulada aqui (ex: usuário sem equipe vendo zero registros); (3) validações de erro cobrem só os casos principais. Para a especificação completa, use o site de documentação.\n    \u003c/div>\n    \u003cdiv class=\"cards-row\">\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"label\">Licenças ativas\u003c/div>\u003cdiv class=\"value\">${STATE.usuarios.filter(u=>u.status==='Ativo').length} \u003csmall>de ${STATE.licencasTotal}\u003c/small>\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card ${licDisponiveis === 0 ? 'danger' : ''}\">\u003cdiv class=\"label\">Licenças disponíveis\u003c/div>\u003cdiv class=\"value\">${licDisponiveis}\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"label\">Equipes\u003c/div>\u003cdiv class=\"value\">${STATE.equipes.length}\u003c/div>\u003c/div>\n      \u003cdiv class=\"summary-card\">\u003cdiv class=\"label\">Perfis de usuário\u003c/div>\u003cdiv class=\"value\">${STATE.perfis.length} \u003csmall>de ${STATE.perfis.length}\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"tabs-row\">\n      \u003cdiv class=\"tab-item ${STATE.activeTab==='usuarios'?'active':''}\" onclick=\"setTab('usuarios')\">Usuários\u003c/div>\n      \u003cdiv class=\"tab-item ${STATE.activeTab==='equipes'?'active':''}\" onclick=\"setTab('equipes')\">Equipes\u003c/div>\n      \u003cdiv class=\"tab-item ${STATE.activeTab==='permissoes'?'active':''}\" onclick=\"setTab('permissoes')\">Permissões personalizadas\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"tab-content\">\u003c/div>\n  `;\n  c.innerHTML = html;\n\n  if (STATE.activeTab === 'usuarios') renderUsuarios();\n  if (STATE.activeTab === 'equipes') renderEquipes();\n  if (STATE.activeTab === 'permissoes') renderPermissoes();\n}\n\n/* ============ ABA USUÁRIOS ============ */\nfunction renderUsuarios() {\n  const licDisponiveis = STATE.licencasTotal - STATE.usuarios.filter(u => u.status === 'Ativo').length;\n  const disabled = licDisponiveis \u003c= 0;\n  let rows = STATE.usuarios.map(u => `\n    \u003ctr class=\"row-clickable\">\n      \u003ctd style=\"width:36px;\">\u003cdiv class=\"avatar\">${initials(u.nome)}\u003c/div>\u003c/td>\n      \u003ctd>\u003cstrong>${u.nome}\u003c/strong>\u003cbr>\u003cspan style=\"color:#94A3B8;font-size:11.5px;\">${u.email}\u003c/span>\u003c/td>\n      \u003ctd>${u.perfil}\u003c/td>\n      \u003ctd style=\"color:#64748B;\">${u.visibilidade}\u003c/td>\n      \u003ctd>\u003cspan class=\"status-pill ${u.status==='Ativo'?'active':'inactive'}\">${u.status}\u003c/span>\u003c/td>\n      \u003ctd style=\"width:30px; position:relative;\">\u003cbutton class=\"btn-icon\" onclick=\"event.stopPropagation(); openUserCtx(event, ${u.id})\">⋮\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('');\n\n  document.getElementById('tab-content').innerHTML = `\n    \u003cdiv style=\"display:flex; gap:10px; margin-bottom:14px;\">\n      \u003cinput class=\"field-input\" style=\"margin:0; flex:1;\" placeholder=\"Buscar por nome ou e-mail\">\n      \u003cselect class=\"field-input\" style=\"margin:0; width:150px;\">\u003coption>Todos os perfis\u003c/option>\u003c/select>\n      \u003cselect class=\"field-input\" style=\"margin:0; width:150px;\">\u003coption>Todos os status\u003c/option>\u003c/select>\n      \u003cbutton class=\"btn ${disabled?'disabled':''}\" onclick=\"${disabled?'':'openConcederAcesso()'}\" title=\"${disabled?'Sem licença disponível na Vigos Cloud':''}\">+ Conceder acesso\u003c/button>\n    \u003c/div>\n    \u003ctable>\n      \u003ctr>\u003cth style=\"width:36px;\">\u003c/th>\u003cth>Nome e e-mail\u003c/th>\u003cth>Perfil\u003c/th>\u003cth>Visibilidade\u003c/th>\u003cth>Status\u003c/th>\u003cth>\u003c/th>\u003c/tr>\n      ${rows}\n    \u003c/table>\n  `;\n}\n\nfunction openUserCtx(evt, userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  ctxTargetUser = userId;\n  const menu = document.getElementById('ctx-menu');\n  const isInactive = u.status === 'Inativo';\n  menu.innerHTML = `\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); openEditarUsuario(${userId})\">✏️ Editar usuário\u003c/div>\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); showToast('ID copiado: usr_${String(userId).padStart(4,'0')}')\">📋 Copiar ID\u003c/div>\n    \u003cdiv class=\"ctx-sep\">\u003c/div>\n    ${isInactive\n      ? `\u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); openReativar(${userId})\">✅ Ativar usuário\u003c/div>`\n      : `\u003cdiv class=\"ctx-item danger\" onclick=\"closeCtx(); handleDesativarClick(${userId})\">🚫 Desativar usuário\u003cspan class=\"ctx-sub\">Aciona reatribuição\u003c/span>\u003c/div>`\n    }\n  `;\n  const rect = evt.target.getBoundingClientRect();\n  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';\n  menu.style.left = (rect.left + window.scrollX - 170) + 'px';\n  menu.classList.add('open');\n}\n\nfunction openConcederAcesso() {\n  const disponiveis = STATE.vigosUsuarios.map(v => `\n    \u003cdiv class=\"list-item-row\" style=\"${v.jaTemAcesso ? 'opacity:0.45;cursor:not-allowed;' : 'cursor:pointer;'}\" ${v.jaTemAcesso ? '' : `onclick=\"selecionarVigosUser('${v.nome}','${v.email}')\"`}>\n      \u003cdiv>\u003cspan style=\"font-size:12.5px;\">${v.nome}\u003c/span>\u003cbr>\u003cspan style=\"font-size:10.5px;color:#94A3B8;\">${v.email}\u003c/span>\u003c/div>\n      ${v.jaTemAcesso ? '\u003cspan class=\"disabled-tag\">já tem acesso\u003c/span>' : ''}\n    \u003c/div>\n  `).join('');\n\n  openModal(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Conceder acesso\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cdiv class=\"info-box\">${STATE.licencasTotal - STATE.usuarios.filter(u=>u.status==='Ativo').length} de ${STATE.licencasTotal} licenças disponíveis (Vigos Cloud)\u003c/div>\n    \u003clabel class=\"field-label\">Buscar usuário da Vigos Cloud\u003c/label>\n    \u003cinput class=\"field-input\" placeholder=\"Digite o nome\" style=\"margin-bottom:6px;\">\n    \u003cdiv style=\"border:1px solid #E2E8F0; border-radius:6px; margin-bottom:8px; overflow:hidden;\">${disponiveis}\u003c/div>\n    \u003cp class=\"field-note\">A busca traz todos os usuários da conta Vigos Cloud. Quem já tem acesso ao CRM aparece desabilitado.\u003c/p>\n    \u003cp class=\"field-note\">Um e-mail de acesso ao CRM liberado será enviado automaticamente.\u003c/p>\n    \u003cdiv id=\"perfil-select-area\" style=\"opacity:0.4; pointer-events:none;\">\n      \u003clabel class=\"field-label\">Perfil inicial no CRM\u003c/label>\n      \u003cselect class=\"field-input\" id=\"novo-perfil-select\">\n        ${STATE.perfis.map(p => `\u003coption>${p.nome}\u003c/option>`).join('')}\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarConcessao()\">Conceder acesso\u003c/button>\n    \u003c/div>\n  `);\n}\n\nlet selectedVigosUser = null;\nfunction selecionarVigosUser(nome, email) {\n  selectedVigosUser = { nome, email };\n  document.querySelectorAll('.list-item-row').forEach(el => el.style.background = '');\n  event.currentTarget.style.background = '#E6F1FB';\n  document.getElementById('perfil-select-area').style.opacity = '1';\n  document.getElementById('perfil-select-area').style.pointerEvents = 'auto';\n}\n\nfunction confirmarConcessao() {\n  if (!selectedVigosUser) { showToast('Selecione um usuário da Vigos Cloud primeiro'); return; }\n  const perfil = document.getElementById('novo-perfil-select').value;\n  const newId = Math.max(...STATE.usuarios.map(u=>u.id)) + 1;\n  STATE.usuarios.push({ id: newId, nome: selectedVigosUser.nome, email: selectedVigosUser.email, perfil, visibilidade: 'Equipe', status: 'Ativo', equipes: [] });\n  selectedVigosUser = null;\n  closeModal();\n  showToast('Acesso concedido');\n  render();\n}\n\nfunction openEditarUsuario(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  openDrawer(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Editar usuário\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeDrawer()\">✕\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex; gap:10px; align-items:center; margin-bottom:16px;\">\n      \u003cdiv class=\"avatar\" style=\"width:40px;height:40px;font-size:13px;\">${initials(u.nome)}\u003c/div>\n      \u003cdiv>\u003cstrong style=\"font-size:13px;\">${u.nome}\u003c/strong>\u003cbr>\u003cspan style=\"font-size:11.5px;color:#94A3B8;\">${u.email}\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003clabel class=\"field-label\">Perfil\u003c/label>\n    \u003cselect class=\"field-input\" id=\"edit-perfil-select\">\n      ${STATE.perfis.map(p => `\u003coption ${p.nome===u.perfil?'selected':''}>${p.nome}\u003c/option>`).join('')}\n    \u003c/select>\n    \u003cdiv class=\"subsection-title\">Visibilidade deste usuário\u003c/div>\n    \u003cdiv class=\"visibility-legend\">\n      \u003cstrong>Restrita\u003c/strong>: só vê os próprios registros\u003cbr>\n      \u003cstrong>Equipe\u003c/strong>: vê os registros de todas as equipes a que pertence\u003cbr>\n      \u003cstrong>Geral\u003c/strong>: vê todos os registros da conta\n    \u003c/div>\n    ${['Negociações','Empresas','Contatos'].map(mod => `\n      \u003cp style=\"font-size:12px;font-weight:600;margin-bottom:6px;\">${mod}\u003c/p>\n      \u003cdiv class=\"radio-group\">\n        \u003clabel>\u003cinput type=\"radio\" name=\"vis-${mod}\" ${u.visibilidade==='Restrita'?'checked':''}> Restrita\u003c/label>\n        \u003clabel>\u003cinput type=\"radio\" name=\"vis-${mod}\" ${u.visibilidade==='Equipe'?'checked':''}> Equipe\u003c/label>\n        \u003clabel>\u003cinput type=\"radio\" name=\"vis-${mod}\" ${u.visibilidade==='Geral'?'checked':''}> Geral\u003c/label>\n      \u003c/div>\n    `).join('')}\n    \u003cdiv class=\"drawer-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeDrawer()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"salvarEdicaoUsuario(${userId})\">Salvar\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction salvarEdicaoUsuario(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  u.perfil = document.getElementById('edit-perfil-select').value;\n  closeDrawer();\n  showToast('Alterações salvas');\n  render();\n}\n\nfunction handleDesativarClick(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  const admins = STATE.usuarios.filter(x => x.perfil === 'Administrador' && x.status === 'Ativo');\n  if (u.perfil === 'Administrador' && admins.length \u003c= 1) {\n    openModal(`\n      \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Não é possível desativar\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n      \u003cdiv class=\"danger-box\">Este usuário é o único Administrador ativo da conta. Atribua o perfil de Administrador a outro usuário antes de continuar.\u003c/div>\n      \u003cdiv class=\"modal-footer\">\u003cbutton class=\"btn primary\" onclick=\"closeModal()\">Entendi\u003c/button>\u003c/div>\n    `);\n    return;\n  }\n  // simula ter registros em aberto para Antonio Fernandes (id 4), sem para os demais\n  const temRegistros = userId === 4;\n  if (!temRegistros) {\n    u.status = 'Inativo';\n    showToast('Usuário desativado');\n    render();\n    return;\n  }\n  openReatribuicao(userId);\n}\n\nfunction openReatribuicao(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  const equipeDoUsuario = STATE.equipes.find(e => u.equipes.includes(e.nome));\n  const temGestor = equipeDoUsuario && equipeDoUsuario.gestor;\n  const outrosUsuarios = STATE.usuarios.filter(x => x.id !== userId && x.status === 'Ativo');\n\n  openModal(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:4px;\">\u003ch3>Antes de desativar ${u.nome}\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cp style=\"font-size:12px;color:#64748B;margin:0 0 14px;\">Ele tem 3 itens em aberto. Escolha o que fazer com eles.\u003c/p>\n    \u003cdiv style=\"background:#F7F9FB;border-radius:8px;padding:12px;margin-bottom:10px;\">\n      \u003cp style=\"font-size:11px;font-weight:600;margin:0 0 8px;\">Escolha rápida (aplica a tudo)\u003c/p>\n      \u003cselect class=\"field-input\" style=\"margin:0;\" id=\"reatrib-destino\">\n        ${temGestor ? `\u003coption value=\"gestor\">Gestor da equipe (${equipeDoUsuario.gestor})\u003c/option>` : ''}\n        ${outrosUsuarios.map(o => `\u003coption value=\"user-${o.id}\">${o.nome}\u003c/option>`).join('')}\n        \u003coption value=\"nenhum\">Deixar tudo sem responsável por enquanto\u003c/option>\n      \u003c/select>\n      ${!temGestor ? '\u003cp class=\"field-note\" style=\"margin-top:6px;\">Esta equipe não tem gestor definido, por isso essa opção não aparece.\u003c/p>' : ''}\n    \u003c/div>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn danger-fill\" onclick=\"confirmarDesativacao(${userId})\">Desativar usuário\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction confirmarDesativacao(userId) {\n  const destino = document.getElementById('reatrib-destino').value;\n  const u = STATE.usuarios.find(x => x.id === userId);\n  u.status = 'Inativo';\n  closeModal();\n  if (destino === 'nenhum') {\n    showToast('Usuário desativado; 3 registros sem responsável');\n  } else {\n    showToast('Usuário desativado e registros reatribuídos');\n  }\n  render();\n}\n\nfunction openReativar(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  const licDisponiveis = STATE.licencasTotal - STATE.usuarios.filter(x => x.status === 'Ativo').length;\n\n  if (licDisponiveis \u003c= 0) {\n    openModal(`\n      \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Reativar acesso\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n      \u003cdiv style=\"display:flex; gap:10px; align-items:center; margin-bottom:14px;\">\n        \u003cdiv class=\"avatar\" style=\"background:#F1EFE8;color:#5F5E5A;\">${initials(u.nome)}\u003c/div>\n        \u003cdiv>\u003cstrong style=\"font-size:13px;\">${u.nome}\u003c/strong>\u003cbr>\u003cspan style=\"font-size:11px;color:#94A3B8;\">Inativo\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"danger-box\">⚠ 0 licenças disponíveis (Vigos Cloud). Libere uma licença desativando outro usuário, ou contrate mais licenças na Vigos Cloud.\u003c/div>\n      \u003cdiv class=\"modal-footer\">\u003cbutton class=\"btn\" onclick=\"closeModal()\">Fechar\u003c/button>\u003c/div>\n    `);\n    return;\n  }\n\n  openModal(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Reativar acesso\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex; gap:10px; align-items:center; margin-bottom:14px;\">\n      \u003cdiv class=\"avatar\" style=\"background:#F1EFE8;color:#5F5E5A;\">${initials(u.nome)}\u003c/div>\n      \u003cdiv>\u003cstrong style=\"font-size:13px;\">${u.nome}\u003c/strong>\u003cbr>\u003cspan style=\"font-size:11px;color:#94A3B8;\">Inativo\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"info-box\">✓ ${licDisponiveis} licença(s) disponível(is) (Vigos Cloud); pode reativar\u003c/div>\n    \u003cdiv class=\"visibility-legend\">Ao reativar, o Perfil (${u.perfil}) e a Visibilidade (${u.visibilidade}) voltam automaticamente.\u003c/div>\n    \u003cp class=\"field-note\">Registros reatribuídos não voltam sozinhos. Você poderá revisar e devolver depois, na tela do usuário.\u003c/p>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarReativacao(${userId})\">Reativar acesso\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction confirmarReativacao(userId) {\n  const u = STATE.usuarios.find(x => x.id === userId);\n  u.status = 'Ativo';\n  closeModal();\n  showToast('Acesso reativado');\n  render();\n}\n\n/* ============ ABA EQUIPES ============ */\nfunction renderEquipes() {\n  let rows = STATE.equipes.map(e => `\n    \u003ctr class=\"row-clickable\" onclick=\"openEditarEquipe(${e.id})\">\n      \u003ctd>\u003cstrong>${e.nome}\u003c/strong>\u003cbr>\u003cspan style=\"color:#94A3B8;font-size:11.5px;\">${e.usuarios.length} usuário${e.usuarios.length!==1?'s':''}\u003c/span>\u003c/td>\n      \u003ctd>${e.usuarios.length ? e.usuarios.map(uid => initials(STATE.usuarios.find(u=>u.id===uid)?.nome||'?')).join(' ') : '\u003cspan style=\"color:#CBD5E1;\">-\u003c/span>'}\u003c/td>\n      \u003ctd>${e.gestor || '\u003cspan style=\"color:#CBD5E1;\">Nenhum\u003c/span>'}\u003c/td>\n      \u003ctd style=\"width:30px;\">\u003cbutton class=\"btn-icon\" onclick=\"event.stopPropagation(); openEquipeCtx(event, ${e.id})\">⋮\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('');\n\n  document.getElementById('tab-content').innerHTML = `\n    \u003cdiv style=\"display:flex; gap:10px; margin-bottom:14px; justify-content:space-between;\">\n      \u003cinput class=\"field-input\" style=\"margin:0; width:280px;\" placeholder=\"Buscar\">\n      \u003cbutton class=\"btn primary\" onclick=\"openCriarEquipe()\">+ Criar nova equipe\u003c/button>\n    \u003c/div>\n    \u003ctable>\n      \u003ctr>\u003cth>Nome da equipe\u003c/th>\u003cth>Usuários\u003c/th>\u003cth>Gestor\u003c/th>\u003cth>\u003c/th>\u003c/tr>\n      ${rows}\n    \u003c/table>\n    \u003cdiv class=\"subsection-title\">Integração: Filtro de equipes em Negociações\u003c/div>\n    \u003cdiv style=\"border:1px solid #E2E8F0;border-radius:8px;padding:14px;width:260px;\">\n      \u003cp style=\"font-size:10.5px;color:#94A3B8;text-transform:uppercase;margin:0 0 8px;\">Visualizar negociações de\u003c/p>\n      \u003clabel style=\"font-size:12.5px;display:block;padding:4px 0;\">\u003cinput type=\"radio\" name=\"visfiltro\" style=\"width:auto;margin-right:6px;\">Todas as negociações\u003c/label>\n      \u003clabel style=\"font-size:12.5px;display:block;padding:4px 0;\">\u003cinput type=\"radio\" name=\"visfiltro\" checked style=\"width:auto;margin-right:6px;\">Minhas negociações\u003c/label>\n      \u003cdiv style=\"border-top:1px solid #F0F3F6;margin:8px 0 0;padding-top:8px;\">\n        ${STATE.equipes.map(e => `\u003clabel style=\"font-size:12.5px;display:block;padding:3px 0;\">\u003cinput type=\"checkbox\" style=\"width:auto;margin-right:6px;\">${e.nome}\u003c/label>`).join('')}\n      \u003c/div>\n    \u003c/div>\n  `;\n}\n\nfunction openEquipeCtx(evt, equipeId) {\n  const menu = document.getElementById('ctx-menu');\n  menu.innerHTML = `\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); openEditarEquipe(${equipeId})\">✏️ Editar equipe\u003c/div>\n    \u003cdiv class=\"ctx-sep\">\u003c/div>\n    \u003cdiv class=\"ctx-item danger\" onclick=\"closeCtx(); excluirEquipe(${equipeId})\">🗑️ Excluir equipe\u003c/div>\n  `;\n  const rect = evt.target.getBoundingClientRect();\n  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';\n  menu.style.left = (rect.left + window.scrollX - 170) + 'px';\n  menu.classList.add('open');\n}\n\nfunction excluirEquipe(equipeId) {\n  const e = STATE.equipes.find(x => x.id === equipeId);\n  STATE.usuarios.forEach(u => { u.equipes = u.equipes.filter(n => n !== e.nome); });\n  STATE.equipes = STATE.equipes.filter(x => x.id !== equipeId);\n  showToast('Equipe excluída; usuários e funis vinculados não foram afetados');\n  render();\n}\n\nfunction openCriarEquipe() {\n  openModal(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Criar equipe\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003clabel class=\"field-label\">Nome da equipe\u003c/label>\n    \u003cinput class=\"field-input\" id=\"nova-equipe-nome\" placeholder=\"Digite o nome da equipe\">\n    \u003cp class=\"field-note\">Gestor é opcional; pode ser definido depois, ao editar a equipe.\u003c/p>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarCriarEquipe()\">Próximo\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction confirmarCriarEquipe() {\n  const nome = document.getElementById('nova-equipe-nome').value || 'Nova equipe';\n  const newId = Math.max(...STATE.equipes.map(e=>e.id)) + 1;\n  STATE.equipes.push({ id: newId, nome, usuarios: [], gestor: null });\n  closeModal();\n  showToast('Equipe criada');\n  render();\n}\n\nfunction openEditarEquipe(equipeId) {\n  const e = STATE.equipes.find(x => x.id === equipeId);\n  const membros = e.usuarios.map(uid => {\n    const u = STATE.usuarios.find(x => x.id === uid);\n    return `\n      \u003cdiv class=\"list-item-row\">\n        \u003cspan style=\"font-size:12.5px;\">${u.nome}\u003c/span>\n        \u003cspan style=\"display:flex;align-items:center;gap:6px;\">\n          \u003cselect style=\"font-size:11px;padding:3px 6px;border:1px solid #CBD5E1;border-radius:4px;\">\n            \u003coption ${u.visibilidade==='Restrita'?'selected':''}>Restrita\u003c/option>\n            \u003coption ${u.visibilidade==='Equipe'?'selected':''}>Equipe\u003c/option>\n            \u003coption ${u.visibilidade==='Geral'?'selected':''}>Geral\u003c/option>\n          \u003c/select>\n          \u003cspan style=\"color:#94A3B8;cursor:pointer;\" onclick=\"removerDaEquipe(${equipeId}, ${uid})\">✕\u003c/span>\n        \u003c/span>\n      \u003c/div>\n    `;\n  }).join('') || '\u003cdiv class=\"empty-hint\">Nenhum usuário nesta equipe ainda.\u003c/div>';\n\n  openDrawer(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:14px;\">\u003ch3>Editar equipe\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeDrawer()\">✕\u003c/span>\u003c/div>\n    \u003clabel class=\"field-label\">Nome da equipe\u003c/label>\n    \u003cinput class=\"field-input\" value=\"${e.nome}\">\n    \u003clabel class=\"field-label\">Adicionar usuário\u003c/label>\n    \u003cinput class=\"field-input\" placeholder=\"Buscar por nome\">\n    \u003cdiv class=\"visibility-legend\">\n      \u003cstrong>Restrita\u003c/strong>: só vê os próprios registros &nbsp; \u003cstrong>Equipe\u003c/strong>: vê da(s) equipe(s) &nbsp; \u003cstrong>Geral\u003c/strong>: vê tudo\n    \u003c/div>\n    \u003cdiv class=\"subsection-title\">Usuários nesta equipe\u003c/div>\n    ${membros}\n    \u003cdiv class=\"drawer-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeDrawer()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"closeDrawer(); showToast('Alterações salvas')\">Salvar\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction removerDaEquipe(equipeId, userId) {\n  const e = STATE.equipes.find(x => x.id === equipeId);\n  e.usuarios = e.usuarios.filter(id => id !== userId);\n  closeDrawer();\n  showToast('Usuário removido da equipe');\n  render();\n}\n\n/* ============ ABA PERMISSÕES ============ */\nfunction renderPermissoes() {\n  let rows = STATE.perfis.map(p => `\n    \u003cdiv class=\"list-item-row\" style=\"${!p.fixo?'cursor:pointer;':''}\" ${!p.fixo?`onclick=\"openDetalhePerfil('${p.nome}')\"`:''}>\n      \u003cdiv>\n        \u003cdiv style=\"display:flex;align-items:center;gap:8px;\">\u003cstrong style=\"font-size:13px;\">${p.nome}\u003c/strong>\u003cspan style=\"font-size:10px;background:#F1EFE8;color:#5F5E5A;padding:2px 8px;border-radius:10px;\">${p.tipo}\u003c/span>\u003c/div>\n        \u003cp style=\"font-size:11.5px;color:#94A3B8;margin:4px 0 0;\">${p.desc}\u003c/p>\n      \u003c/div>\n      ${!p.fixo ? `\u003cbutton class=\"btn-icon\" onclick=\"event.stopPropagation(); openPerfilCtx(event, '${p.nome}')\">⋮\u003c/button>` : ''}\n    \u003c/div>\n  `).join('');\n\n  document.getElementById('tab-content').innerHTML = `\n    \u003cdiv style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;\">\n      \u003cp style=\"font-size:11.5px;color:#64748B; max-width:520px;\">Crie perfis com permissões personalizadas. Todos os perfis criados têm as mesmas permissões básicas do perfil Usuário.\u003c/p>\n      \u003cbutton class=\"btn primary\" onclick=\"openCriarPerfil()\">+ Criar novo perfil\u003c/button>\n    \u003c/div>\n    \u003cdiv style=\"border-top:1px solid #E2E8F0;\">${rows}\u003c/div>\n  `;\n}\n\nfunction openPerfilCtx(evt, nome) {\n  const menu = document.getElementById('ctx-menu');\n  menu.innerHTML = `\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); openDetalhePerfil('${nome}')\">✏️ Editar perfil\u003c/div>\n    \u003cdiv class=\"ctx-sep\">\u003c/div>\n    \u003cdiv class=\"ctx-item danger\" onclick=\"closeCtx(); excluirPerfil('${nome}')\">🗑️ Excluir perfil\u003c/div>\n  `;\n  const rect = evt.target.getBoundingClientRect();\n  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';\n  menu.style.left = (rect.left + window.scrollX - 170) + 'px';\n  menu.classList.add('open');\n}\n\nfunction excluirPerfil(nome) {\n  const afetados = STATE.usuarios.filter(u => u.perfil === nome);\n  afetados.forEach(u => u.perfil = 'Usuário');\n  STATE.perfis = STATE.perfis.filter(p => p.nome !== nome);\n  if (afetados.length) {\n    showToast(`Perfil excluído; ${afetados.length} usuário(s) movido(s) para \"Usuário\"`);\n  } else {\n    showToast('Perfil excluído');\n  }\n  render();\n}\n\nfunction openCriarPerfil() {\n  openModal(`\n    \u003cdiv style=\"display:flex; justify-content:space-between; margin-bottom:6px;\">\u003ch3>Criar novo perfil\u003c/h3>\u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\u003c/div>\n    \u003cp style=\"font-size:11.5px;color:#64748B;margin:0 0 14px;\">Primeiro, escolha o nome do novo perfil.\u003c/p>\n    \u003clabel class=\"field-label\">Nome do perfil\u003c/label>\n    \u003cinput class=\"field-input\" id=\"novo-perfil-nome\" placeholder=\"Digite aqui o nome do perfil\">\n    \u003cp class=\"field-note\" id=\"nome-perfil-erro\" style=\"color:#E45858; display:none;\">Já existe um perfil com esse nome.\u003c/p>\n    \u003cdiv class=\"modal-footer\">\n      \u003cbutton class=\"btn\" onclick=\"closeModal()\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"confirmarCriarPerfil()\">Criar perfil\u003c/button>\n    \u003c/div>\n  `);\n}\n\nfunction confirmarCriarPerfil() {\n  const nome = document.getElementById('novo-perfil-nome').value.trim();\n  if (!nome) return;\n  if (STATE.perfis.some(p => p.nome.toLowerCase() === nome.toLowerCase())) {\n    document.getElementById('nome-perfil-erro').style.display = 'block';\n    return;\n  }\n  const newId = Math.max(...STATE.perfis.map(p=>p.id)) + 1;\n  STATE.perfis.push({ id: newId, nome, tipo: 'Perfil personalizado', fixo: false, desc: 'Perfil personalizado' });\n  closeModal();\n  showToast('Perfil criado com permissões básicas do Usuário');\n  render();\n}\n\nfunction openDetalhePerfil(nomePerfil) {\n  activePermCategory = 'Análises';\n  renderDetalhePerfilModal(nomePerfil);\n}\n\nfunction renderDetalhePerfilModal(nomePerfil) {\n  const categorias = Object.keys(perms);\n  const catAtual = perms[activePermCategory];\n\n  const rowsPerm = catAtual.map(p => `\n    \u003cdiv class=\"perm-row\">\n      \u003cdiv>\n        \u003cspan class=\"perm-name\">${p.nome}\u003c/span>${p.dep ? '\u003cspan class=\"dep-tag\">⚙ depende de Preferências\u003c/span>' : ''}\n        ${p.desc ? `\u003cp class=\"perm-desc\">${p.desc}\u003c/p>` : ''}\n      \u003c/div>\n      \u003cinput type=\"checkbox\">\n    \u003c/div>\n  `).join('');\n\n  openModal(`\n    \u003cdiv style=\"width:640px; max-width:90vw;\">\n      \u003cdiv style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;\">\n        \u003ch3>${nomePerfil} ✏️\u003c/h3>\n        \u003cspan style=\"cursor:pointer;color:#94A3B8;\" onclick=\"closeModal()\">✕\u003c/span>\n      \u003c/div>\n      \u003cp style=\"font-size:11px;color:#64748B;margin:0 0 14px;\">Este perfil tem as mesmas permissões básicas que o perfil de Usuário.\u003c/p>\n      \u003cdiv class=\"profile-detail\">\n        \u003cdiv class=\"profile-sidebar\">\n          ${categorias.map(c => `\u003cdiv class=\"profile-sidebar-item ${c===activePermCategory?'active':''}\" onclick=\"trocarCategoria('${nomePerfil}','${c}')\">${c}\u003c/div>`).join('')}\n        \u003c/div>\n        \u003cdiv class=\"profile-content\">\n          \u003cdiv class=\"subsection-title\" style=\"margin-top:0;\">${activePermCategory}\u003c/div>\n          ${rowsPerm}\n          \u003cdiv class=\"modal-footer\">\n            \u003cbutton class=\"btn primary\" style=\"background:#94A3B8;\" onclick=\"showToast('Permissões salvas')\">Salvar\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `);\n}\n\nfunction trocarCategoria(nomePerfil, cat) {\n  activePermCategory = cat;\n  renderDetalhePerfilModal(nomePerfil);\n}\n\n/* Fix modal box width override for the wider profile modal */\nconst style = document.createElement('style');\nstyle.textContent = `#modal-box:has(.profile-detail) { width: auto; }`;\ndocument.head.appendChild(style);\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"funil":{"icon":"📊","title":"Funil de Vendas","description":"Funis, etapas, preferências e negociações.","stat":"1 funil configurado","html":"\n\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Protótipo; CRM Vigos (Funil de Vendas)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root {\n    --navy-deep: #0B1929;\n    --teal: #00D9C0;\n    --teal-dim: #0a5f56;\n    --bg-page: #F7F9FB;\n    --text-dark: #16232F;\n    --text-muted: #64748B;\n    --border-light: #E2E8F0;\n    --amber: #F5A623;\n    --amber-bg: #FEF3E2;\n    --red: #E45858;\n    --red-bg: #FCEAEA;\n    --green: #1FAA6E;\n    --green-bg: #E7F7EF;\n    --blue-bg: #E6F1FB;\n    --blue-text: #0C447C;\n  }\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body {\n    font-family: 'Inter', -apple-system, sans-serif;\n    background: var(--bg-page);\n    color: var(--text-dark);\n    min-height: 100vh;\n  }\n\n  .proto-banner {\n    background: var(--navy-deep);\n    color: #fff;\n    padding: 10px 24px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 10px;\n    text-align: center;\n  }\n  .proto-banner strong { color: var(--teal); }\n\n  .app-shell {\n    max-width: 1400px;\n    margin: 24px auto;\n    background: #fff;\n    border-radius: 12px;\n    box-shadow: 0 4px 24px rgba(11,25,41,0.08);\n    overflow: hidden;\n    min-height: 720px;\n    display: flex;\n  }\n\n  .app-sidebar {\n    width: 64px;\n    background: var(--navy-deep);\n    flex-shrink: 0;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: 20px 0;\n    gap: 24px;\n  }\n  .app-sidebar .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--teal); margin-bottom: 12px; }\n  .app-sidebar .icon { width: 22px; height: 22px; color: rgba(255,255,255,0.5); }\n  .app-sidebar .icon.active { color: var(--teal); }\n\n  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n\n  .app-topbar {\n    height: 56px;\n    border-bottom: 1px solid var(--border-light);\n    display: flex;\n    align-items: center;\n    padding: 0 24px;\n    gap: 12px;\n    flex-shrink: 0;\n    position: relative;\n  }\n  .app-topbar .crm-label { font-weight: 700; color: var(--teal-dim); font-size: 15px; cursor: pointer; }\n  .app-topbar .crumb { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); margin-left: auto; }\n  .account-name { margin-left: auto; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 6px; }\n  .account-name:hover { background: var(--bg-page); }\n\n  .app-content { flex: 1; padding: 24px 32px; overflow-y: auto; position: relative; }\n\n  h3 { font-size: 15px; margin: 0; }\n  input, select, textarea { font-family: inherit; }\n  button { font-family: inherit; cursor: pointer; }\n\n  .modal-overlay {\n    position: fixed; inset: 0; background: rgba(11,25,41,0.45);\n    display: none; align-items: center; justify-content: center; z-index: 100;\n  }\n  .modal-overlay.open { display: flex; }\n  .modal-box {\n    background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(11,25,41,0.2);\n    width: 440px; max-width: 90vw; padding: 1.5rem; max-height: 85vh; overflow-y: auto;\n  }\n\n  .drawer-overlay { position: fixed; inset: 0; background: rgba(11,25,41,0.35); display: none; z-index: 90; }\n  .drawer-overlay.open { display: block; }\n  .drawer {\n    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92vw;\n    background: #fff; box-shadow: -8px 0 30px rgba(11,25,41,0.15); padding: 1.5rem;\n    overflow-y: auto; transform: translateX(100%); transition: transform 0.25s ease; z-index: 95;\n  }\n  .drawer.open { transform: translateX(0); }\n\n  .ctx-menu {\n    position: absolute; background: #fff; border: 1px solid var(--border-light);\n    border-radius: 8px; box-shadow: 0 8px 24px rgba(11,25,41,0.12); padding: 6px;\n    width: 210px; z-index: 80; display: none;\n  }\n  .ctx-menu.open { display: block; }\n  .ctx-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }\n  .ctx-item:hover { background: var(--bg-page); }\n  .ctx-item.danger { color: var(--red); }\n  .ctx-item.muted { color: var(--text-muted); }\n  .ctx-sep { border-top: 1px solid var(--border-light); margin: 4px 0; }\n\n  .toast {\n    position: fixed; top: 20px; right: 20px; background: #fff; border-radius: 8px;\n    box-shadow: 0 8px 24px rgba(11,25,41,0.15); padding: 12px 18px; display: flex;\n    align-items: center; gap: 10px; font-size: 13px; font-weight: 600; z-index: 200;\n    transform: translateX(120%); transition: transform 0.25s ease;\n  }\n  .toast.show { transform: translateX(0); }\n  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }\n\n  .btn { font-size: 12.5px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border-light); background: #fff; font-weight: 500; }\n  .btn.primary { background: var(--navy-deep); color: #fff; border: none; }\n  .btn.danger-fill { background: var(--red); color: #fff; border: none; }\n  .btn.disabled { opacity: 0.5; cursor: not-allowed; }\n  .btn-icon { background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; }\n  .btn-icon:hover { background: var(--bg-page); }\n\n  .field-label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; }\n  .field-input { width: 100%; font-size: 13px; padding: 9px 11px; border: 1px solid #CBD5E1; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }\n  .field-note { font-size: 11px; color: var(--text-muted); margin: -6px 0 12px; }\n  .info-box { background: var(--blue-bg); color: var(--blue-text); border-radius: 6px; padding: 9px 13px; font-size: 12px; margin-bottom: 14px; }\n  .warn-box { background: var(--amber-bg); color: #9A6314; border-radius: 6px; padding: 9px 13px; font-size: 12px; margin-bottom: 14px; }\n  .danger-box { background: var(--red-bg); color: #791F1F; border-radius: 6px; padding: 9px 13px; font-size: 12px; margin-bottom: 14px; }\n\n  .modal-footer, .drawer-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-light); }\n\n  .subsection-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }\n\n  /* Trilha de etapas */\n  .trilha { display: flex; align-items: center; margin: 1rem 0 0.5rem; position: relative; }\n  .trilha-linha { flex: 1; height: 2px; background: var(--teal); }\n  .trilha-bolinha { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--teal); flex-shrink: 0; cursor: pointer; background: #fff; }\n  .trilha-bolinha.selecionada { background: var(--teal); box-shadow: 0 0 0 4px rgba(0,217,192,0.2); }\n  .trilha-add { width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #062b26; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; border: none; }\n  .trilha-setas { display: flex; align-items: center; gap: 2px; background: var(--teal); border-radius: 10px; padding: 2px 6px; margin: 0 4px; flex-shrink: 0; }\n  .trilha-setas span { color: #062b26; font-size: 11px; cursor: pointer; padding: 0 2px; }\n\n  .etapas-grid { display: grid; gap: 10px; font-size: 11px; color: #47576A; margin-top: 0.75rem; }\n  .etapa-card strong { font-size: 12.5px; color: var(--text-dark); display: block; margin-bottom: 2px; }\n  .etapa-card .toggle-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }\n  .mini-toggle { width: 26px; height: 14px; background: #CBD5E1; border-radius: 8px; position: relative; flex-shrink: 0; cursor: pointer; border: none; padding: 0; }\n  .mini-toggle.on { background: var(--teal); }\n  .mini-toggle .knob { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; left: 2px; top: 2px; transition: left 0.15s ease; }\n  .mini-toggle.on .knob { left: 14px; }\n  .cfg-link { color: var(--blue-text); margin: 6px 0 0; cursor: pointer; font-size: 11px; }\n\n  .kanban-col { background: var(--bg-page); border-radius: 8px; padding: 10px; min-height: 60px; }\n  .kanban-col p.titulo { font-size: 12px; font-weight: 600; margin: 0 0 4px; }\n  .kanban-col p.valor { font-size: 11px; color: var(--text-muted); margin: 0; }\n\n  table { width: 100%; border-collapse: collapse; font-size: 12px; }\n  th { text-align: left; padding: 6px; font-weight: 500; color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--border-light); }\n  td { padding: 8px 6px; border-bottom: 1px solid #F0F3F6; }\n  tr:last-child td { border-bottom: none; }\n\n  .cfg-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; font-size: 11.5px; }\n  .cfg-grid p.eyebrow { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin: 0 0 6px; }\n  .cfg-link-item { margin: 4px 0; cursor: pointer; }\n  .cfg-link-item.highlight { background: #F0F9F7; color: var(--teal-dim); font-weight: 600; padding: 3px 6px; border-radius: 4px; }\n\n  .empty-hint { font-size: 11.5px; color: var(--text-muted); text-align: center; padding: 24px; border: 1.5px dashed var(--border-light); border-radius: 8px; }\n\u003c/style>\n\u003cstyle>\n  .proto-banner{display:none!important}\n  .app-shell{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}\n  .app-sidebar,.sidebar{display:none!important}\n  body{background:#fff!important;color:#102d3d!important}\n  .app-topbar,.topbar{background:#fff!important;color:#102d3d!important;border-bottom:1px solid #e3e9ee!important}\n  .app-content{padding:28px 34px!important}\n  button,.btn{border-radius:6px!important}\n  .btn.primary,.btn-primary{background:#06283b!important;color:#fff!important}\n  .summary-card{border:1px solid #e3e9ee!important;background:#f8fafb!important}\n  table th{color:#607486!important;font-weight:600!important}\n  .entity-icon{font-family:Inter,sans-serif!important}\n\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"proto-banner\">🔧 \u003cstrong>PROTÓTIPO NAVEGÁVEL\u003c/strong>; Funil de Vendas (Funil, Etapas, Motivo de Perda, Produtos e Serviços); demonstra o fluxo principal de uso. Regras completas estão no site de documentação, não aqui.\u003c/div>\n\n\u003cdiv class=\"app-shell\">\n  \u003cdiv class=\"app-sidebar\">\n    \u003cdiv class=\"logo\">\u003c/div>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\"/>\u003c/svg>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/>\u003cline x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/>\u003cline x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/>\u003c/svg>\n    \u003csvg class=\"icon active\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/>\u003ccircle cx=\"9\" cy=\"7\" r=\"4\"/>\u003c/svg>\n    \u003csvg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cline x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/>\u003cline x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/>\u003cline x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/>\u003c/svg>\n  \u003c/div>\n\n  \u003cdiv class=\"app-main\">\n    \u003cdiv class=\"app-topbar\">\n      \u003cspan class=\"crm-label\" onclick=\"goToNegociacoes()\">CRM Vigos\u003c/span>\n      \u003cspan class=\"crumb\" id=\"breadcrumb\">Negociações\u003c/span>\n      \u003cspan class=\"account-name\" onclick=\"toggleAccountMenu(event)\">👤 Rede Filantropia ▾\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"app-content\" id=\"app-content\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"toast-text\">Ação concluída\u003c/span>\u003c/div>\n\u003cdiv class=\"ctx-menu\" id=\"ctx-menu\">\u003c/div>\n\u003cdiv class=\"modal-overlay\" id=\"modal-overlay\">\u003cdiv class=\"modal-box\" id=\"modal-box\">\u003c/div>\u003c/div>\n\u003cdiv class=\"drawer-overlay\" id=\"drawer-overlay\">\u003c/div>\n\u003cdiv class=\"drawer\" id=\"drawer\">\u003c/div>\n\n\u003cscript>\n/* ============ ESTADO ============ */\nconst STATE = {\n  view: 'negociacoes', // negociacoes | config-funis | config-geral | motivo-perda | produtos\n  funis: [\n    {\n      id: 1,\n      nome: 'Funil Padrão',\n      padrao: true,\n      arquivado: false,\n      equipesVisiveis: [],\n      etapas: [\n        { id: 1, nome: 'Sem contato', sigla: 'SC', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 1 },\n        { id: 2, nome: 'Contato feito', sigla: 'CF', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n        { id: 3, nome: 'Identificação do interesse', sigla: 'IDI', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n        { id: 4, nome: 'Apresentação', sigla: 'A', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n        { id: 5, nome: 'Proposta enviada', sigla: 'PE', destacarEsfriando: false, dias: 1, descricao: '', negociacoes: 0 },\n      ],\n    },\n  ],\n  activeFunilId: 1,\n  motivosPerda: [\n    { id: 1, nome: 'Preço', criadoEm: '20/09/2022', exibirNoFunil: false },\n    { id: 2, nome: 'Não tem interesse', criadoEm: '15/09/2023', exibirNoFunil: false },\n    { id: 3, nome: 'Sem retorno no contato', criadoEm: '15/09/2023', exibirNoFunil: false },\n  ],\n  prefAbaAtiva: 'produtos',\n  produtos: [\n    { id: 1, nome: 'Curso Online', descricao: 'Redação prática com IA', valor: 'R$ 300,00', exibirNoFunil: true },\n    { id: 2, nome: '49 estratégias de captação', descricao: 'Para sua organização', valor: 'R$ 600,00', exibirNoFunil: true },\n  ],\n  equipes: [\n    { id: 1, nome: 'TESTE CRM VIGOS' },\n  ],\n  funilCriadoContador: 1,\n  etapaSelecionadaId: null,\n};\n\nlet nextFunilId = 2;\nlet nextEtapaId = 6;\nlet nextMotivoId = 4;\nlet nextProdutoId = 3;\n\n/* ============ HELPERS ============ */\nfunction showToast(text) {\n  document.getElementById('toast-text').textContent = text;\n  const t = document.getElementById('toast');\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 2600);\n}\nfunction closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }\nfunction closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }\nfunction closeCtx() { document.getElementById('ctx-menu').classList.remove('open'); }\nfunction openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal-overlay').classList.add('open'); }\nfunction openDrawer(html) { document.getElementById('drawer').innerHTML = html; document.getElementById('drawer-overlay').classList.add('open'); document.getElementById('drawer').classList.add('open'); }\n\ndocument.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });\ndocument.getElementById('drawer-overlay').addEventListener('click', closeDrawer);\ndocument.addEventListener('click', (e) => {\n  if (!e.target.closest('.ctx-menu') && !e.target.closest('.btn-icon') && !e.target.closest('.account-name')) closeCtx();\n});\n\nfunction activeFunil() { return STATE.funis.find(f => f.id === STATE.activeFunilId); }\n\nfunction goToNegociacoes() { STATE.view = 'negociacoes'; render(); }\n\n/* ============ ACCOUNT MENU ============ */\nfunction toggleAccountMenu(evt) {\n  evt.stopPropagation();\n  const menu = document.getElementById('ctx-menu');\n  if (menu.classList.contains('open')) { closeCtx(); return; }\n  menu.innerHTML = `\n    \u003cdiv style=\"padding:10px 12px;border-bottom:1px solid #E2E8F0;margin-bottom:4px;\">\n      \u003cp style=\"font-size:12.5px;font-weight:600;margin:0;\">Rede Filantropia\u003c/p>\n      \u003cp style=\"font-size:10.5px;color:#94A3B8;margin:2px 0 0;\">rede-filantropia\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"ctx-item\">Conta\u003c/div>\n    \u003cdiv class=\"ctx-item\" onclick=\"closeCtx(); STATE.view='config-geral'; render();\" style=\"font-weight:600;color:#0a5f56;\">Configurações\u003c/div>\n    \u003cdiv class=\"ctx-item\">Planos\u003c/div>\n    \u003cdiv class=\"ctx-item\">Integração RD Station Marketing\u003c/div>\n    \u003cdiv class=\"ctx-sep\">\u003c/div>\n    \u003cdiv class=\"ctx-item\">↔ Trocar de conta\u003c/div>\n  `;\n  const rect = evt.target.getBoundingClientRect();\n  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';\n  menu.style.left = (rect.right + window.scrollX - 260) + 'px';\n  menu.style.width = '260px';\n  menu.classList.add('open');\n}\n\n/* ============ RENDER PRINCIPAL ============ */\nfunction render() {\n  const c = document.getElementById('app-content');\n  const bc = document.getElementById('breadcrumb');\n\n  if (STATE.view === 'negociacoes') { bc.textContent = 'Negociações'; renderNegociacoes(c); }\n  else if (STATE.view === 'config-funis') { bc.textContent = 'Funis de vendas / Configurações'; renderConfigFunis(c); }\n  else if (STATE.view === 'config-geral') { bc.textContent = 'Configurações'; renderConfigGeral(c); }\n  else if (STATE.view === 'motivo-perda') { bc.textContent = 'Motivo de Perda / Configurações'; renderMotivoPerda(c); }\n  else if (STATE.view === 'produtos') { bc.textContent = 'Produtos e Serviços / Configurações'; renderProdutos(c); }\n}\n\n/* ============ TELA 1-2: NEGOCIAÇÕES (kanban) ============ */\nfunction renderNegociacoes(c) {\n  const f = activeFunil();\n  const funisAtivos = STATE.funis.filter(x => !x.arquivado);\n  c.innerHTML = `\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;\">\n      \u003ch3 style=\"font-size:16px;\">Negociações\u003c/h3>\n      \u003cbutton class=\"btn primary\">+ Criar\u003c/button>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;gap:8px;margin-bottom:1rem;position:relative;\">\n      \u003cdiv class=\"field-input\" style=\"margin:0;width:180px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;\" onclick=\"toggleFunilDropdown(event)\">\n        \u003cspan>${f.nome} ▾\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"field-input\" style=\"margin:0;width:170px;padding:6px 10px;\">Minhas negociações ▾\u003c/div>\n      \u003cdiv class=\"field-input\" style=\"margin:0;width:150px;padding:6px 10px;\">Todos os status ▾\u003c/div>\n      \u003cdiv id=\"funil-dropdown\" style=\"display:none;position:absolute;top:38px;left:0;background:#fff;border-radius:8px;width:220px;box-shadow:0 8px 24px rgba(11,25,41,0.15);border:1px solid #E2E8F0;z-index:10;\">\n        \u003cp style=\"font-size:10px;color:#94A3B8;text-transform:uppercase;padding:10px 14px 4px;margin:0;\">Funil de vendas\u003c/p>\n        ${renderFunilDropdownItems(funisAtivos, f)}\n        \u003cdiv style=\"border-top:1px solid #E2E8F0;padding:9px 14px;font-size:13px;color:#0C447C;cursor:pointer;\" onclick=\"STATE.view='config-funis'; render();\">Configurar funis\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(${Math.min(f.etapas.length+1,6)},1fr);gap:10px;\">\n      ${renderKanbanCols(f.etapas)}\n      \u003cdiv style=\"background:#F0F9F7;border-radius:8px;padding:10px;border:1px dashed #B8E6DC;\">\n        \u003cp style=\"font-size:11.5px;color:#0a5f56;margin:0 0 8px;font-weight:600;\">Personalize seu funil de vendas\u003c/p>\n        \u003cp style=\"font-size:10.5px;color:#0a5f56;margin:0;\">Crie funis e edite-os, adicionando, removendo e renomeando etapas conforme o processo de vendas da sua equipe\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  `;\n}\n\nfunction renderFunilDropdownItems(funisAtivos, f) {\n  let html = '';\n  for (const fn of funisAtivos) {\n    const estilo = fn.id === f.id ? 'background:#E6F1FB;color:#0C447C;font-weight:600;' : 'color:#16232F;';\n    html += '\u003cdiv onclick=\"selecionarFunil(' + fn.id + ')\" style=\"padding:9px 14px;font-size:13px;cursor:pointer;' + estilo + '\">' + fn.nome + '\u003c/div>';\n  }\n  return html;\n}\n\nfunction renderKanbanCols(etapas) {\n  let html = '';\n  for (const e of etapas) {\n    html += '\u003cdiv class=\"kanban-col\">\u003cp class=\"titulo\">' + e.nome + ' \u003cspan style=\"color:#94A3B8;font-weight:400;\">(' + e.negociacoes + ')\u003c/span>\u003c/p>\u003cp class=\"valor\">R$ 0,00\u003c/p>\u003c/div>';\n  }\n  return html;\n}\n\nfunction toggleFunilDropdown(evt) {\n  evt.stopPropagation();\n  const el = document.getElementById('funil-dropdown');\n  el.style.display = el.style.display === 'none' ? 'block' : 'none';\n}\nfunction selec
